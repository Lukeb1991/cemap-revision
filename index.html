<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>CeMAP 1 Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: single study column on exam-sheet paper; OMR answer bubbles and a timing-mark strip are the motif. Bottom tabs on phones, top tabs on desktop. */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#14211E; --muted:#56665F; --rule:#CCDBD5; --rule-strong:#97B7AC;
  --accent:#0B6B5B; --accent-ink:#FFFFFF; --accent-soft:#DFEEE9;
  --good:#1D7A45; --good-soft:#E2F2E7; --bad:#B53A25; --bad-soft:#F8E5E0; --warn:#9A6210; --warn-soft:#F6EDDA;
  --graphite:#262C30; --bubble-ink:#FFFFFF; --mark:#14211E;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1412; --surface:#151D1A; --ink:#E3ECE8; --muted:#97A8A1; --rule:#25322D; --rule-strong:#3B4E47;
  --accent:#52C4A9; --accent-ink:#04201A; --accent-soft:#143029;
  --good:#5FCB8D; --good-soft:#132D1E; --bad:#F08B74; --bad-soft:#381C16; --warn:#E3AD58; --warn-soft:#33270F;
  --graphite:#D7DEE0; --bubble-ink:#0E1412; --mark:#3B4E47; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1412; --surface:#151D1A; --ink:#E3ECE8; --muted:#97A8A1; --rule:#25322D; --rule-strong:#3B4E47;
  --accent:#52C4A9; --accent-ink:#04201A; --accent-soft:#143029;
  --good:#5FCB8D; --good-soft:#132D1E; --bad:#F08B74; --bad-soft:#381C16; --warn:#E3AD58; --warn-soft:#33270F;
  --graphite:#D7DEE0; --bubble-ink:#0E1412; --mark:#3B4E47; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--tabh) + 24px + env(safe-area-inset-bottom, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,38px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
.label{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* Header with OMR timing-mark strip */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;padding:12px max(16px, env(safe-area-inset-left, 0px)) 0}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
@media (hover:none){.kbd{display:none}}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.timing{max-width:720px;margin:10px auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--mark) 0 10px,transparent 10px 22px);opacity:.85}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:8px 6px;border-radius:10px;flex:1}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs.desk{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--rule);
  padding:6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px))}
.tabbar .tabs{max-width:720px;margin:0 auto}
@media (min-width:760px){
  body{padding-bottom:48px}
  .tabbar{display:none}
  .tabs.desk{display:flex;margin-left:8px;flex:1;justify-content:center}
  .tabs.desk button{flex:0 0 auto;flex-direction:row;font-size:14px;padding:8px 10px;gap:6px}
  .brand span{display:none}
  .brand,.count{flex-shrink:0}
  .tabs.desk button svg{width:18px;height:18px}
  .tabs.desk button[aria-current="page"]{background:var(--accent-soft)}
}

main{padding-top:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;align-items:center}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--rule-strong);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Today */
.hello p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.today-plan{border-left:4px solid var(--accent)}
.today-plan .label{color:var(--accent)}
.today-plan h2{margin:4px 0 6px}
.today-plan p{margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{appearance:none;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:17px;font-weight:600}
.tile span{font-size:13.5px;color:var(--muted)}
.tile .big{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}

/* Topic list */
.topics{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.topic{appearance:none;border:0;background:none;text-align:left;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 14px;border-top:1px solid var(--rule)}
.topic:first-child{border-top:0}
.topic:hover{background:var(--accent-soft)}
.topic .code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.topic .nm{font-weight:700;line-height:1.3}
.topic .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{grid-column:2 / 4;height:6px;border-radius:999px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--good)}
.bar .no{background:var(--bad);opacity:.75}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Week plan */
.week{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--rule)}
.day:first-child{border-top:0}
.day .d{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);line-height:1.35;padding-top:2px}
.day .d b{display:block;font-size:18px;color:var(--ink)}
.day.now{background:var(--accent-soft)}
.day.now .d,.day.now .d b{color:var(--accent)}
.day.past{opacity:.6}
.day p{margin:2px 0 0;font-size:14.5px}
.day .t{font-weight:700}

/* Quiz */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .grow{min-width:120px}
.timer{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:6px 10px;border-radius:8px;border:1px solid var(--rule-strong)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:5px;border-radius:2px;background:var(--rule)}
.segs i.cur{background:var(--ink)}
.segs i.ok{background:var(--good)}
.segs i.no{background:var(--bad)}
.segs i.ans{background:var(--rule-strong)}
.case{border:1px dashed var(--rule-strong);border-radius:var(--r);background:var(--surface)}
.case summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:baseline;list-style:none}
.case summary::-webkit-details-marker{display:none}
.case summary .label{white-space:nowrap}
.case summary::after{content:"Show";margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.case[open] summary::after{content:"Hide"}
.case .ct{padding:0 14px 14px;margin:0;font-size:15px;max-width:65ch}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:19px;line-height:1.45;font-weight:700;margin:0 0 16px;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;width:100%;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:11px 12px;display:grid;grid-template-columns:32px minmax(0,1fr) 22px;gap:12px;align-items:center;cursor:pointer;font-size:16px;line-height:1.4;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--rule-strong);background:var(--paper)}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,border-color .15s}
.opt:hover:not([disabled]) .bub{border-color:var(--ink)}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--bubble-ink)}
.opt.sel{border-color:var(--graphite)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--bubble-ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--bubble-ink)}
.opt[disabled]{cursor:default}
.opt .mk{font-weight:700;font-size:18px;text-align:center}
.opt.right .mk{color:var(--good)} .opt.wrong .mk{color:var(--bad)}
.why{margin-top:14px;border-radius:10px;padding:14px 16px;background:var(--paper);border:1px solid var(--rule)}
.why .verdict{font-family:var(--f-display);font-weight:800;font-size:18px;margin-bottom:4px}
.why.ok .verdict{color:var(--good)} .why.no .verdict{color:var(--bad)}
.why p{margin:0;max-width:65ch}
.why .rev{margin-top:10px;font-size:13.5px;color:var(--muted)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.qnav .grow{flex:1}
.grid40{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.gcell{appearance:none;border:1px solid var(--rule-strong);background:var(--surface);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;cursor:pointer;display:grid;place-items:center;position:relative;padding:0}
.gcell.ans{background:var(--graphite);color:var(--bubble-ink);border-color:var(--graphite)}
.gcell.cur{outline:3px solid var(--accent);outline-offset:1px}
.gcell.flag::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.gcell.ok{background:var(--good);border-color:var(--good);color:var(--bubble-ink)}
.gcell.no{background:var(--bad);border-color:var(--bad);color:var(--bubble-ink)}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:14px 16px}
.confirm p{margin:0 0 10px}

/* Results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1}
.band{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.band.pass{background:var(--good-soft);color:var(--good)}
.band.fail{background:var(--bad-soft);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-top:1px solid var(--rule);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px}
.rv .q{font-weight:700;margin:4px 0 8px}
.rv .a{font-size:14.5px;margin:2px 0}
.rv .a.y{color:var(--bad)} .rv .a.c{color:var(--good)}
.rv .e{font-size:14px;color:var(--muted);margin-top:6px}

/* Flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:280px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--rule);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface);border-color:var(--rule-strong)}
.face .ft{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,28px);line-height:1.2;margin:auto 0;text-wrap:balance}
.face .bt{white-space:pre-line;font-size:16.5px;line-height:1.6;margin:0}
.face .hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:auto}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}.bub{transition:none}}

/* Figures */
.fig h3{margin-bottom:8px}
.fig .tbl td:last-child{font-family:var(--f-mono);font-size:14px;font-weight:500;text-align:right}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.note b{color:var(--ink)}

@media (max-width:420px){
  .qtext{font-size:18px}
  .qcard{padding:16px}
  .stats .v{font-size:19px}
  .grid40{gap:5px}
}
</style>

</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand"><b>CeMAP 1</b><span>FSRE · FRE1 + FRE2</span></div>
    <nav class="tabs desk" id="tabsDesk" aria-label="Sections"></nav>
    <div class="count" id="count"></div>
  </div>
  <div class="timing" aria-hidden="true"></div>
</div>
<main class="wrap" id="view" tabindex="-1"></main>
<div class="tabbar"><nav class="tabs" id="tabsMob" aria-label="Sections"></nav></div>

<script>
const D = {"qs":[{"id":"u1t1-01","t":"u1t1","q":"Which of the following is NOT one of the recognised functions of money?","c":"A guarantee of capital growth","w":["A medium of exchange for goods and services","A store of value over time","A unit of account for pricing"],"e":"Money acts as a medium of exchange, a store of value, a unit of account and a standard of deferred payment. It does not guarantee growth."},{"id":"u1t1-02","t":"u1t1","q":"A bank takes short-term deposits from savers and uses them to fund 25-year mortgages. This is an example of:","c":"Maturity transformation","w":["Aggregation","Risk transformation","Disintermediation"],"e":"Maturity transformation turns short-term deposits into long-term loans. Aggregation is pooling small deposits; risk transformation is spreading risk across many borrowers."},{"id":"u1t1-03","t":"u1t1","q":"A bank pools thousands of small deposits to make one large loan to a business. This is known as:","c":"Aggregation","w":["Maturity transformation","Securitisation","Quantitative easing"],"e":"Aggregation means combining many small sums into larger amounts that borrowers need."},{"id":"u1t1-04","t":"u1t1","q":"The market where newly issued shares are sold to investors for the first time is the:","c":"Primary market","w":["Secondary market","Money market","Derivatives market"],"e":"New issues are sold in the primary market. Existing shares then change hands in the secondary market."},{"id":"u1t1-05","t":"u1t1","q":"The money markets mainly deal in:","c":"Short-term borrowing and lending, typically for less than one year","w":["Long-term equity finance for companies, through share issues","Physical commodities such as oil, gold and wheat","Residential property transactions and mortgage lending"],"e":"Money markets are for short-term wholesale funds. Capital markets (shares and bonds) provide long-term finance."},{"id":"u1t1-06","t":"u1t1","q":"Gilts are:","c":"Bonds issued by the UK government","w":["Shares in the largest UK companies","Bonds issued only by local authorities","Deposit accounts guaranteed by the Bank of England"],"e":"Gilts (gilt-edged securities) are UK government bonds, issued via the Debt Management Office."},{"id":"u1t1-07","t":"u1t1","q":"Using the Debt Management Office's definitions, a gilt with 10 years left until redemption is classed as a:","c":"Medium","w":["Short","Long","Undated"],"e":"Shorts have up to 7 years to redemption, mediums 7 to 15 years, and longs over 15 years."},{"id":"u1t1-08","t":"u1t1","q":"If interest rates rise, the market price of existing fixed-interest bonds will generally:","c":"Fall","w":["Rise","Stay the same, because the coupon is fixed","Rise in line with inflation"],"e":"Bond prices move inversely to interest rates. When new bonds pay more, existing lower-coupon bonds become less attractive, so their price falls."},{"id":"u1t1-09","t":"u1t1","q":"Which statement about ordinary shareholders is correct?","c":"They usually have voting rights and rank last if the company is wound up","w":["They receive a fixed dividend before preference shareholders","They are guaranteed the return of their capital","They rank ahead of bondholders if the company fails"],"e":"Ordinary shareholders own the company and usually vote, but they are paid last on a winding-up, after creditors and preference shareholders."},{"id":"u1t1-10","t":"u1t1","q":"Preference shareholders normally:","c":"Receive a fixed dividend that is paid before any ordinary dividend","w":["Have more voting rights than ordinary shareholders at company meetings","Rank ahead of secured creditors on a winding-up","Receive a dividend that rises in line with profits"],"e":"Preference shares usually pay a fixed dividend with priority over ordinary dividends, but usually carry no or limited voting rights."},{"id":"u1t1-11","t":"u1t1","q":"The main drawback of direct investment in commercial property is that it:","c":"Can be illiquid and slow to sell","w":["Never produces any income","Is guaranteed to fall in value","Cannot be held by individuals"],"e":"Property can take months to sell and is costly to buy and sell, so liquidity is the key risk."},{"id":"u1t1-12","t":"u1t1","q":"Which asset class is generally the most liquid?","c":"Cash deposits","w":["Commercial property","Shares in an unlisted company","Fine art"],"e":"Cash on deposit can usually be accessed quickly with no risk to capital (other than inflation)."},{"id":"u1t1-13","t":"u1t1","q":"Which of these is a function of the Bank of England?","c":"Acting as lender of last resort to the banking system","w":["Setting income tax rates","Regulating the conduct of mortgage brokers","Running the Financial Ombudsman Service"],"e":"The Bank sets monetary policy, maintains financial stability, is banker to the government and banks, and acts as lender of last resort. Conduct of brokers is regulated by the FCA."},{"id":"u1t1-14","t":"u1t1","q":"Who sets Bank Rate in the UK?","c":"The Monetary Policy Committee of the Bank of England","w":["HM Treasury, on the advice of the Chancellor","The Financial Conduct Authority's board","The Prudential Regulation Committee of the Bank of England"],"e":"The MPC (nine members) sets Bank Rate to meet the government's 2% CPI inflation target."},{"id":"u1t1-15","t":"u1t1","q":"Which body within the Bank of England is responsible for macro-prudential regulation, identifying and reducing risks to the financial system as a whole?","c":"The Financial Policy Committee","w":["The Monetary Policy Committee","The Financial Conduct Authority","The Debt Management Office"],"e":"The FPC looks at system-wide risks. The PRA supervises individual firms; the MPC sets interest rates."},{"id":"u1t1-16","t":"u1t1","q":"A contract giving the right, but not the obligation, to buy or sell an asset at a set price on or before a set date is:","c":"An option","w":["A future","A swap","A gilt"],"e":"An option gives a right but not an obligation. A future is a binding obligation to buy or sell at a set price on a set date."},{"id":"u1t1-17","t":"u1t1","q":"Dealing in shares using confidential, price-sensitive information that has not yet been made public is:","c":"Insider dealing","w":["Money laundering","Market making","Short selling"],"e":"Insider dealing is a criminal offence under the Criminal Justice Act 1993 and a form of market abuse."},{"id":"u1t1-18","t":"u1t1","q":"A key feature of a building society is that it is:","c":"A mutual organisation owned by its members","w":["Owned by external shareholders","A government agency","Not allowed to offer savings accounts"],"e":"Building societies are mutuals, owned by their savers and borrowers, rather than by shareholders."},{"id":"u1t1-19","t":"u1t1","q":"A corporate bond rated BBB- (or Baa3) or higher is generally described as:","c":"Investment grade","w":["Sub-investment grade (high yield)","Government guaranteed","In default"],"e":"Bonds rated BBB-/Baa3 and above are investment grade. Lower-rated bonds are sub-investment grade or ‘junk’, paying higher yields for higher risk."},{"id":"u1t1-20","t":"u1t1","q":"The Alternative Investment Market (AIM) is:","c":"The London Stock Exchange's market for smaller, growing companies","w":["The London Stock Exchange's market for trading gilts","The London market for trading foreign currencies","An unregulated overseas exchange for start-up companies"],"e":"AIM is the LSE's junior market, with lighter listing requirements than the Main Market."},{"id":"u1t2a-01","t":"u1t2a","q":"Fiscal policy refers to:","c":"Government decisions on taxation and public spending","w":["The Bank of England setting interest rates","The regulation of financial advisers","The FCA controlling the exchange rate"],"e":"Fiscal policy is tax and spending, run by HM Treasury. Monetary policy (interest rates) is run by the Bank of England."},{"id":"u1t2a-02","t":"u1t2a","q":"Since 1997, responsibility for setting interest rates to meet the inflation target has rested with:","c":"The Bank of England's Monetary Policy Committee","w":["The Chancellor of the Exchequer, after consulting the Treasury","The Financial Conduct Authority","The Treasury Select Committee of the House of Commons"],"e":"Operational independence over interest rates was given to the Bank of England in 1997. The Chancellor still sets the target."},{"id":"u1t2a-03","t":"u1t2a","q":"The inflation target that the Monetary Policy Committee aims to meet is:","c":"2%, measured by the Consumer Prices Index (CPI)","w":["2%, measured by the Retail Prices Index (RPI)","3%, measured by CPI","2.5%, measured by RPIX"],"e":"The target is 2% CPI, set by the Chancellor each year."},{"id":"u1t2a-04","t":"u1t2a","q":"If CPI inflation is more than 1 percentage point above or below target, the Governor of the Bank of England must:","c":"Write an open letter to the Chancellor explaining why","w":["Offer to resign and hand over to a deputy governor","Automatically raise or cut Bank Rate by 0.25%","Report the matter to the FCA and the Treasury Committee"],"e":"An open letter, explaining why and what will be done, is required whenever inflation is more than 1 percentage point either side of 2%."},{"id":"u1t2a-05","t":"u1t2a","q":"A recession is commonly defined as:","c":"Two consecutive quarters of negative GDP growth","w":["Inflation above 5% for a whole calendar year","Unemployment rising above two million people","One quarter of falling house prices"],"e":"Two quarters in a row of falling output (GDP) is the usual technical definition of a recession."},{"id":"u1t2a-06","t":"u1t2a","q":"To bring down inflation, the Monetary Policy Committee would most likely:","c":"Raise Bank Rate","w":["Cut Bank Rate","Increase quantitative easing","Cut income tax"],"e":"Higher interest rates make borrowing dearer and saving more attractive, which reduces spending and inflationary pressure."},{"id":"u1t2a-07","t":"u1t2a","q":"Quantitative easing (QE) involves the Bank of England:","c":"Creating money to buy assets such as gilts, to push down longer-term interest rates","w":["Raising Bank Rate to discourage borrowing and reduce inflation","Selling the UK's gold reserves to raise money for the government","Lending directly to households to increase consumer spending"],"e":"QE increases the money supply by buying bonds, lowering yields and encouraging lending and spending. Selling those bonds back is quantitative tightening."},{"id":"u1t2a-08","t":"u1t2a","q":"Which government department is responsible for UK fiscal policy and the Budget?","c":"HM Treasury","w":["HM Revenue & Customs","The Department for Work and Pensions","The Bank of England"],"e":"HM Treasury sets tax and spending policy. HMRC collects tax; DWP runs benefits and the State Pension."},{"id":"u1t2a-09","t":"u1t2a","q":"HM Revenue & Customs' main role is to:","c":"Collect taxes and administer the tax system","w":["Decide the rates of income tax and National Insurance","Set interest rates","Supervise banks' capital"],"e":"HMRC collects and administers tax. Tax rates are decided by the Chancellor and Parliament."},{"id":"u1t2a-10","t":"u1t2a","q":"An EU regulation, as opposed to an EU directive:","c":"Applied directly in member states without needing national legislation","w":["Had to be written into national law by each member state","Was guidance only and not binding","Applied only to firms based outside the EU"],"e":"Regulations were directly applicable. Directives set objectives that each state had to transpose into its own law."},{"id":"u1t2a-11","t":"u1t2a","q":"Since Brexit, EU-derived law that remains part of UK law is now referred to as:","c":"Assimilated law","w":["Directly applicable law","Passported law","Temporary permissions law"],"e":"The Retained EU Law (Revocation and Reform) Act 2023 renamed retained EU law ‘assimilated law’ from 1 January 2024. FSMA 2023 lets regulators replace it with their own rules."},{"id":"u1t2a-12","t":"u1t2a","q":"Which EU directive, now reflected in UK rules, shaped investment business conduct such as client categorisation and best execution?","c":"MiFID II","w":["Solvency II","The Mortgage Credit Directive","The Insurance Distribution Directive"],"e":"The Markets in Financial Instruments Directive (MiFID, later MiFID II) governs investment services."},{"id":"u1t2a-13","t":"u1t2a","q":"Solvency II (now Solvency UK) mainly sets:","c":"Capital requirements for insurance companies","w":["Capital and liquidity requirements for banks","Conduct of business rules for mortgage advisers","Rules on advertising consumer credit products"],"e":"Solvency II/UK is the prudential regime for insurers. Banks are covered by the Basel standards (CRD/CRR)."},{"id":"u1t2a-14","t":"u1t2a","q":"Public sector net borrowing (PSNB) measures:","c":"The gap between government spending and income in a single year","w":["The total debt the government has built up over time","The amount households borrow each year","Total bank lending to businesses"],"e":"PSNB is the annual deficit. Public sector net debt is the accumulated total."},{"id":"u1t2a-15","t":"u1t2a","q":"Deflation is best described as:","c":"A sustained fall in the general level of prices","w":["A slowdown in the rate at which prices are rising","A cut in interest rates","A fall in GDP"],"e":"Deflation means prices are actually falling. A slowdown in the rate of price rises is called disinflation."},{"id":"u1t2a-16","t":"u1t2a","q":"The phase of the economic cycle marked by strong growth, low unemployment and rising inflationary pressure is the:","c":"Boom","w":["Recession","Trough","Depression"],"e":"The cycle runs boom, slowdown, recession/trough, then recovery."},{"id":"u1t2a-17","t":"u1t2a","q":"Which of the following is an example of the government's welfare role?","c":"Providing state benefits such as Universal Credit","w":["Setting Bank Rate to control inflation","Authorising mortgage lenders and brokers","Issuing banknotes and managing reserves"],"e":"The welfare role includes benefits, the State Pension and support for those in need, run by the DWP."},{"id":"u1t2b-01","t":"u1t2b","q":"For 2026/27, the standard personal allowance is:","c":"£12,570","w":["£12,750","£13,000","£11,850"],"e":"The personal allowance is £12,570 and is frozen until April 2031."},{"id":"u1t2b-02","t":"u1t2b","q":"The personal allowance is reduced by £1 for every £2 of adjusted net income above:","c":"£100,000","w":["£125,140","£50,270","£60,000"],"e":"It is withdrawn between £100,000 and £125,140, at which point it is nil."},{"id":"u1t2b-03","t":"u1t2b","q":"For 2026/27 in England, Wales and Northern Ireland, the basic rate band covers the first ___ of taxable income:","c":"£37,700","w":["£50,270","£37,500","£43,000"],"e":"The basic rate band is £37,700 of taxable income. With the personal allowance, higher rate starts at gross income of £50,270."},{"id":"u1t2b-04","t":"u1t2b","q":"The additional rate of income tax (45%) applies to taxable income above:","c":"£125,140","w":["£150,000","£100,000","£125,000"],"e":"The additional rate threshold has been £125,140 since 2023/24."},{"id":"u1t2b-05","t":"u1t2b","q":"A higher-rate taxpayer's personal savings allowance is:","c":"£500","w":["£1,000","£0","£5,000"],"e":"PSA: basic rate £1,000, higher rate £500, additional rate £0."},{"id":"u1t2b-06","t":"u1t2b","q":"An additional-rate taxpayer's personal savings allowance is:","c":"£0","w":["£500","£1,000","£250"],"e":"Additional-rate taxpayers get no personal savings allowance."},{"id":"u1t2b-07","t":"u1t2b","q":"For 2026/27, the dividend allowance is:","c":"£500","w":["£1,000","£2,000","£0"],"e":"The dividend allowance is £500 (it was £1,000 in 2023/24 and £2,000 before that)."},{"id":"u1t2b-08","t":"u1t2b","q":"From 6 April 2026, dividends above the dividend allowance that fall in the basic rate band are taxed at:","c":"10.75%","w":["8.75%","20%","7.5%"],"e":"The 2025 Budget raised the ordinary dividend rate from 8.75% to 10.75% and the upper rate from 33.75% to 35.75%. The additional rate stays at 39.35%."},{"id":"u1t2b-09","t":"u1t2b","q":"For 2026/27, dividends taxed at the higher rate are charged at:","c":"35.75%","w":["33.75%","40%","39.35%"],"e":"Dividend rates for 2026/27: 10.75% (basic), 35.75% (higher), 39.35% (additional)."},{"id":"u1t2b-10","t":"u1t2b","q":"The £5,000 starting rate for savings (taxed at 0%) is:","c":"Reduced by £1 for every £1 of non-savings income above the personal allowance","w":["Available in full to everyone, whatever their other income","Only available to people over State Pension age","Reduced by £1 for every £2 of total income above £100,000"],"e":"Once non-savings income exceeds £12,570 + £5,000 = £17,570, the starting rate band is used up."},{"id":"u1t2b-11","t":"u1t2b","q":"Income tax is calculated by treating income in which order?","c":"Non-savings income, then savings income, then dividends","w":["Dividends, then savings, then non-savings income","Savings, then dividends, then non-savings income","All income is taxed together in any order"],"e":"Earnings, pensions and rent come first, then savings interest, then dividends on top."},{"id":"u1t2b-12","t":"u1t2b","q":"Which of the following is free of income tax?","c":"Premium Bond prizes","w":["The State Pension","New Style Jobseeker's Allowance","Bank interest above the personal savings allowance"],"e":"Premium Bond prizes, ISA income and some benefits (such as PIP) are tax-free. The State Pension and New Style JSA are taxable."},{"id":"u1t2b-13","t":"u1t2b","q":"Which state benefit is taxable?","c":"Carer's Allowance","w":["Personal Independence Payment","Attendance Allowance","Child Benefit, ignoring the High Income Child Benefit Charge"],"e":"Carer's Allowance, the State Pension and contribution-based JSA/ESA are taxable. PIP and Attendance Allowance are not."},{"id":"u1t2b-14","t":"u1t2b","q":"In 2026/27, an employee pays Class 1 National Insurance on earnings between the primary threshold and the upper earnings limit at:","c":"8%","w":["12%","10%","2%"],"e":"Employee Class 1: 8% between £12,570 and £50,270 a year, then 2% above."},{"id":"u1t2b-15","t":"u1t2b","q":"For 2026/27, employer (secondary) Class 1 National Insurance is charged at:","c":"15% on earnings above £5,000 a year (£96 a week)","w":["13.8% on earnings above £9,100 a year","15% on earnings above £12,570 a year","12% on earnings above £5,000 a year"],"e":"From April 2025 the employer rate rose to 15% and the secondary threshold fell to £5,000."},{"id":"u1t2b-16","t":"u1t2b","q":"Self-employed profits between £12,570 and £50,270 attract Class 4 National Insurance at:","c":"6%","w":["9%","8%","2%"],"e":"Class 4: 6% between the lower and upper profits limits, 2% above £50,270."},{"id":"u1t2b-17","t":"u1t2b","q":"The capital gains tax annual exempt amount for an individual in 2026/27 is:","c":"£3,000","w":["£6,000","£12,300","£1,500"],"e":"The annual exempt amount is £3,000 for individuals (most trusts get £1,500)."},{"id":"u1t2b-18","t":"u1t2b","q":"A higher-rate taxpayer who makes a taxable gain on shares (outside an ISA) pays CGT at:","c":"24%","w":["20%","28%","40%"],"e":"CGT rates are 18% within the basic rate band and 24% above it, for shares and residential property alike."},{"id":"u1t2b-19","t":"u1t2b","q":"Which of these assets is exempt from capital gains tax?","c":"Gilts","w":["A buy-to-let property","Shares held outside an ISA","A holiday cottage"],"e":"Gilts, qualifying corporate bonds, ISAs, private cars, NS&I products and your main home (via private residence relief) are exempt."},{"id":"u1t2b-20","t":"u1t2b","q":"Gains on the sale of your only or main home are usually exempt from CGT because of:","c":"Private residence relief","w":["Business asset disposal relief","Taper relief","Rollover relief"],"e":"Private residence relief exempts a gain on your main home, provided the conditions are met."},{"id":"u1t2b-21","t":"u1t2b","q":"When someone dies, the assets that pass to their beneficiaries:","c":"Are free of CGT, and the beneficiaries acquire them at their market value at death","w":["Are subject to CGT at 24%, payable by the personal representatives","Are free of CGT, but keep the deceased's original acquisition cost","Are charged both CGT and IHT, each at 40%"],"e":"There is no CGT on death. Beneficiaries get a ‘tax-free uplift’ to market value at the date of death."},{"id":"u1t2b-22","t":"u1t2b","q":"A UK resident who sells a residential property and has CGT to pay must report and pay it within:","c":"60 days of completion","w":["30 days of exchange","By 31 January after the end of the tax year","6 months of completion"],"e":"UK residential property disposals must be reported and the tax paid within 60 days of completion."},{"id":"u1t2b-23","t":"u1t2b","q":"The inheritance tax nil-rate band for 2026/27 is:","c":"£325,000","w":["£175,000","£500,000","£350,000"],"e":"The NRB has been £325,000 since 2009 and is frozen until April 2031."},{"id":"u1t2b-24","t":"u1t2b","q":"The residence nil-rate band (£175,000) is available when:","c":"A home, or its value, passes on death to direct descendants","w":["Any property at all passes to any beneficiary","The estate is worth less than £325,000 in total","A home is left to a brother, sister, niece or nephew"],"e":"The RNRB requires a residence to be ‘closely inherited’ (children, grandchildren and so on). It tapers away by £1 for every £2 the estate exceeds £2 million."},{"id":"u1t2b-25","t":"u1t2b","q":"A gift from one individual to another that is not otherwise exempt becomes fully exempt from IHT if the donor survives:","c":"7 years","w":["3 years","5 years","10 years"],"e":"This is a potentially exempt transfer (PET). If the donor dies within 7 years it becomes chargeable."},{"id":"u1t2b-26","t":"u1t2b","q":"Taper relief on a failed potentially exempt transfer reduces:","c":"The tax payable on the gift, where the donor survived at least 3 years","w":["The value of the gift, where the donor survived at least 3 years","The nil-rate band available, where the donor survived at least 3 years","The tax on the rest of the estate, where the donor survived 3 years"],"e":"Taper relief cuts the tax on the gift (not its value): 32% effective rate at 3 to 4 years, then 24%, 16% and 8% up to 7 years."},{"id":"u1t2b-27","t":"u1t2b","q":"Each individual's IHT annual exemption is:","c":"£3,000, with any unused amount carried forward for one tax year only","w":["£3,000, with any unused amount carried forward for up to seven years","£6,000 per year, with no carry forward allowed","£250 per recipient, with no carry forward allowed"],"e":"You can give £3,000 a year free of IHT, plus last year's unused £3,000, so a maximum of £6,000."},{"id":"u1t2b-28","t":"u1t2b","q":"Gifts of up to ___ per recipient each tax year are exempt as ‘small gifts’, provided no other exemption is used for the same person:","c":"£250","w":["£500","£1,000","£3,000"],"e":"The small gifts exemption is £250 per person per tax year. It cannot be combined with the annual exemption for the same recipient."},{"id":"u1t2b-29","t":"u1t2b","q":"A parent can give their child a wedding gift free of IHT of up to:","c":"£5,000","w":["£2,500","£1,000","£3,000"],"e":"Wedding gifts: £5,000 from a parent, £2,500 from a grandparent (or from one partner to the other), £1,000 from anyone else."},{"id":"u1t2b-30","t":"u1t2b","q":"IHT on death is charged at ___ on the estate above the available nil-rate band(s), reduced to ___ if at least 10% of the net estate goes to charity:","c":"40%; 36%","w":["40%; 20%","20%; 10%","45%; 40%"],"e":"The death rate is 40%, or 36% where at least 10% of the baseline amount is left to charity. Lifetime chargeable transfers are taxed at 20%."},{"id":"u1t2b-31","t":"u1t2b","q":"A lifetime gift into a discretionary trust that exceeds the donor's available nil-rate band is charged to IHT immediately at:","c":"20%","w":["40%","0%","24%"],"e":"Gifts into most trusts are chargeable lifetime transfers taxed at the lifetime rate of 20% (25% if the donor pays the tax). More may be due if the donor dies within 7 years."},{"id":"u1t2b-32","t":"u1t2b","q":"Inheritance tax on an estate is normally due:","c":"By the end of the sixth month after the month of death","w":["Within 12 months of the date of death","Within 30 days of the date of death, or interest is charged","By 31 January after the tax year of death"],"e":"Interest runs from the end of the sixth month after the month of death."},{"id":"u1t2b-33","t":"u1t2b","q":"A husband dies leaving his whole estate to his wife. What happens to his unused nil-rate band?","c":"It transfers to his wife's estate, giving up to £650,000 in total","w":["It is lost, because he used the spouse exemption instead","It passes to their children to use against their own estates","It can only be used if she remarries within two years"],"e":"Gifts to a spouse are exempt, so his NRB is unused and transfers to her estate. The RNRB can be transferred in the same way."},{"id":"u1t2b-34","t":"u1t2b","q":"Generally, gifts between spouses or civil partners are:","c":"Exempt from IHT","w":["Potentially exempt transfers that need 7 years' survival","Chargeable at 20%","Exempt only up to £3,000 a year"],"e":"The spouse/civil partner exemption is unlimited where both are UK-based for IHT purposes. A limit of £325,000 applies if the recipient is not a long-term UK resident."},{"id":"u1t2b-35","t":"u1t2b","q":"Ellie earns a salary of £30,000 in 2026/27 and has no other income. What is her income tax liability?","c":"£3,486","w":["£6,000","£3,514","£2,486"],"e":"Taxable income is £30,000 − £12,570 = £17,430. At 20%, that gives £3,486."},{"id":"u1t2b-36","t":"u1t2b","q":"Tom earns £40,000 a year. Ignoring weekly pay periods, his employee Class 1 NICs for 2026/27 are:","c":"£2,194.40","w":["£3,291.60","£3,200.00","£2,743.00"],"e":"(£40,000 − £12,570) × 8% = £27,430 × 8% = £2,194.40."},{"id":"u1t2b-37","t":"u1t2b","q":"Priya, a basic-rate taxpayer, has a salary of £35,000 and receives £1,400 of bank interest. How much tax does she pay on the interest?","c":"£80","w":["£280","£0","£160"],"e":"Her salary uses up the starting rate band. Her PSA covers £1,000, leaving £400 taxable at 20% = £80."},{"id":"u1t2b-38","t":"u1t2b","q":"Mark is a higher-rate taxpayer and his salary already falls well into the higher-rate band. He receives £2,500 of dividends in 2026/27. What tax does he pay on them?","c":"£715","w":["£675","£893.75","£215"],"e":"£2,500 − £500 allowance = £2,000. At the 35.75% upper rate, that gives £715."},{"id":"u1t2b-39","t":"u1t2b","q":"Sara, a higher-rate taxpayer, makes a gain of £13,000 on shares held outside an ISA in 2026/27. She has no losses. What is her CGT bill?","c":"£2,400","w":["£3,120","£1,800","£2,000"],"e":"(£13,000 − £3,000) × 24% = £2,400."},{"id":"u1t2b-40","t":"u1t2b","q":"Alan is single and has never married. He dies leaving an estate of £425,000, with no home passing to descendants and no lifetime gifts. How much IHT is due?","c":"£40,000","w":["£170,000","£100,000","£20,000"],"e":"(£425,000 − £325,000) × 40% = £40,000."},{"id":"u1t2b-41","t":"u1t2b","q":"Frank, a widower, dies leaving £500,000 to his nephew, with no home and no lifetime gifts. His late wife left everything to him. How much IHT is due?","c":"£0","w":["£70,000","£200,000","£30,000"],"e":"Frank has his own £325,000 NRB plus his wife's transferred £325,000, a total of £650,000, which covers the £500,000 estate. No RNRB is available because no home passes to direct descendants, but none is needed."},{"id":"u1t2b-42","t":"u1t2b","q":"The High Income Child Benefit Charge applies where the higher earner's adjusted net income exceeds:","c":"£60,000, with the full Child Benefit clawed back at £80,000","w":["£50,000, with the full Child Benefit clawed back at £60,000","£100,000, with the full Child Benefit clawed back at £125,140","£60,000, with the full Child Benefit clawed back at £70,000"],"e":"The charge is 1% of the Child Benefit for every £200 of income over £60,000, reaching 100% at £80,000."},{"id":"u1t2b-43","t":"u1t2b","q":"The standard rate of VAT is:","c":"20%","w":["17.5%","15%","5%"],"e":"The standard rate is 20%, the reduced rate 5% and the zero rate 0%. Most financial services, including insurance and mortgages, are exempt."},{"id":"u1t2b-44","t":"u1t2b","q":"The main rate of corporation tax, for companies with profits over £250,000, is:","c":"25%","w":["19%","20%","30%"],"e":"Main rate 25%. The small profits rate of 19% applies to profits up to £50,000, with marginal relief in between."},{"id":"u1t2b-45","t":"u1t2b","q":"Which type of insurance is exempt from Insurance Premium Tax?","c":"Life assurance","w":["Home buildings insurance","Car insurance","Pet insurance"],"e":"Long-term insurance such as life cover is exempt. Most general insurance carries IPT at 12% (20% for travel and some appliance cover)."},{"id":"u1t2b-46","t":"u1t2b","q":"A first-time buyer in England buys their home for £280,000. How much SDLT is payable?","c":"£0","w":["£4,000","£1,500","£9,000"],"e":"First-time buyer relief gives 0% on the first £300,000 for properties up to £500,000. A non-first-time buyer would pay £4,000."},{"id":"u1t2b-47","t":"u1t2b","q":"A home mover (not a first-time buyer, no additional property) buys a main residence in England for £300,000. How much SDLT is payable?","c":"£5,000","w":["£15,000","£2,500","£0"],"e":"0% on the first £125,000, 2% on the next £125,000 (£2,500), and 5% on the final £50,000 (£2,500), a total of £5,000."},{"id":"u1t2b-48","t":"u1t2b","q":"Land and property purchases in Scotland are taxed under:","c":"Land and Buildings Transaction Tax (LBTT)","w":["Stamp Duty Land Tax (SDLT)","Land Transaction Tax (LTT)","Scottish Property Purchase Tax (SPPT)"],"e":"England and Northern Ireland have SDLT, Scotland has LBTT and Wales has LTT."},{"id":"u1t2b-49","t":"u1t2b","q":"The deadline for filing an online self-assessment return for the 2025/26 tax year is:","c":"31 January 2027","w":["31 October 2026","5 April 2027","31 July 2027"],"e":"Paper returns are due by 31 October after the tax year ends; online returns by 31 January. Payments on account are due 31 January and 31 July."},{"id":"u1t2b-50","t":"u1t2b","q":"The marriage allowance lets a non-taxpayer transfer ___ of their personal allowance to a basic-rate taxpaying spouse or civil partner:","c":"£1,260","w":["£1,250","£12,570","£3,250"],"e":"£1,260 (10% of the personal allowance) can be transferred, saving the recipient up to £252."},{"id":"u1t3-01","t":"u1t3","q":"Universal Credit replaces six ‘legacy’ benefits. Which of these is NOT one of them?","c":"Child Benefit","w":["Income Support","Housing Benefit (for working-age claimants)","Working Tax Credit"],"e":"UC replaces income-based JSA, income-related ESA, Income Support, Housing Benefit, Child Tax Credit and Working Tax Credit. Child Benefit is separate."},{"id":"u1t3-02","t":"u1t3","q":"Universal Credit is normally paid:","c":"Monthly in arrears, based on a monthly assessment period","w":["Weekly in advance, based on a weekly claim","Fortnightly in arrears, based on a two-week assessment period","Once a year, based on the previous tax year's income"],"e":"UC uses a one-month assessment period and is paid monthly, usually to one bank account per household."},{"id":"u1t3-03","t":"u1t3","q":"A single claimant with savings above ___ cannot claim Universal Credit:","c":"£16,000","w":["£6,000","£10,000","£23,250"],"e":"Savings up to £6,000 are ignored. Between £6,000 and £16,000 tariff income is assumed. Above £16,000 there is no entitlement."},{"id":"u1t3-04","t":"u1t3","q":"For Universal Credit, savings between £6,000 and £16,000 are treated as producing assumed (tariff) income of:","c":"£4.35 a month for every £250, or part of £250, above £6,000","w":["£1 a week for every £250, or part of £250, above £6,000","£4.35 a week for every £500, or part of £500, above £6,000","£10 a month for every £1,000 above £6,000"],"e":"UC tariff income is £4.35 per month per £250 (or part) over £6,000."},{"id":"u1t3-05","t":"u1t3","q":"To receive the full new State Pension, a person normally needs:","c":"35 qualifying years of National Insurance","w":["30 qualifying years of National Insurance","44 qualifying years of National Insurance","10 qualifying years of National Insurance"],"e":"35 years gives the full amount. At least 10 years are needed to get anything."},{"id":"u1t3-06","t":"u1t3","q":"The minimum number of qualifying years needed to receive any new State Pension is:","c":"10","w":["5","15","20"],"e":"With fewer than 10 qualifying years, no new State Pension is payable."},{"id":"u1t3-07","t":"u1t3","q":"The full new State Pension for 2026/27 is:","c":"£241.30 a week","w":["£230.25 a week","£184.90 a week","£221.20 a week"],"e":"It rose 4.8% under the triple lock in April 2026. £184.90 is the full basic (old) State Pension."},{"id":"u1t3-08","t":"u1t3","q":"Under the triple lock, the State Pension rises each April by the highest of:","c":"Average earnings growth, CPI inflation (September figure) or 2.5%","w":["RPI inflation (September figure), CPI inflation or 2%","Average earnings growth, RPI inflation (April figure) or 3%","CPI inflation (April figure), Bank Rate or 2.5%"],"e":"The triple lock uses earnings growth, September CPI or 2.5%, whichever is highest."},{"id":"u1t3-09","t":"u1t3","q":"Deferring the new State Pension increases it by:","c":"1% for every 9 weeks deferred (just under 5.8% a year)","w":["10.4% a year, with the option of a lump sum","1% for every 5 weeks deferred (10.4% a year)","A fixed £10 a week for each year deferred"],"e":"There is no lump sum option for the new State Pension. The old scheme paid 10.4% a year or a lump sum."},{"id":"u1t3-10","t":"u1t3","q":"State Pension age is currently rising from 66 to:","c":"67, between 2026 and 2028","w":["68, between 2026 and 2028","67, between 2034 and 2036","70, between 2028 and 2030"],"e":"The rise to 67 began in 2026 and will complete by 2028. A further rise to 68 is legislated for 2044 to 2046, subject to review."},{"id":"u1t3-11","t":"u1t3","q":"For 2026/27, the Pension Credit guarantee credit tops up a single person's weekly income to:","c":"£238.00","w":["£241.30","£227.10","£184.90"],"e":"Guarantee credit: £238.00 single, £363.25 couple (2026/27). It is means-tested and can open the door to other help."},{"id":"u1t3-12","t":"u1t3","q":"Child Benefit for the eldest or only child in 2026/27 is:","c":"£27.05 a week","w":["£26.05 a week","£17.90 a week","£25.60 a week"],"e":"2026/27: £27.05 for the eldest or only child and £17.90 for each additional child."},{"id":"u1t3-13","t":"u1t3","q":"The higher earner in a household has adjusted net income of £70,000. The High Income Child Benefit Charge will be:","c":"50% of the Child Benefit received","w":["100% of the Child Benefit received","Nothing, as the charge starts at £80,000","70% of the Child Benefit received"],"e":"£70,000 is £10,000 over £60,000. £10,000 ÷ £200 = 50, so 50% is clawed back."},{"id":"u1t3-14","t":"u1t3","q":"From 6 April 2026, Statutory Sick Pay is:","c":"Payable from day one, at the lower of £123.25 a week or 80% of earnings","w":["Payable from the fourth day of sickness, at a flat £123.25 a week","Only payable to employees earning at least the lower earnings limit","Payable for up to 52 weeks at 90% of average weekly earnings"],"e":"The Employment Rights Act 2025 removed the three waiting days and the lower earnings limit from April 2026."},{"id":"u1t3-15","t":"u1t3","q":"Statutory Sick Pay is payable for a maximum of:","c":"28 weeks","w":["26 weeks","39 weeks","52 weeks"],"e":"SSP lasts up to 28 weeks in a period of incapacity. After that, the person may claim UC or New Style ESA."},{"id":"u1t3-16","t":"u1t3","q":"Statutory Maternity Pay is paid for up to 39 weeks. How is it paid?","c":"6 weeks at 90% of earnings, then 33 weeks at £194.32 (or 90% if lower)","w":["£194.32 a week for all 39 weeks, whatever the mother's earnings","100% of salary for 6 weeks, then £194.32 a week for 33 weeks","90% of average weekly earnings for the full 39 weeks, with no cap"],"e":"SMP: 6 weeks at 90%, then 33 weeks at the standard rate (£194.32 in 2026/27) or 90% if lower."},{"id":"u1t3-17","t":"u1t3","q":"Which of these benefits is contribution-based, depending on the claimant's NI record, rather than means-tested?","c":"New Style Jobseeker's Allowance","w":["Universal Credit (standard allowance)","Pension Credit (guarantee credit)","Housing Benefit (for pensioners)"],"e":"New Style JSA and New Style ESA depend on NI contributions. UC, Pension Credit and Housing Benefit are means-tested."},{"id":"u1t3-18","t":"u1t3","q":"New Style Jobseeker's Allowance is payable for up to:","c":"182 days (26 weeks)","w":["52 weeks (one year)","28 weeks (196 days)","13 weeks (91 days)"],"e":"New Style JSA lasts up to 182 days and is not affected by a partner's income or the claimant's savings."},{"id":"u1t3-19","t":"u1t3","q":"Attendance Allowance is available to people who:","c":"Are over State Pension age and need help with personal care","w":["Are under 16 and need more care than other children their age","Are of working age and unable to work because of illness","Care for a disabled person for at least 35 hours a week"],"e":"Attendance Allowance is for those over State Pension age. It is not means-tested and is tax-free."},{"id":"u1t3-20","t":"u1t3","q":"Personal Independence Payment (PIP) is:","c":"A non-means-tested disability benefit for people aged 16 to State Pension age","w":["A means-tested benefit for people who are unemployed and seeking work","A disability benefit only available to people over State Pension age","A taxable benefit that replaces the State Pension for disabled people"],"e":"PIP has daily living and mobility components. It is not means-tested and is tax-free."},{"id":"u1t3-21","t":"u1t3","q":"To claim Carer's Allowance, the claimant must care for someone for at least:","c":"35 hours a week","w":["20 hours a week","16 hours a week","40 hours a week"],"e":"Carer's Allowance (£86.45 a week in 2026/27) needs at least 35 hours of care a week, and the claimant's earnings must stay under the earnings limit."},{"id":"u1t3-22","t":"u1t3","q":"The higher rate of Bereavement Support Payment consists of:","c":"A £3,500 lump sum plus 18 monthly payments of £350","w":["A £2,500 lump sum plus 18 monthly payments of £100","A weekly payment until State Pension age","A single £10,000 lump sum"],"e":"The higher rate applies where the claimant has children or is pregnant. The standard rate is £2,500 plus 18 monthly payments of £100."},{"id":"u1t3-23","t":"u1t3","q":"From April 2026, the two-child limit on the child element of Universal Credit:","c":"Was removed","w":["Was extended to Child Benefit","Was reduced to one child","Was applied to all existing claims"],"e":"The 2025 Budget announced the removal of the two-child limit from April 2026."},{"id":"u1t3-24","t":"u1t3","q":"A self-employed woman who does not qualify for Statutory Maternity Pay may be able to claim:","c":"Maternity Allowance","w":["Statutory Sick Pay","Carer's Allowance","Pension Credit"],"e":"Maternity Allowance is paid by the DWP to those who don't qualify for SMP, including many self-employed women."},{"id":"u1t3-25","t":"u1t3","q":"Support for Mortgage Interest (SMI) is now provided as:","c":"A loan secured on the home, repaid with interest when it is sold","w":["A non-repayable grant paid directly to the mortgage lender","A tax credit paid through PAYE to help with mortgage costs","An interest-free payment made directly to the borrower each month"],"e":"Since April 2018, SMI has been a secured loan paid directly to the lender, not a benefit."},{"id":"u1t4a-01","t":"u1t4a","q":"Which life policy pays out only if death occurs within a set period and has no surrender value?","c":"Term assurance","w":["Whole of life assurance","An endowment","An investment bond"],"e":"Term assurance is pure protection. If you survive the term, nothing is paid and there is no cash-in value."},{"id":"u1t4a-02","t":"u1t4a","q":"Decreasing term assurance is most suitable to protect:","c":"A capital repayment mortgage","w":["An interest-only mortgage","An inheritance tax liability on a growing estate","Retirement income"],"e":"The sum assured falls roughly in line with the outstanding balance of a repayment mortgage."},{"id":"u1t4a-03","t":"u1t4a","q":"The most appropriate life cover for an interest-only mortgage is:","c":"Level term assurance for the mortgage term","w":["Decreasing term assurance for the mortgage term","Family income benefit for the mortgage term","Income protection insurance until retirement"],"e":"With interest-only, the capital owed stays the same throughout, so the sum assured should stay level."},{"id":"u1t4a-04","t":"u1t4a","q":"Family income benefit:","c":"Pays a tax-free income from death until the end of the policy term","w":["Pays a lump sum on death at any age, as long as premiums are paid","Pays a lump sum on diagnosis of a specified critical illness only","Pays a monthly income if the policyholder cannot work through illness"],"e":"FIB is a type of decreasing term cover that pays income rather than a lump sum, which is often cheaper."},{"id":"u1t4a-05","t":"u1t4a","q":"A convertible term assurance policy allows the policyholder to:","c":"Switch to a whole of life or endowment policy without providing further medical evidence","w":["Extend the term at expiry without providing further medical evidence","Convert the sum assured into a pension fund at retirement","Cash the policy in for its surrender value at any time"],"e":"Conversion is guaranteed regardless of health. Extending at the end of the term without evidence describes renewable term."},{"id":"u1t4a-06","t":"u1t4a","q":"Renewable term assurance allows the policyholder to:","c":"Take out a new term policy at expiry without further medical evidence","w":["Switch to whole of life cover at any time without evidence","Increase the sum assured each year in line with inflation","Receive a cash sum if they survive to the end of the term"],"e":"The premium for the new policy is based on age at renewal, but health is not reassessed."},{"id":"u1t4a-07","t":"u1t4a","q":"Whole of life assurance written in trust is commonly used to:","c":"Provide funds to pay an inheritance tax bill on death","w":["Repay a repayment mortgage over 25 years","Provide a regular income in retirement","Replace lost income during long-term sickness"],"e":"Whole of life pays out whenever death occurs. Held in trust, the proceeds are outside the estate and available quickly."},{"id":"u1t4a-08","t":"u1t4a","q":"A married couple leave everything to each other in their wills. To provide for the IHT bill payable when the second of them dies, the most suitable policy is usually:","c":"Joint life second death whole of life, written in trust","w":["Joint life first death whole of life, written in trust","Single life decreasing term assurance on the husband","Joint life first death level term assurance for 10 years"],"e":"The spouse exemption means the IHT bill arises on the second death, so the policy should pay out then."},{"id":"u1t4a-09","t":"u1t4a","q":"A key benefit of writing a life policy in trust is that:","c":"Proceeds are paid quickly without probate and are usually outside the estate","w":["Premiums become tax-deductible and the proceeds are free of income tax","The sum assured increases each year in line with inflation","The policy gains a surrender value that can be used as loan security"],"e":"A trust avoids the delay of probate and keeps the payout out of the deceased's estate."},{"id":"u1t4a-10","t":"u1t4a","q":"Critical illness cover pays:","c":"A lump sum on diagnosis of a specified serious illness","w":["A monthly income after a deferred period until retirement","A lump sum only on death","The cost of private hospital treatment"],"e":"CIC pays a tax-free lump sum when a defined condition is diagnosed and meets the policy definition."},{"id":"u1t4a-11","t":"u1t4a","q":"Income protection benefit is typically limited to around:","c":"50% to 70% of gross earnings","w":["100% of gross earnings","100% of net earnings plus bonuses","A fixed £1,000 a month"],"e":"Benefit is capped below full earnings to keep an incentive to return to work."},{"id":"u1t4a-12","t":"u1t4a","q":"With income protection insurance, choosing a longer deferred period generally results in:","c":"A lower premium","w":["A higher premium","No change to the premium","A higher benefit"],"e":"The longer you wait before benefit starts, the lower the insurer's risk and the cheaper the cover. Match it to employer sick pay."},{"id":"u1t4a-13","t":"u1t4a","q":"Which definition of incapacity is most favourable to the policyholder under income protection?","c":"Own occupation","w":["Suited occupation","Any occupation","Activities of daily living"],"e":"Own occupation pays if you can't do your own job. Any occupation is the hardest to claim under."},{"id":"u1t4a-14","t":"u1t4a","q":"Benefits paid from an individually owned income protection policy are:","c":"Tax-free","w":["Taxed as earnings under PAYE","Subject to capital gains tax","Taxed at 20% at source"],"e":"Individual IP benefit is tax-free. Benefit from an employer's group IP scheme is paid through payroll and taxed."},{"id":"u1t4a-15","t":"u1t4a","q":"Mortgage payment protection insurance (or ASU cover) typically pays benefit for a maximum of:","c":"12 or 24 months per claim","w":["Until the policyholder retires","5 years per claim","28 weeks per claim"],"e":"ASU/MPPI is short-term cover for mortgage payments during accident, sickness or unemployment."},{"id":"u1t4a-16","t":"u1t4a","q":"A person has unlimited insurable interest in:","c":"Their own life and the life of their spouse or civil partner","w":["Their own life and the life of their employer","Their own life and the life of any blood relative","Their own life and the life of their business partner"],"e":"Insurable interest in other people (such as business partners or employers) is limited to the financial loss their death would cause."},{"id":"u1t4a-17","t":"u1t4a","q":"Under the Consumer Insurance (Disclosure and Representations) Act 2012, a consumer applying for insurance must:","c":"Take reasonable care not to make a misrepresentation","w":["Volunteer every material fact, even if not asked","Only answer questions about their health","Disclose nothing unless asked in writing"],"e":"CIDRA replaced the old duty to volunteer information. Insurers must ask clear questions."},{"id":"u1t4a-18","t":"u1t4a","q":"If a consumer deliberately or recklessly misrepresents information when taking out insurance, the insurer can:","c":"Avoid the policy, decline all claims and keep the premiums","w":["Only reduce any claim in proportion","Must still pay any claim in full","Must refund the premiums and pay half of any claim"],"e":"For careless misrepresentation, remedies are proportionate. For deliberate or reckless misrepresentation, the insurer can avoid the policy and keep the premiums."},{"id":"u1t4a-19","t":"u1t4a","q":"Waiver of premium benefit:","c":"Pays the premiums if the policyholder can't work through illness or injury","w":["Removes the need for medical evidence when the policy is taken out","Doubles the sum assured if death is caused by an accident","Refunds all the premiums paid if no claim is made during the term"],"e":"Waiver of premium keeps cover in force while the policyholder is unable to work."},{"id":"u1t4a-20","t":"u1t4a","q":"Private medical insurance paid for by an employer is:","c":"A taxable benefit in kind for the employee","w":["Completely tax-free for the employee","Subject to capital gains tax","Only taxable if the premium exceeds £1,000"],"e":"Employer-paid PMI is reported as a benefit in kind and taxed on the employee."},{"id":"u1t4a-21","t":"u1t4a","q":"The sum insured for buildings insurance should be based on:","c":"The full cost of rebuilding the property","w":["The property's current market value","The amount of the outstanding mortgage","The price originally paid for the property"],"e":"Rebuild cost (including demolition and professional fees) is what matters, which is often different from market value."},{"id":"u1t4a-22","t":"u1t4a","q":"If a property is under-insured, the insurer may reduce a claim proportionately under the:","c":"Average clause","w":["Subrogation clause","Contribution principle","Policy excess"],"e":"Under average, if you insure for 50% of the true value, the insurer may pay only 50% of the claim."},{"id":"u1t4a-23","t":"u1t4a","q":"Which of these is NOT a contract of indemnity?","c":"Life assurance","w":["Buildings insurance","Contents insurance","Motor insurance"],"e":"You can't restore someone's financial position after death, so life cover pays an agreed sum (a benefit policy) rather than an indemnity."},{"id":"u1t4a-24","t":"u1t4a","q":"Reviewable premiums on a protection policy:","c":"Can be increased by the insurer at review dates","w":["Are fixed for the whole life of the policy","Fall each year as the sum assured falls","Can only be changed by the policyholder"],"e":"Reviewable premiums start cheaper but can rise. Guaranteed premiums are fixed."},{"id":"u1t4a-25","t":"u1t4a","q":"An immediate needs annuity is used to:","c":"Pay care fees for someone who already needs long-term care, in return for a lump sum","w":["Provide a retirement income from age 55 in return for a pension fund","Repay an outstanding mortgage on the death of the policyholder","Replace lost earnings during short-term sickness or unemployment"],"e":"The lump sum buys a guaranteed income paid to the care provider for life. If it is paid direct to the care provider, the income is tax-free."},{"id":"u1t4b-01","t":"u1t4b","q":"The overall annual ISA subscription limit for 2026/27 is:","c":"£20,000","w":["£12,000","£20,000 cash plus £20,000 stocks and shares","£9,000"],"e":"The limit is £20,000 across all adult ISAs. From April 2027, under-65s will be limited to £12,000 of that in cash ISAs."},{"id":"u1t4b-02","t":"u1t4b","q":"The minimum age to open an adult cash ISA is:","c":"18","w":["16","21","There is no minimum age"],"e":"Since 6 April 2024, all adult ISAs, including cash ISAs, require the investor to be 18."},{"id":"u1t4b-03","t":"u1t4b","q":"Since April 2024, ISA investors can:","c":"Pay into more than one ISA of the same type in a tax year","w":["Exceed the £20,000 limit by using more than one provider","Only pay into one ISA of any type each tax year","Transfer an ISA only once during their lifetime"],"e":"The old ‘one of each type per year’ rule was removed, but the £20,000 total still applies."},{"id":"u1t4b-04","t":"u1t4b","q":"The Junior ISA subscription limit for 2026/27 is:","c":"£9,000","w":["£4,000","£4,368","£20,000"],"e":"JISAs are for under-18s. The child can manage the account from 16 and withdraw from 18, when it becomes an adult ISA."},{"id":"u1t4b-05","t":"u1t4b","q":"A Lifetime ISA can be opened by people aged:","c":"18 to 39, and they can keep paying in until age 50","w":["18 to 50, and they can keep paying in until age 60","16 to 40, and they can keep paying in until age 55","Any age, and they can keep paying in until State Pension age"],"e":"LISA: up to £4,000 a year (within the £20,000 limit), with a 25% government bonus of up to £1,000 a year."},{"id":"u1t4b-06","t":"u1t4b","q":"Lifetime ISA funds can be used without penalty to buy a first home costing up to:","c":"£450,000","w":["£250,000","£500,000","£625,000"],"e":"LISA withdrawals are penalty-free for a first home up to £450,000, from age 60, or if terminally ill."},{"id":"u1t4b-07","t":"u1t4b","q":"An unauthorised withdrawal from a Lifetime ISA is subject to a charge of:","c":"25% of the amount withdrawn","w":["20% of the amount withdrawn","No charge","50% of the amount withdrawn"],"e":"The 25% charge removes the bonus and a little more. On £1,000 paid in plus a £250 bonus, you would get back £937.50."},{"id":"u1t4b-08","t":"u1t4b","q":"The maximum holding in NS&I Premium Bonds is:","c":"£50,000","w":["£30,000","£100,000","£20,000"],"e":"The minimum purchase is £25 and the maximum holding £50,000. Prizes are tax-free and NS&I is 100% backed by HM Treasury."},{"id":"u1t4b-09","t":"u1t4b","q":"A unit trust is:","c":"An open-ended fund set up as a trust, with a trustee and a fund manager","w":["A closed-ended company whose shares are listed on the stock exchange","An open-ended company run by an authorised corporate director","A deposit account with a guaranteed return set by a trustee"],"e":"Units are created and cancelled as investors buy and sell. The trustee safeguards assets; the manager runs the fund."},{"id":"u1t4b-10","t":"u1t4b","q":"In an OEIC (open-ended investment company), the fund is run by the:","c":"Authorised corporate director (ACD), with a depositary safeguarding the assets","w":["Trustee, with a fund manager making the investment decisions","Board of directors, with market makers setting the share price","Financial Conduct Authority, with a custodian holding the assets"],"e":"An OEIC is a company that issues shares. It is managed by an ACD and overseen by a depositary."},{"id":"u1t4b-11","t":"u1t4b","q":"Which statement about investment trusts is correct?","c":"They are closed-ended companies whose shares can trade at a discount or premium to net asset value","w":["They are open-ended funds that create new units whenever investors buy","They are not allowed to borrow money to invest, unlike unit trusts","They are trusts governed by a trust deed, with a trustee holding the assets"],"e":"Despite the name, an investment trust is a listed company. Its share price depends on supply and demand, not just the value of its assets."},{"id":"u1t4b-12","t":"u1t4b","q":"Investment trusts can borrow money to invest (gearing). This:","c":"Magnifies both gains and losses","w":["Guarantees higher returns","Reduces risk","Is banned by the FCA"],"e":"Gearing increases exposure. It boosts returns when markets rise and deepens losses when they fall."},{"id":"u1t4b-13","t":"u1t4b","q":"In a with-profits fund, a market value reduction (MVR) may be applied:","c":"When money is taken out early, particularly when markets have fallen","w":["To every annual bonus as it is added to the policy","Only on death claims, to protect remaining investors","When the policy reaches its guaranteed maturity date"],"e":"An MVR protects remaining policyholders when someone leaves early. It isn't usually applied on death or at guaranteed dates."},{"id":"u1t4b-14","t":"u1t4b","q":"Withdrawals from an onshore investment bond of up to 5% of the original investment each year:","c":"Can be taken for up to 20 years without an immediate tax charge","w":["Are always free of tax permanently, even on surrender","Are taxed at 20% at source each time one is taken","Are subject to capital gains tax above the annual exemption"],"e":"The 5% allowance is cumulative and defers tax until a chargeable event, such as full surrender."},{"id":"u1t4b-15","t":"u1t4b","q":"Gains on an onshore life bond are treated as having had basic-rate tax paid. This means:","c":"Basic-rate taxpayers have no more to pay; higher-rate taxpayers may owe 20% more","w":["Every policyholder pays a further 20%, whatever their tax band","Gains are completely tax-free for all policyholders","Gains are subject to CGT at 18% or 24% instead of income tax"],"e":"The fund itself is taxed, so a 20% credit is given. Top-slicing relief may reduce a higher-rate charge."},{"id":"u1t4b-16","t":"u1t4b","q":"Which risk is greatest for someone holding all their long-term savings in cash?","c":"Inflation risk","w":["Capital risk","Currency risk","Stock market risk"],"e":"Cash is capital-secure, but if the interest earned is below inflation its real value falls."},{"id":"u1t4b-17","t":"u1t4b","q":"Diversifying across many different investments mainly reduces:","c":"Specific (unsystematic) risk","w":["Systematic (market) risk","Inflation risk entirely","All investment risk"],"e":"Spreading money reduces the impact of any one investment failing. Market-wide risk remains."},{"id":"u1t4b-18","t":"u1t4b","q":"Investing a fixed amount each month, so that more units are bought when prices are low, is known as:","c":"Pound cost averaging","w":["Gearing (borrowing to invest)","Top-slicing relief","Portfolio rebalancing"],"e":"Regular investing smooths the purchase price over time."},{"id":"u1t4b-19","t":"u1t4b","q":"A notice account:","c":"Requires a period of notice before withdrawals, usually in return for a higher rate","w":["Allows unlimited instant withdrawals, usually at a higher rate of interest","Locks money away until the account holder reaches retirement","Pays a return linked to the stock market, with capital at risk"],"e":"Notice accounts trade access for a better rate. Fixed-term bonds lock money away for a set period."},{"id":"u1t4b-20","t":"u1t4b","q":"Which of these typically carries the highest investment risk?","c":"Emerging market equities","w":["UK gilts","Cash deposits","Investment-grade UK corporate bonds"],"e":"Emerging markets add political, currency and liquidity risk to normal equity risk."},{"id":"u1t4b-21","t":"u1t4b","q":"Which investments are held in an Innovative Finance ISA?","c":"Peer-to-peer loans","w":["Premium Bonds","Cash deposits","Residential property bought directly"],"e":"IFISAs hold peer-to-peer loans and some crowdfunding debentures. They are not FSCS-protected in the way deposits are."},{"id":"u1t4b-22","t":"u1t4b","q":"An exchange-traded fund (ETF):","c":"Is a fund whose shares trade on a stock exchange, usually tracking an index","w":["Is a deposit account paying interest linked to the FTSE 100","Can only be bought and sold directly through the fund manager","Is a closed-ended fund that is not allowed to track indices"],"e":"ETFs combine the diversification of a fund with the ability to trade throughout the day like a share."},{"id":"u1t4b-23","t":"u1t4b","q":"A bond with a nominal value of £100 and a 5% coupon is trading at £125. What is its running (flat) yield?","c":"4%","w":["5%","6.25%","3%"],"e":"Running yield = coupon ÷ price = £5 ÷ £125 = 4%."},{"id":"u1t4b-24","t":"u1t4b","q":"Deposits with a UK bank are protected by the FSCS up to:","c":"£120,000 per person, per authorised institution","w":["£85,000 per person, per institution","£120,000 per account, however many accounts are held","£1 million per person"],"e":"The deposit limit rose from £85,000 to £120,000 on 1 December 2025. Brands sharing one banking licence share one limit."},{"id":"u1t4c-01","t":"u1t4c","q":"Employers must automatically enrol eligible jobholders aged 22 to State Pension age who earn more than:","c":"£10,000 a year","w":["£6,240 a year","£12,570 a year","£5,000 a year"],"e":"The earnings trigger is £10,000 (unchanged for 2026/27). Contributions are worked out on qualifying earnings between £6,240 and £50,270."},{"id":"u1t4c-02","t":"u1t4c","q":"The minimum total auto-enrolment contribution on qualifying earnings is:","c":"8%, of which the employer must pay at least 3%","w":["8%, of which the employer must pay at least 5%","5%, of which the employer pays 2%","12%, of which the employer pays 6%"],"e":"The total is 8%. The employer pays at least 3% and the employee makes up the rest (including tax relief)."},{"id":"u1t4c-03","t":"u1t4c","q":"In a defined benefit (final salary) pension scheme, the investment risk is borne by:","c":"The employer","w":["The member","The FCA","The Pension Protection Fund"],"e":"The employer promises a set pension and must fund any shortfall. In a defined contribution scheme, the member bears the risk."},{"id":"u1t4c-04","t":"u1t4c","q":"A member of a 1/60th defined benefit scheme retires with 20 years' service and final pensionable salary of £45,000. What is the annual pension?","c":"£15,000","w":["£11,250","£22,500","£9,000"],"e":"20 ÷ 60 × £45,000 = £15,000. On a 1/80th basis it would be £11,250."},{"id":"u1t4c-05","t":"u1t4c","q":"The standard pension annual allowance for 2026/27 is:","c":"£60,000","w":["£40,000","£10,000","£100,000"],"e":"The annual allowance is £60,000, or 100% of relevant earnings for personal tax relief if lower. It tapers down to £10,000 for very high earners."},{"id":"u1t4c-06","t":"u1t4c","q":"Unused pension annual allowance can be carried forward from the previous:","c":"Three tax years","w":["One tax year","Five tax years","Seven tax years"],"e":"Carry forward lets you use unused allowance from the last three years, once the current year's allowance is used, as long as you were a scheme member in those years."},{"id":"u1t4c-07","t":"u1t4c","q":"Flexibly accessing a defined contribution pension, for example by taking taxable drawdown income, triggers a money purchase annual allowance of:","c":"£10,000","w":["£4,000","£60,000","£3,600"],"e":"Once triggered, the MPAA limits future tax-relieved DC contributions to £10,000 a year. Taking only tax-free cash does not trigger it."},{"id":"u1t4c-08","t":"u1t4c","q":"Someone with no relevant UK earnings can get tax relief on personal pension contributions of up to:","c":"£3,600 gross (£2,880 net) a year","w":["£2,880 gross a year","£10,000 a year","Nothing, as tax relief needs earnings"],"e":"Non-earners (including children) can pay £2,880 net, and the provider claims £720 basic-rate relief to make £3,600."},{"id":"u1t4c-09","t":"u1t4c","q":"Under relief at source, a member pays £800 net into a personal pension. How much does the provider claim from HMRC?","c":"£200 (gross contribution £1,000)","w":["£160 (gross contribution £960)","£320 (gross contribution £1,120)","£400 (gross contribution £1,200)"],"e":"£800 is 80% of the gross amount, so the gross is £1,000 and HMRC adds £200. Higher-rate taxpayers claim extra relief through self-assessment."},{"id":"u1t4c-10","t":"u1t4c","q":"The normal minimum pension age is currently 55, rising to:","c":"57 from 6 April 2028","w":["60 from 6 April

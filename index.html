2028","58 from 6 April 2030","56 from 6 April 2027"],"e":"NMPA rises to 57 in April 2028, except for those with a protected pension age."},{"id":"u1t4c-11","t":"u1t4c","q":"Pension tax-free cash is normally up to 25% of the fund, subject to an overall lump sum allowance of:","c":"£268,275","w":["£1,073,100","£250,000","£325,000"],"e":"The lump sum allowance (LSA) is £268,275. The lump sum and death benefit allowance (LSDBA) is £1,073,100."},{"id":"u1t4c-12","t":"u1t4c","q":"The pension lifetime allowance:","c":"Was abolished from 6 April 2024 and replaced by new lump sum allowances","w":["Is £1,073,100 for 2026/27 and applies to all pension savings","Was increased to £1.8 million from April 2024","Still applies, but only to defined benefit schemes"],"e":"The LTA was abolished and replaced by the LSA and LSDBA, which limit tax-free lump sums rather than total pension savings."},{"id":"u1t4c-13","t":"u1t4c","q":"An uncrystallised funds pension lump sum (UFPLS) is taxed so that:","c":"25% of each payment is tax-free and 75% is taxable as income","w":["The whole payment is tax-free up to the lump sum allowance","The whole payment is taxed at a flat 20%","50% of each payment is tax-free and 50% is taxable"],"e":"Each UFPLS payment is split 25% tax-free and 75% taxable. Taking one triggers the MPAA."},{"id":"u1t4c-14","t":"u1t4c","q":"An enhanced (impaired life) annuity:","c":"Pays a higher income to someone whose health may shorten their life","w":["Increases each year in line with RPI to protect against inflation","Guarantees payments for at least 10 years, even if the annuitant dies","Pays a lower income in return for a lump sum paid on death"],"e":"Conditions such as smoking, diabetes or heart problems can mean a better annuity rate."},{"id":"u1t4c-15","t":"u1t4c","q":"If a defined contribution pension holder dies before age 75, their beneficiaries can generally receive the fund:","c":"Free of income tax, with lump sums tested against the LSDBA","w":["Taxed at 45% as a special lump sum death benefit charge","Taxed at the beneficiary's marginal rate of income tax","Only as an annuity, taxed as the beneficiary's income"],"e":"Before 75, death benefits are usually tax-free. After 75, they are taxed at the recipient's marginal rate. Unused pensions are due to come into IHT from April 2027."},{"id":"u1t4c-16","t":"u1t4c","q":"The Pension Protection Fund:","c":"Compensates members of DB schemes whose employer has become insolvent","w":["Regulates personal pension providers and sets their capital requirements","Resolves complaints about pension advice and can award compensation","Guarantees the value of defined contribution funds if markets fall"],"e":"The PPF steps in for underfunded DB schemes after employer insolvency. Complaints go to the Pensions Ombudsman."},{"id":"u1t4c-17","t":"u1t4c","q":"Which body regulates workplace (occupational) pension schemes?","c":"The Pensions Regulator","w":["The FCA alone","The Pension Protection Fund","The Pensions Ombudsman"],"e":"TPR regulates workplace schemes and enforces auto-enrolment duties. The FCA regulates personal pensions and their providers."},{"id":"u1t4c-18","t":"u1t4c","q":"Free, impartial Pension Wise guidance on defined contribution pension options is available through MoneyHelper to people aged:","c":"50 or over","w":["55 or over","Any age","65 or over"],"e":"Pension Wise is offered to those aged 50+ with a DC pot. It is guidance, not advice."},{"id":"u1t4c-19","t":"u1t4c","q":"Charges on a stakeholder pension are capped at:","c":"1.5% a year for the first 10 years, then 1% a year","w":["0.75% a year","2% a year","1% a year for the first 5 years, then nothing"],"e":"Stakeholder pensions have capped charges, low minimum contributions and flexible payments."},{"id":"u1t4c-20","t":"u1t4c","q":"The APR (annual percentage rate of charge) on a loan:","c":"Shows the total cost of credit as a yearly rate, including fees","w":["Shows the interest rate only, excluding any fees or charges","Is the Bank of England's base rate plus the lender's margin","Is always the same as the monthly interest rate multiplied by 12"],"e":"APR allows borrowers to compare the overall cost of different credit products."},{"id":"u1t4c-21","t":"u1t4c","q":"Which of the following is secured borrowing?","c":"A mortgage","w":["A credit card","An overdraft","An unsecured personal loan"],"e":"A mortgage is secured on property, so the lender can repossess if the borrower defaults."},{"id":"u1t4c-22","t":"u1t4c","q":"With an interest-only mortgage:","c":"Payments cover only interest; the capital is repaid at the end from another source","w":["Payments cover interest and capital, so the debt reduces each month","No payments at all are made until the property is eventually sold","The interest rate is always fixed for the whole mortgage term"],"e":"Since the Mortgage Market Review, lenders must see a credible repayment strategy for interest-only loans."},{"id":"u1t4c-23","t":"u1t4c","q":"Under a hire purchase agreement:","c":"The goods belong to the finance company until the final payment is made","w":["Ownership passes to the buyer as soon as the agreement is signed","The buyer can never own the goods, even after the final payment","The goods are owned jointly by the buyer and the finance company"],"e":"With HP you hire the goods, with an option to buy on the final payment. With a personal loan, you own the goods immediately."},{"id":"u1t4c-24","t":"u1t4c","q":"Section 75 of the Consumer Credit Act 1974 makes a credit card provider jointly liable with the retailer for single items costing:","c":"Over £100 and up to £30,000","w":["Any amount, with no upper or lower limit","Up to £100 only","Over £30,000 only"],"e":"Section 75 gives the cardholder an equal claim against the card issuer if goods or services are faulty or not delivered."},{"id":"u1t4c-25","t":"u1t4c","q":"Most regulated consumer credit agreements give the borrower a right to withdraw within:","c":"14 days","w":["7 days","30 days","28 days"],"e":"The borrower must repay any money drawn plus interest accrued, but no penalty applies."},{"id":"u1t4c-26","t":"u1t4c","q":"For high-cost short-term credit (payday loans), the FCA price cap limits:","c":"Interest and fees to 0.8% per day, with the total cost capped at 100% of the amount borrowed","w":["Interest and fees to 1% per day, with total cost capped at 200% of the amount borrowed","Interest to 20% a year, with default fees capped at £25 per missed payment","The APR to 49.9%, with no cap on the total amount repayable"],"e":"The cap also limits default fees to £15. Borrowers never pay back more than twice what they borrowed."},{"id":"u1t4c-27","t":"u1t4c","q":"A debt relief order (DRO) is available to people with debts of up to:","c":"£50,000","w":["£20,000","£30,000","£100,000"],"e":"The DRO debt limit rose to £50,000 in 2024 and the application fee was removed. A DRO usually lasts 12 months."},{"id":"u1t4c-28","t":"u1t4c","q":"The Breathing Space scheme in England and Wales gives standard protection from most creditor action for:","c":"60 days","w":["30 days","90 days","12 months"],"e":"During breathing space, creditors must stop most enforcement action and freeze interest and charges. A mental health crisis breathing space has no fixed length: it lasts as long as the person's crisis treatment, plus 30 days."},{"id":"u1t4c-29","t":"u1t4c","q":"Which of these is a credit reference agency?","c":"Experian","w":["The Financial Ombudsman Service","MoneyHelper","The FSCS"],"e":"The main UK credit reference agencies are Experian, Equifax and TransUnion."},{"id":"u1t4c-30","t":"u1t4c","q":"With a lifetime mortgage (equity release):","c":"Interest usually rolls up and the loan is repaid when the home is sold","w":["The home is sold to the lender immediately in return for a lifetime tenancy","Monthly repayments of both capital and interest are compulsory","The borrower must be under 55 and repay the loan by State Pension age"],"e":"Most lifetime mortgages roll up interest, and plans meeting Equity Release Council standards include a no-negative-equity guarantee. A home reversion plan involves selling part of the home."},{"id":"u1t4c-31","t":"u1t4c","q":"For a loan to be a regulated mortgage contract, at least ___ of the property must be used as a dwelling by the borrower or a related person:","c":"40%","w":["50%","75%","100%"],"e":"A regulated mortgage contract is secured on UK land and at least 40% of the property is used as a dwelling by the borrower or a related person."},{"id":"u1t5-01","t":"u1t5","q":"A limited company:","c":"Is a separate legal person from its shareholders, who have limited liability","w":["Is legally the same person as its owners, who are personally liable","Exposes its shareholders to unlimited personal liability","Cannot own property or enter into contracts in its own name"],"e":"A company can own property, contract and sue in its own name. Shareholders risk only what they invested."},{"id":"u1t5-02","t":"u1t5","q":"A sole trader:","c":"Has unlimited personal liability for the debts of the business","w":["Has liability limited to the capital invested in the business","Is a separate legal person from the business they run","Must register the business at Companies House each year"],"e":"There is no legal separation between a sole trader and their business, so personal assets are at risk."},{"id":"u1t5-03","t":"u1t5","q":"In an ordinary partnership governed by the Partnership Act 1890, the partners are:","c":"Jointly and severally liable for the partnership's debts","w":["Only liable up to their capital contribution","Not liable for debts run up by other partners","Protected by limited liability"],"e":"Each partner can be pursued for the full debts of the firm, including from personal assets."},{"id":"u1t5-04","t":"u1t5","q":"A limited liability partnership (LLP):","c":"Is a separate legal entity in which the members' liability is limited","w":["Has unlimited liability for its members, like an ordinary partnership","Cannot own property in its own name","Is treated in law the same as a sole trader"],"e":"LLPs (Limited Liability Partnerships Act 2000) combine partnership flexibility with limited liability."},{"id":"u1t5-05","t":"u1t5","q":"Which of these is NOT an essential element of a valid contract?","c":"It must be in writing","w":["Offer and acceptance","Consideration","An intention to create legal relations"],"e":"Most contracts can be oral. Some, such as contracts for the sale of land, must be in writing."},{"id":"u1t5-06","t":"u1t5","q":"A contract with a minor (under 18) for things other than necessaries is generally:","c":"Not enforceable against the minor","w":["Illegal and void","Fully binding on both parties","Binding only if a parent co-signs"],"e":"Minors are bound by contracts for necessaries. Most other contracts can't be enforced against them."},{"id":"u1t5-07","t":"u1t5","q":"In contract law, ‘consideration’ means:","c":"Something of value given by each party in exchange for the other's promise","w":["Time each party takes to think carefully before signing","The cooling-off period during which either party can cancel","A deposit paid by the buyer before the contract is signed"],"e":"Consideration is the price of the promise: money, goods, services or a promise to do something."},{"id":"u1t5-08","t":"u1t5","q":"A contract that is voidable:","c":"Is valid unless and until the innocent party chooses to set it aside","w":["Never had any legal effect from the moment it was made","Can never be set aside once both parties have signed","Is automatically cancelled after a 14-day cooling-off period"],"e":"A void contract has no legal effect from the start. A voidable contract (for example, induced by misrepresentation) stands unless rescinded."},{"id":"u1t5-09","t":"u1t5","q":"An agent who appears to a third party to have authority, because of the way the principal has behaved, is said to have:","c":"Apparent (ostensible) authority","w":["Express (actual) authority","Implied (incidental) authority","Ratified (retrospective) authority"],"e":"Express authority is given directly; implied authority covers what's reasonably incidental; apparent authority comes from how the principal presents things."},{"id":"u1t5-10","t":"u1t5","q":"Which of these is a duty an agent owes to their principal?","c":"Not to make a secret profit","w":["To guarantee the principal's debts","To pay the principal's taxes","To act in the third party's best interests"],"e":"Agents must obey lawful instructions, use care and skill, act personally, avoid conflicts and secret profits, and account for money."},{"id":"u1t5-11","t":"u1t5","q":"An agency relationship is automatically ended by:","c":"The death of the principal","w":["The agent moving house","A fall in the stock market","The principal going on holiday"],"e":"Agency ends on completion, by agreement, or by the death, insanity or bankruptcy of the principal."},{"id":"u1t5-12","t":"u1t5","q":"The two types of Lasting Power of Attorney are:","c":"Property and financial affairs, and health and welfare","w":["General powers and enduring powers of attorney","Ordinary attorney and lasting attorney powers","Medical treatment decisions and legal proceedings"],"e":"LPAs replaced enduring powers of attorney from 1 October 2007."},{"id":"u1t5-13","t":"u1t5","q":"A Lasting Power of Attorney can only be used once it has been:","c":"Registered with the Office of the Public Guardian","w":["Signed and certified by the donor's GP","Approved by a judge at the Court of Protection","Lodged with the donor's bank and solicitor"],"e":"Registration with the OPG is required before the attorney can act."},{"id":"u1t5-14","t":"u1t5","q":"An ordinary (general) power of attorney:","c":"Ends automatically if the donor loses mental capacity","w":["Continues if the donor loses capacity","Must be registered with the Office of the Public Guardian","Can only cover health decisions"],"e":"Ordinary POAs suit short-term needs, such as being abroad. An LPA is needed to cover loss of capacity."},{"id":"u1t5-15","t":"u1t5","q":"A health and welfare Lasting Power of Attorney can be used:","c":"Only when the donor lacks capacity to make the decision in question","w":["As soon as it is registered, even if the donor has capacity","Only for financial decisions","Only with the Court of Protection's approval each time"],"e":"A property and financial affairs LPA can be used while the donor has capacity, with their consent. A health and welfare LPA cannot."},{"id":"u1t5-16","t":"u1t5","q":"Enduring powers of attorney (EPAs):","c":"Can no longer be made, but those made before October 2007 remain valid","w":["Can still be made today as an alternative to a Lasting Power of Attorney","Became invalid in October 2007 and had to be replaced by an LPA","Only cover health and welfare decisions, not property or money"],"e":"EPAs could only be made before 1 October 2007. Existing ones still work, must be registered once the donor is losing capacity, and cover property and financial affairs only."},{"id":"u1t5-17","t":"u1t5","q":"If someone loses mental capacity without an LPA in place, the Court of Protection can appoint a:","c":"Deputy","w":["Trustee in bankruptcy","Executor","Official Receiver"],"e":"Applying for a deputy is slower and more expensive than having an LPA."},{"id":"u1t5-18","t":"u1t5","q":"Under the Mental Capacity Act 2005, a person:","c":"Must be assumed to have capacity unless it is established that they lack it","w":["Over 75 is presumed to lack capacity","Who makes an unwise decision is treated as lacking capacity","Must prove their capacity before making any decision"],"e":"The Act's principles include presuming capacity, helping people decide, accepting that an unwise decision is not proof of incapacity, acting in their best interests and choosing the least restrictive option."},{"id":"u1t5-19","t":"u1t5","q":"When one joint tenant dies, their share of the property:","c":"Passes automatically to the surviving joint tenant(s), whatever the will says","w":["Passes under their will, or under intestacy if there is no will","Passes to their children in equal shares under the intestacy rules","Must be sold, with the proceeds divided between their beneficiaries"],"e":"This is the right of survivorship. A joint tenant's share cannot be left by will."},{"id":"u1t5-20","t":"u1t5","q":"Tenants in common:","c":"Can own unequal shares, and each share passes under the owner's will or intestacy","w":["Must always own equal shares, which pass under each owner's will","Have a right of survivorship, so shares pass automatically on death","Cannot sell or leave their share without the other owners' consent"],"e":"A tenancy in common suits blended families or unequal contributions."},{"id":"u1t5-21","t":"u1t5","q":"A joint tenancy can be converted into a tenancy in common by:","c":"Serving a notice of severance on the other joint owner(s)","w":["Writing a new will leaving the share to someone else","Telling the mortgage lender about the change","Paying stamp duty on the share being converted"],"e":"Severance ends the right of survivorship. The other owner's agreement is not needed."},{"id":"u1t5-22","t":"u1t5","q":"Leasehold ownership gives:","c":"The right to occupy a property for a fixed term under a lease","w":["Outright ownership of the land and buildings, with no time limit","Ownership of the common parts of a block through an association","A licence to occupy that the owner can end at any time"],"e":"Leases run down over time. A short remaining lease can affect value and mortgageability."},{"id":"u1t5-23","t":"u1t5","q":"Commonhold:","c":"Freehold ownership of individual units, with shared ownership of common parts","w":["Is another name for a long leasehold of more than 99 years","Means the local council owns the building and grants tenancies","Only applies to detached houses, not to flats or shared buildings"],"e":"Commonhold was introduced by the Commonhold and Leasehold Reform Act 2002 as an alternative to leasehold flats."},{"id":"u1t5-24","t":"u1t5","q":"A person made bankrupt is usually automatically discharged after:","c":"12 months","w":["3 years","6 years","6 months"],"e":"Discharge normally comes after one year, though an income payments arrangement can run for 3 years and restrictions orders can last 2 to 15 years."},{"id":"u1t5-25","t":"u1t5","q":"A creditor can petition for someone's bankruptcy if they are owed at least:","c":"£5,000","w":["£750","£1,000","£50,000"],"e":"The creditor's petition threshold is £5,000. Debtors can apply for their own bankruptcy online."},{"id":"u1t5-26","t":"u1t5","q":"On bankruptcy, the bankrupt's estate is initially dealt with by:","c":"The Official Receiver","w":["The Financial Ombudsman","The Court of Protection","The bankrupt's bank"],"e":"The Official Receiver (or an appointed trustee in bankruptcy) takes control of the assets and distributes them to creditors."},{"id":"u1t5-27","t":"u1t5","q":"An individual voluntary arrangement (IVA) must be approved by creditors holding at least:","c":"75% by value of the debts of those creditors who vote","w":["50% by number of the creditors who vote","100% of all creditors, whether or not they vote","51% by value of all creditors owed money"],"e":"An IVA is a formal agreement supervised by an insolvency practitioner, typically lasting 5 years. Once approved, it binds all unsecured creditors."},{"id":"u1t5-28","t":"u1t5","q":"In a company liquidation, ordinary shareholders:","c":"Are paid last, after all creditors have been paid in full","w":["Are paid first, as they own the company","Are paid before unsecured creditors but after secured ones","Rank equally with secured lenders and banks"],"e":"Secured creditors, liquidation costs, preferential creditors, floating charge holders and unsecured creditors all rank ahead of shareholders."},{"id":"u1t5-29","t":"u1t5","q":"A members' voluntary liquidation is used when a company is:","c":"Solvent","w":["Insolvent","In administration","Subject to a creditor's petition"],"e":"An MVL winds up a solvent company. Insolvent companies go through a creditors' voluntary or compulsory liquidation."},{"id":"u1t6-01","t":"u1t6","q":"For a will to be valid in England and Wales, it must be signed by the testator in the presence of:","c":"Two witnesses who are present at the same time","w":["One witness","A solicitor","Two witnesses, who may attend at different times"],"e":"The Wills Act 1837 requires writing, the testator's signature, and two witnesses present together who then sign."},{"id":"u1t6-02","t":"u1t6","q":"If a witness to a will is also a beneficiary under it:","c":"The gift to that witness fails, but the rest of the will is valid","w":["The whole will is invalid and the intestacy rules apply instead","The gift is valid, but the witness cannot also act as executor","The gift is valid if the testator clearly intended it"],"e":"A gift to a witness, or to a witness's spouse or civil partner, fails. The rest of the will stands. Beneficiaries and their spouses should never witness a will."},{"id":"u1t6-03","t":"u1t6","q":"In England and Wales, getting married or entering a civil partnership:","c":"Revokes an existing will, unless it was made in contemplation of that marriage","w":["Has no effect on an existing will unless the testator changes it","Revokes any gifts to children, but the rest of the will stands","Revokes the will only if the new spouse objects to it"],"e":"A new will is usually needed after marriage. In Scotland, marriage does not revoke a will."},{"id":"u1t6-04","t":"u1t6","q":"On divorce in England and Wales, an existing will:","c":"It stays valid, but the ex-spouse is treated as having died","w":["Is revoked entirely, so the intestacy rules apply","Is unaffected, so the former spouse still inherits","Is changed so that everything passes to the children"],"e":"Gifts to the ex-spouse lapse and they cannot act as executor, but the rest of the will stands."},{"id":"u1t6-05","t":"u1t6","q":"A codicil is:","c":"A document that amends an existing will, signed and witnessed with the same formalities","w":["A non-binding letter setting out the testator's wishes to the executors","A court order confirming the executors' authority to deal with the estate","A trust set up during the testator's lifetime to hold assets outside the will"],"e":"A codicil adds to or changes a will without rewriting it."},{"id":"u1t6-06","t":"u1t6","q":"Where there is no will, the person who deals with the estate in England and Wales must obtain:","c":"Letters of administration","w":["A grant of probate","A lasting power of attorney","Confirmation"],"e":"Executors named in a will get probate. Administrators get letters of administration. In Scotland the equivalent is ‘confirmation’."},{"id":"u1t6-07","t":"u1t6","q":"A legacy of ‘everything that remains after paying debts, expenses and other gifts’ is a:","c":"Residuary legacy","w":["Pecuniary legacy","Specific legacy","Demonstrative legacy"],"e":"The residue is what is left once everything else has been paid out."},{"id":"u1t6-08","t":"u1t6","q":"A gift of £5,000 cash to a niece in a will is a:","c":"Pecuniary legacy","w":["Specific legacy","Residuary legacy","Demonstrative legacy"],"e":"Pecuniary means a sum of money. A specific legacy is a particular item, such as ‘my car’."},{"id":"u1t6-09","t":"u1t6","q":"A will leaves ‘my Ford Focus’ to a friend, but the testator sold the car before death. The gift:","c":"Fails (this is called ademption)","w":["Is replaced by the car's cash value","Passes to the residuary beneficiary","Is replaced by whatever car the testator owned at death"],"e":"A specific legacy fails if the item no longer exists at death."},{"id":"u1t6-10","t":"u1t6","q":"Under the English intestacy rules, where the deceased leaves a spouse and children, the spouse receives the personal chattels, half the remaining estate, and a statutory legacy of:","c":"£322,000","w":["£270,000","£250,000","£450,000"],"e":"The statutory legacy has been £322,000 since 26 July 2023. The other half of the remainder goes to the children on statutory trusts."},{"id":"u1t6-11","t":"u1t6","q":"Under the English intestacy rules, if the deceased leaves a spouse but no children or other descendants, the spouse:","c":"Inherits the whole estate","w":["Shares the estate with the deceased's parents","Receives £322,000 and the rest goes to siblings","Receives half the estate"],"e":"Since 2014, a spouse or civil partner takes everything where there are no descendants."},{"id":"u1t6-12","t":"u1t6","q":"An unmarried partner of someone who dies without a will:","c":"Has no automatic right, but may be able to claim under the 1975 Inheritance Act","w":["Is treated exactly like a spouse under the intestacy rules","Inherits half the estate, with the rest going to blood relatives","Inherits everything if they had lived together for at least two years"],"e":"Cohabitees get nothing under intestacy, but may claim under the Inheritance (Provision for Family and Dependants) Act 1975. This is a key reason for unmarried couples to make wills."},{"id":"u1t6-13","t":"u1t6","q":"Under English intestacy rules, where there is no spouse and no descendants, the estate passes first to the deceased's:","c":"Parents","w":["Brothers and sisters","Grandparents","The Crown"],"e":"The order is: spouse and descendants, then parents, then full siblings, then half siblings, grandparents, full uncles and aunts, half uncles and aunts, and finally the Crown."},{"id":"u1t6-14","t":"u1t6","q":"If there are no relatives entitled under intestacy, the estate passes to:","c":"The Crown (bona vacantia)","w":["The local council","A charity chosen by the court","The deceased's executors"],"e":"Ownerless property passes to the Crown, or to the Duchies of Lancaster or Cornwall in some areas."},{"id":"u1t6-15","t":"u1t6","q":"In Scotland, a surviving spouse and children have ‘legal rights’ to:","c":"A share of the deceased's moveable estate, whatever the will says","w":["The whole of the heritable estate, including land and buildings","Nothing at all, if there is a valid will","The family home only, whatever its value"],"e":"Scottish legal rights apply to moveable property (money, shares, possessions), not land and buildings. A child can make a valid will in Scotland from age 12."},{"id":"u1t6-16","t":"u1t6","q":"The person who creates a trust is known as the:","c":"Settlor","w":["Trustee","Beneficiary","Protector"],"e":"The settlor transfers assets to trustees, who hold them for the beneficiaries."},{"id":"u1t6-17","t":"u1t6","q":"In a bare (absolute) trust:","c":"The beneficiary is absolutely entitled to the capital and income","w":["The trustees choose which of the beneficiaries benefits","One person gets the income and another gets the capital","The settlor can take the assets back at any time"],"e":"The trustees are nominees. The beneficiary can call for the assets at 18 (16 in Scotland), and the assets are treated as theirs for tax."},{"id":"u1t6-18","t":"u1t6","q":"For IHT, a gift by an individual into a bare trust is treated as:","c":"A potentially exempt transfer","w":["A chargeable lifetime transfer at 20%","Always exempt","A transfer of value taxed at 40% immediately"],"e":"Gifts into bare trusts are PETs. Gifts into most other trusts are chargeable lifetime transfers."},{"id":"u1t6-19","t":"u1t6","q":"In an interest in possession trust, the person entitled to the income is the:","c":"Life tenant","w":["Remainderman","Settlor","Protector"],"e":"The life tenant gets the income (or use of the asset). The remainderman gets the capital when the interest ends."},{"id":"u1t6-20","t":"u1t6","q":"A discretionary trust:","c":"Lets the trustees decide which beneficiaries benefit, and when","w":["Gives one named beneficiary an absolute right to everything","Pays income to a life tenant and capital to a remainderman","Can only be set up by will, and must end within 10 years"],"e":"Discretionary trusts give flexibility and control, for example where beneficiaries are young or vulnerable."},{"id":"u1t6-21","t":"u1t6","q":"Relevant property trusts, such as discretionary trusts, can face an IHT periodic charge every:","c":"10 years, at a maximum rate of 6%","w":["7 years, at a maximum rate of 20%","5 years, at a maximum rate of 4%","Year, at a maximum rate of 1%"],"e":"There are also exit charges when capital leaves the trust between ten-year anniversaries."},{"id":"u1t6-22","t":"u1t6","q":"Under the Trustee Act 2000, when investing, trustees must:","c":"Consider suitability and diversification, and take proper advice","w":["Invest only in gilts and other government-backed assets","Follow the beneficiaries' instructions at all times","Avoid any investment where the capital value could fall"],"e":"The Act gives a general power of investment, a statutory duty of care, and a duty to review investments and take advice."},{"id":"u1t6-23","t":"u1t6","q":"Most UK express trusts must be registered with:","c":"HMRC's Trust Registration Service","w":["Companies House's register of trusts","HM Land Registry's trust register","The FCA's register of trusts"],"e":"Most express trusts, including many non-taxable ones, must be registered on the TRS."},{"id":"u1t6-24","t":"u1t6","q":"A parent puts money into a bare trust for their minor child, and the income exceeds £100 a year. How is the income taxed?","c":"All of the income is taxed as the parent's","w":["Only the income above £100 is taxed on the parent","The child pays tax at 45%","No tax is due because it is in trust"],"e":"This anti-avoidance rule applies to parental gifts. Gifts from grandparents are taxed on the child."},{"id":"u1t6-25","t":"u1t6","q":"A flexible (discretionary) trust for a life policy allows the trustees to:","c":"Choose which of the potential beneficiaries receive the proceeds","w":["Change the life assured to another family member","Cancel the policy without the settlor's knowledge","Keep the proceeds for themselves if they wish"],"e":"Flexible trusts let trustees respond to changes in family circumstances after death."},{"id":"u1t6-26","t":"u1t6","q":"On intestacy in England and Wales, children's shares are held on ‘statutory trusts’ until they:","c":"Reach 18, or marry or form a civil partnership earlier","w":["Reach 21, or marry or form a civil partnership earlier","Reach 25, or finish full-time education if earlier","Reach 16, or leave school if earlier"],"e":"Until then, the administrators hold the share as trustees."},{"id":"u1t6-27","t":"u1t6","q":"Which of these is a common reason for using a trust?","c":"To control how and when assets pass to beneficiaries, such as young children","w":["To avoid paying any income tax or capital gains tax on the assets permanently","To keep the assets hidden from HMRC and other authorities","To avoid the need for the settlor to make a will"],"e":"Trusts provide control, protection for vulnerable beneficiaries, privacy, speed (avoiding probate) and IHT planning."},{"id":"u1t6-28","t":"u1t6","q":"In England and Wales, a person can normally make a valid will from age:","c":"18","w":["16","21","12"],"e":"The minimum age is 18 in England and Wales (unless on active military service) and 12 in Scotland."},{"id":"u1t7-01","t":"u1t7","q":"The Financial Services Act 1986 set up a system of regulation overseen by:","c":"The Securities and Investments Board, with self-regulating organisations","w":["The FCA and the PRA, under a ‘twin peaks’ model","The Financial Services Authority, acting as a single statutory regulator","The Bank of England alone, using statutory powers"],"e":"The 1986 Act created ‘self-regulation within a statutory framework’, with SROs such as LAUTRO, FIMBRA and IMRO under the SIB."},{"id":"u1t7-02","t":"u1t7","q":"Which body became the UK's single financial services regulator under the Financial Services and Markets Act 2000?","c":"The Financial Services Authority (FSA)","w":["The Financial Conduct Authority","The Securities and Investments Board","The Office of Fair Trading"],"e":"The SIB was renamed the FSA in 1997. FSMA 2000 gave it statutory powers as the single regulator."},{"id":"u1t7-03","t":"u1t7","q":"FSMA 2000 came fully into force on 1 December 2001, a date known as:","c":"N2","w":["Big Bang","M-Day","A-Day"],"e":"N2 was the date the FSA took on its full powers. M-Day (31 October 2004) brought in mortgage regulation."},{"id":"u1t7-04","t":"u1t7","q":"Mortgage advice and arranging became regulated by the FSA on:","c":"31 October 2004 (M-Day)","w":["1 December 2001 (N2)","14 January 2005 (GI-Day)","1 April 2013 (FCA launch)"],"e":"General insurance broking followed on 14 January 2005."},{"id":"u1t7-05","t":"u1t7","q":"The Financial Services Act 2012:","c":"Abolished the FSA and created the FCA and PRA from 1 April 2013","w":["Created the FSA as a single regulator from 1 December 2001","Introduced the Consumer Duty and Principle 12 from 31 July 2013","Transferred mortgage regulation from the FSA to the OFT from 2013"],"e":"The ‘twin peaks’ model split conduct regulation (FCA) from prudential regulation (PRA, within the Bank of England)."},{"id":"u1t7-06","t":"u1t7","q":"The Retail Distribution Review, implemented on 31 December 2012:","c":"Banned investment advice commission and raised qualification standards","w":["Introduced affordability checks and interest-only rules for mortgages","Transferred consumer credit regulation from the OFT to the FCA","Created the Financial Ombudsman Service and the FSCS"],"e":"The RDR also introduced adviser charging and the Statement of Professional Standing."},{"id":"u1t7-07","t":"u1t7","q":"The Mortgage Market Review, implemented in April 2014, introduced:","c":"Stricter affordability checks, with advice the norm for most sales","w":["The ban on commission for investment and pension advice","Regulation of all buy-to-let mortgages for the first time","The Consumer Duty and its four customer outcomes"],"e":"The MMR (26 April 2014) required lenders to verify income and assess affordability, including stress testing for rate rises."},{"id":"u1t7-08","t":"u1t7","q":"Regulation of consumer credit transferred from the Office of Fair Trading to the FCA on:","c":"1 April 2014","w":["1 December 2001","31 October 2004","21 March 2016"],"e":"This brought credit cards, loans, payday lending and debt advice under FCA rules."},{"id":"u1t7-09","t":"u1t7","q":"The Mortgage Credit Directive, implemented on 21 March 2016, brought which loans into the FCA's mortgage rules (MCOB)?","c":"Second charge mortgages","w":["All buy-to-let mortgages","Commercial loans","Credit cards"],"e":"Second charge loans moved from consumer credit rules to MCOB. The MCD also introduced the ESIS and a regime for consumer buy-to-let."},{"id":"u1t7-10","t":"u1t7","q":"The Senior Managers and Certification Regime was extended to all FCA solo-regulated firms on:","c":"9 December 2019","w":["1 April 2013","31 July 2023","7 March 2016"],"e":"SM&CR started with banks in March 2016, extended to insurers in December 2018 and to solo-regulated firms in December 2019, replacing the approved persons regime."},{"id":"u1t7-11","t":"u1t7","q":"The UK's Brexit transition period, at the end of which EU passporting rights ended, finished on:","c":"31 December 2020","w":["31 January 2020","29 March 2019","1 January 2022"],"e":"The UK left the EU on 31 January 2020. The transition period ended on 31 December 2020."},{"id":"u1t7-12","t":"u1t7","q":"The Financial Services Act 2021 required the FCA to consult on a new duty of care for consumers. This led to:","c":"The Consumer Duty","w":["The Retail Distribution Review","The Mortgage Market Review","Treating Customers Fairly"],"e":"The Consumer Duty (Principle 12 and PRIN 2A) followed, coming into force on 31 July 2023."},{"id":"u1t7-13","t":"u1t7","q":"The Financial Services and Markets Act 2023 gave the FCA and PRA a new secondary objective to:","c":"Facilitate the UK's international competitiveness and growth","w":["Protect consumers from all investment losses, whatever the cause","Maintain price stability by setting the inflation target each year","Reduce the number of firms in the market to make supervision easier"],"e":"FSMA 2023 also began replacing assimilated EU financial services law with regulators' own rules."},{"id":"u1t7-14","t":"u1t7","q":"The Money and Pensions Service (whose consumer brand is MoneyHelper) was formed by merging:","c":"The Money Advice Service, The Pensions Advisory Service and Pension Wise","w":["The Financial Services Authority, the Office of Fair Trading and the FOS","The FSCS, the Financial Ombudsman Service and the Pensions Ombudsman","The Pensions Regulator, the Pension Protection Fund and the DWP"],"e":"MaPS began in 2019 and launched MoneyHelper in 2021, offering free, impartial guidance."},{"id":"u1t7-15","t":"u1t7","q":"Which body regulates data protection in the UK?","c":"The Information Commissioner's Office (ICO)","w":["The FCA","The Competition and Markets Authority","The Pensions Regulator"],"e":"The ICO enforces UK GDPR and the Data Protection Act 2018."},{"id":"u1t7-16","t":"u1t7","q":"Which body is responsible for competition law across the whole UK economy, including market investigations?","c":"The Competition and Markets Authority","w":["The PRA","The Financial Ombudsman Service","HM Treasury"],"e":"The FCA has concurrent competition powers for financial services, but the CMA covers the whole economy."},{"id":"u1t7-17","t":"u1t7","q":"External auditors of an authorised firm:","c":"Must report certain matters, such as serious breaches, to the regulators","w":["Are employed and paid by the FCA to inspect the firm each year","Must approve each new product before the firm can launch it","Are responsible for investigating and resolving customer complaints"],"e":"Auditors give an independent opinion on the accounts and have a statutory duty to report some matters to the regulators."},{"id":"u1t7-18","t":"u1t7","q":"Many small advice firms obtain compliance support by:","c":"Joining a network as an appointed representative, or using consultants","w":["Asking the FCA to run their compliance function for a fee","Relying on the FOS to check their advice files each year","Asking product providers to approve each piece of advice"],"e":"Even with external help, responsibility for compliance stays with the firm (or the principal, for ARs)."},{"id":"u1t7-19","t":"u1t7","q":"The ‘Big Bang’ of 27 October 1986 refers to:","c":"Deregulation of the London Stock Exchange, including ending fixed commissions","w":["The creation of the Financial Services Authority as the single regulator","The launch of the euro and the start of trading in euro-denominated shares","The transfer of interest rate decisions from the Treasury to the Bank of England"],"e":"Big Bang transformed the City and coincided with the Financial Services Act 1986."},{"id":"u1t7-20","t":"u1t7","q":"In 2006, under its Treating Customers Fairly initiative, the FSA set out:","c":"Six consumer outcomes","w":["Four outcomes","Eleven principles","Five conduct rules"],"e":"TCF's six outcomes are now built on by the Consumer Duty."},{"id":"u1t7-21","t":"u1t7","q":"The Consumer Duty applied to new and existing open products from:","c":"31 July 2023, and to closed products and services from 31 July 2024","w":["31 July 2022, and to closed products and services from 31 July 2023","1 April 2023, and to closed products and services from 1 April 2025","31 December 2023, with closed products and services excluded entirely"],"e":"Closed products had an extra year to comply."},{"id":"u1t8a-01","t":"u1t8a","q":"The FCA's strategic objective is to:","c":"Ensure that the relevant markets function well","w":["Promote the safety and soundness of firms","Maintain price stability","Protect the FSCS fund"],"e":"The strategic objective is supported by three operational objectives: consumer protection, market integrity and effective competition."},{"id":"u1t8a-02","t":"u1t8a","q":"Which of these is NOT one of the FCA's three operational objectives?","c":"Promoting the safety and soundness of banks","w":["Securing an appropriate degree of protection for consumers","Protecting and enhancing the integrity of the UK financial system","Promoting effective competition in the interests of consumers"],"e":"Safety and soundness is the PRA's general objective."},{"id":"u1t8a-03","t":"u1t8a","q":"The PRA's general objective is to:","c":"Promote the safety and soundness of the firms it regulates","w":["Ensure that the relevant financial markets function well","Promote effective competition between mortgage brokers","Resolve consumer complaints about banks and insurers"],"e":"The PRA also has an insurance objective (policyholder protection) and secondary objectives on competition and on competitiveness and growth."},{"id":"u1t8a-04","t":"u1t8a","q":"Which firms are ‘dual-regulated’, supervised by the PRA for prudential matters and the FCA for conduct?","c":"Banks, building societies, credit unions, insurers and major investment firms","w":["Mortgage brokers, protection advisers and general insurance brokers","Independent financial advisers, paraplanners and wealth planners","Consumer credit brokers, debt advice firms and claims companies"],"e":"Around 1,500 firms are dual-regulated. Most other firms, including brokers and advisers, are solo-regulated by the FCA."},{"id":"u1t8a-05","t":"u1t8a","q":"A mortgage and protection broker is regulated by:","c":"The FCA only (it is solo-regulated)","w":["The PRA only","Both the PRA and the FCA","The Bank of England's Financial Policy Committee"],"e":"The FCA is responsible for both conduct and prudential regulation of solo-regulated firms."},{"id":"u1t8a-06","t":"u1t8a","q":"The PRA's insurance objective is to:","c":"Contribute to securing appropriate protection for policyholders","w":["Set maximum premiums for compulsory insurance such as motor cover","Handle complaints from policyholders about how claims are dealt with","Guarantee that every valid insurance claim will be paid in full"],"e":"This sits alongside its general objective of safety and soundness."},{"id":"u1t8a-07","t":"u1t8a","q":"The Prudential Regulation Authority is part of:","c":"The Bank of England","w":["HM Treasury","The FCA","The Financial Ombudsman Service"],"e":"The PRA has been part of the Bank of England since 2013 (a committee of the Bank since 2017)."},{"id":"u1t8a-08","t":"u1t8a","q":"The FCA is accountable to:","c":"HM Treasury and, through it, Parliament","w":["The Bank of England and its Court of Directors","The PRA and the Financial Policy Committee","The firms it regulates, through their trade bodies"],"e":"The FCA is an independent body. It reports annually to the Treasury, which lays its report before Parliament."},{"id":"u1t8a-09","t":"u1t8a","q":"Principles-based regulation means the FCA:","c":"Sets high-level outcomes and expects firms to decide how best to achieve them","w":["Has no detailed rules at all and relies only on voluntary industry guidance","Approves every product and promotion before it can be sold to consumers","Writes a detailed rule for every situation and checks firms follow each one"],"e":"Principles-based regulation puts responsibility on senior management to judge what is right, backed by outcome-focused supervision."},{"id":"u1t8a-10","t":"u1t8a","q":"Which of these can the FCA NOT do itself?","c":"Sentence an individual to prison","w":["Impose an unlimited fine","Issue a public censure","Withdraw a firm's authorisation"],"e":"The FCA can prosecute some offences, but only the courts can impose prison sentences."},{"id":"u1t8a-11","t":"u1t8a","q":"Contested FCA enforcement decisions are taken by:","c":"The Regulatory Decisions Committee","w":["The Financial Ombudsman Service","The Financial Policy Committee","The FSCS board"],"e":"The RDC is separate from the FCA's investigating staff, which keeps decision-making fair."},{"id":"u1t8a-12","t":"u1t8a","q":"A firm that disagrees with an FCA decision notice can refer the matter to:","c":"The Upper Tribunal","w":["The Financial Ombudsman Service","The FSCS","The Pensions Ombudsman"],"e":"The Upper Tribunal (Tax and Chancery Chamber) hears the case afresh and can confirm, change or overturn the FCA's decision."},{"id":"u1t8a-13","t":"u1t8a","q":"Firms that settle early in an FCA investigation may receive a discount on the financial penalty of up to:","c":"30%","w":["10%","50%","75%"],"e":"The settlement discount scheme rewards early cooperation."},{"id":"u1t8a-14","t":"u1t8a","q":"A prohibition order:","c":"Bans an individual from performing some or all regulated functions","w":["Freezes a firm's bank accounts during an investigation","Prevents a firm from advertising its products","Stops a customer from bringing a complaint"],"e":"Prohibition is used where someone is not fit and proper."},{"id":"u1t8a-15","t":"u1t8a","q":"The usual order of FCA statutory notices in enforcement cases is:","c":"Warning notice, decision notice, final notice","w":["Final notice, warning notice, decision notice","Decision notice, final notice, warning notice","Warning notice, final notice, decision notice"],"e":"A warning notice sets out the proposed action, a decision notice confirms it, and a final notice records the outcome."},{"id":"u1t8a-16","t":"u1t8a","q":"The FCA can require firms to pay compensation to consumers who have lost out through:","c":"Restitution orders or consumer redress schemes","w":["FSCS levies charged on the firms involved","Increased case fees paid to the FOS","Prohibition orders against individual staff"],"e":"The FCA can seek restitution through the courts, impose it directly or set up an industry-wide redress scheme."},{"id":"u1t8a-17","t":"u1t8a","q":"The FCA is funded mainly by:","c":"Fees and levies on the firms it regulates","w":["General taxation through HM Treasury","The fines it imposes on firms and individuals","Case fees paid to the Financial Ombudsman"],"e":"Fines (net of enforcement costs) are passed to the Treasury and do not fund the FCA's running costs."},{"id":"u1t8a-18","t":"u1t8a","q":"Which of these offences can the FCA prosecute?","c":"Insider dealing","w":["Benefit fraud","Council tax evasion","Burglary"],"e":"The FCA can prosecute insider dealing, market manipulation, unauthorised business and some money laundering offences."},{"id":"u1t8a-19","t":"u1t8a","q":"Carrying on a regulated activity without being authorised or exempt is:","c":"A criminal offence, and the contracts may be unenforceable against the customer","w":["A civil matter only, with no criminal penalty, though the FCA can issue a fine","Allowed for up to 12 months while the firm's application is being processed","Allowed as long as the firm holds professional indemnity insurance"],"e":"Breaching the general prohibition (section 19 FSMA) can lead to up to two years in prison and an unlimited fine."},{"id":"u1t8a-20","t":"u1t8a","q":"When pursuing its consumer protection objective, the FCA must have regard to the general principle that consumers:","c":"Should take responsibility for their own decisions","w":["Are never responsible for their losses","Must always be compensated in full","Should not need to read product documents"],"e":"FSMA lists ‘consumers should take responsibility for their decisions’ alongside factors such as the differing degrees of risk and consumers' differing experience."},{"id":"u1t8a-21","t":"u1t8a","q":"The FCA has concurrent competition powers with the CMA. This means it can:","c":"Enforce competition law in financial services","w":["Set the prices firms charge for financial products","Approve or block every company merger in the UK","Overrule decisions made by the CMA in other sectors"],"e":"Concurrency allows the FCA to tackle anti-competitive behaviour in its sector directly."},{"id":"u1t8a-22","t":"u1t8a","q":"The FCA must consult statutory panels, including the:","c":"Financial Services Consumer Panel","w":["Monetary Policy Committee","Financial Ombudsman Service board","Treasury Select Committee"],"e":"The statutory panels are the Consumer Panel, Practitioner Panel, Smaller Business Practitioner Panel and Markets Practitioner Panel."},{"id":"u1t8b-01","t":"u1t8b","q":"How many Principles for Businesses are there in the FCA Handbook?","c":"12","w":["11","10","6"],"e":"There were 11 until the Consumer Duty added Principle 12 in July 2023."},{"id":"u1t8b-02","t":"u1t8b","q":"Principle 12, introduced with the Consumer Duty, requires firms to:","c":"Act to deliver good outcomes for retail customers","w":["Maximise returns for shareholders","Offer the cheapest product in the market","Give advice to every customer"],"e":"Principle 12 is supported by the three cross-cutting rules and four outcomes in PRIN 2A."},{"id":"u1t8b-03","t":"u1t8b","q":"Which of these is a threshold condition that a firm must meet to become, and remain, authorised?","c":"Having appropriate resources","w":["Being a member of a trade association","Employing at least 50 staff","Being listed on the London Stock Exchange"],"e":"Threshold conditions include legal status, location of offices, effective supervision, appropriate resources, suitability and an appropriate business model."},{"id":"u1t8b-04","t":"u1t8b","q":"A firm obtains permission to carry on regulated activities by being granted:","c":"A Part 4A permission under FSMA","w":["A consumer credit licence from the OFT","A certificate from the FOS","Membership of the FSCS"],"e":"Part 4A permission sets out exactly which regulated activities and investments a firm can deal with."},{"id":"u1t8b-05","t":"u1t8b","q":"Which of these is a regulated activity?","c":"Advising on a regulated mortgage contract","w":["Giving general guidance on budgeting","Acting as an estate agent selling a house","Writing wills"],"e":"Regulated activities are listed in the Regulated Activities Order 2001. Will writing and estate agency are not FCA-regulated."},{"id":"u1t8b-06","t":"u1t8b","q":"An appointed representative:","c":"Is exempt from authorisation because its principal firm takes regulatory responsibility for it","w":["Is authorised directly by the FCA and responsible for its own compliance","Does not have to follow FCA rules, as it is not authorised itself","Is regulated by the PRA rather than the FCA because it is exempt"],"e":"The principal must oversee its ARs and is responsible for their regulated activities."},{"id":"u1t8b-07","t":"u1t8b","q":"Which part of the FCA Handbook contains the detailed conduct rules for mortgage business?","c":"MCOB","w":["ICOBS","COBS","CASS"],"e":"MCOB (Mortgages and Home Finance: Conduct of Business) covers mortgages, equity release and home purchase plans."},{"id":"u1t8b-08","t":"u1t8b","q":"Conduct rules for general insurance and pure protection business are in:","c":"ICOBS","w":["MCOB","COBS","SYSC"],"e":"ICOBS (Insurance: Conduct of Business) covers non-investment insurance, including term assurance and income protection."},{"id":"u1t8b-09","t":"u1t8b","q":"The CASS rules exist mainly to:","c":"Protect client money and assets by keeping them separate from the firm's own","w":["Set capital and liquidity requirements for banks and building societies","Set out how consumer complaints must be handled and how quickly","Regulate the content and approval of financial promotions"],"e":"Segregation means client money should be protected if the firm fails."},{"id":"u1t8b-10","t":"u1t8b","q":"The SYSC sourcebook covers:","c":"Senior management arrangements, systems and controls","w":["Mortgage advice and disclosure standards","Compensation limits and FSCS claims procedures","Ombudsman procedures and complaint time limits"],"e":"SYSC also includes rules on conflicts of interest, whistleblowing and parts of SM&CR."},{"id":"u1t8b-11","t":"u1t8b","q":"The individual Conduct Rules under SM&CR are found in which part of the Handbook?","c":"COCON","w":["APER","COBS","DISP"],"e":"COCON replaced APER (the Statements of Principle for Approved Persons) for SM&CR firms."},{"id":"u1t8b-12","t":"u1t8b","q":"The FCA's ‘fit and proper’ test (FIT) considers:","c":"Honesty, integrity and reputation; competence and capability; and financial soundness","w":["Age and experience; qualifications held; salary and bonus history; and references","Sales record; number of clients; and length of service","Health and fitness; nationality; and home address"],"e":"Firms use FIT when certifying staff and when applying for senior manager approval."},{"id":"u1t8b-13","t":"u1t8b","q":"Under the Certification Regime, firms must:","c":"Assess certified staff as fit and proper when appointed and at least once a year","w":["Ask the FCA to approve each certified person before they start","Re-certify staff every five years, or sooner if concerns arise","Certify directors only, as other staff are covered by the firm"],"e":"Certification is done by the firm, not the FCA. Senior managers need FCA approval."},{"id":"u1t8b-14","t":"u1t8b","q":"Which of these is one of the individual Conduct Rules?","c":"You must pay due regard to the interests of customers and treat them fairly","w":["You must achieve the sales targets agreed with your manager","You must report every customer complaint to the FOS","You must hold an appropriate qualification such as CeMAP"],"e":"The six individual rules: act with integrity; act with due skill, care and diligence; be open and cooperative with regulators; pay due regard to customers' interests and treat them fairly; observe proper standards of market conduct; and act to deliver good outcomes for retail customers."},{"id":"u1t8b-15","t":"u1t8b","q":"The individual Conduct Rules apply to:","c":"Almost all staff, except ancillary roles such as cleaners and caterers","w":["Senior managers only, as they are approved by the FCA","Certified staff only, as they are assessed as fit and proper","Directors and non-executive directors only, as they run the firm"],"e":"The rules apply very widely. Firms must train staff on them."},{"id":"u1t8b-16","t":"u1t8b","q":"Under the ‘duty of responsibility’, a senior manager can be held accountable if:","c":"A breach happens in their area and they didn't take reasonable steps to stop it","w":["Any employee anywhere in the firm breaks a rule, whatever steps they took","Their firm's share price or profits fall during the year","A customer complains about a product in their area, even if unfounded"],"e":"The FCA must show the senior manager failed to take reasonable steps."},{"id":"u1t8b-17","t":"u1t8b","q":"Under SM&CR, each senior manager must have:","c":"A statement of responsibilities setting out their role","w":["A CeMAP or equivalent mortgage qualification","A personal guarantee lodged with the FSCS","At least 10 years' experience in a regulated firm"],"e":"Larger firms also need a management responsibilities map."},{"id":"u1t8b-18","t":"u1t8b","q":"The Training and Competence sourcebook (TC) requires firms to:","c":"Make sure staff are competent, supervised and keep their competence up to date","w":["Pay for every employee to complete a university degree in finance","Use only training courses designed and delivered by the FCA itself","Re-test all staff every month and dismiss anyone who fails a test"],"e":"TC applies to retail activities such as giving mortgage, protection or investment advice."},{"id":"u1t8b-19","t":"u1t8b","q":"A new mortgage adviser who has not yet passed an appropriate qualification:","c":"Can advise only under supervision until qualified and assessed as competent","w":["Can advise unsupervised straight away if the firm is directly authorised","Must not speak to any customers until they have passed all exams","Can advise unsupervised as long as a manager reviews each case afterwards"],"e":"TC requires supervision until competence is assessed, and an appropriate qualification must be attained."},{"id":"u1t8b-20","t":"u1t8b","q":"Prudential regulation focuses on:","c":"Firms having enough capital and liquidity to stay solvent","w":["How products are designed, priced and marketed","How quickly and fairly complaints are handled","Whether advice given to customers is suitable"],"e":"Prudential rules protect against firm failure. Conduct rules govern how firms treat customers."},{"id":"u1t8b-21","t":"u1t8b","q":"Bank capital requirements derive largely from international standards set by the:","c":"Basel Committee on Banking Supervision","w":["World Trade Organization's financial services committee","European Central Bank's supervisory board","International Monetary Fund's executive board"],"e":"Basel III sets minimum capital and liquidity standards, applied in the UK by the PRA."},{"id":"u1t8b-22","t":"u1t8b","q":"Mortgage and insurance intermediaries must normally hold:","c":"Professional indemnity insurance","w":["A banking licence","A Part 4A permission to accept deposits","Reinsurance cover"],"e":"PI insurance protects the firm, and its customers, against claims arising from negligent advice."},{"id":"u1t8b-23","t":"u1t8b","q":"Under SM&CR, when hiring for certain roles firms must request regulatory references covering the previous:","c":"6 years","w":["3 years","1 year","10 years"],"e":"References must disclose relevant matters such as breaches of the Conduct Rules."},{"id":"u1t8b-24","t":"u1t8b","q":"The FCA requires financial promotions to be:","c":"Clear, fair and not misleading","w":["Approved by the FCA before publication","Written by a solicitor","Shown only on the firm's website"],"e":"Promotions must be approved by an authorised firm (section 21 FSMA), not the FCA itself."},{"id":"u1t8b-25","t":"u1t8b","q":"The High Level Standards block of the FCA Handbook includes:","c":"PRIN, SYSC, COCON and FIT","w":["MCOB, ICOBS and COBS","DISP and COMP","TC and SUP"],"e":"Business standards include MCOB, ICOBS and COBS. Redress includes DISP and COMP."},{"id":"u1t8b-26","t":"u1t8b","q":"COBS mainly applies to:","c":"Investment business, including advice on investments and pensions","w":["General insurance, including home, motor and travel cover","Mortgages, including equity release and home purchase plans","Consumer credit, including credit cards and personal loans"],"e":"COBS covers investment business, including suitability, disclosure and cancellation rights."},{"id":"u2t1-01","t":"u2t1","q":"Which of these is an example of ‘hard’ (factual, quantitative) information in a fact find?","c":"The client's monthly net income","w":["The client's attitude to investment risk","The client's wish to retire early","How the client feels about borrowing"],"e":"Hard facts are measurable: income, outgoings, assets, debts, ages. Soft facts are attitudes, goals and priorities."},{"id":"u2t1-02","t":"u2t1","q":"‘Soft’ facts gathered during a fact find are:","c":"Qualitative information such as goals, priorities, feelings and attitudes","w":["Figures such as income that can be checked against documents","Details of existing policies, pensions and investments only","Background information that isn't needed to give advice"],"e":"Soft facts are essential for understanding what the client actually wants and how they feel about risk."},{"id":"u2t1-03","t":"u2t1","q":"Which of these is an open question?","c":"‘What would you like your money to achieve over the next ten years?’","w":["‘Are you planning to retire before you reach 60?’","‘Do you have any existing pensions with previous employers?’","‘Is your total household income more than £50,000?’"],"e":"Open questions invite a full answer and often start with what, why, how or tell me about. Closed questions get a yes/no or a single fact."},{"id":"u2t1-04","t":"u2t1","q":"Closed questions are most useful for:","c":"Confirming specific facts","w":["Exploring the client's feelings","Building rapport at the start of a meeting","Finding out a client's long-term goals"],"e":"Use closed questions to confirm details such as dates of birth or the mortgage balance."},{"id":"u2t1-05","t":"u2t1","q":"Active listening includes:","c":"Summarising and reflecting back what the client has said","w":["Planning your next point while the client is speaking","Interrupting to keep the meeting short","Avoiding eye contact so the client isn't uncomfortable"],"e":"Active listening means giving full attention, using encouraging cues, clarifying, and summarising."},{"id":"u2t1-06","t":"u2t1","q":"Which is the correct order of the advice process?","c":"Gather information, analyse it, recommend, implement, review","w":["Recommend, gather information, implement, analyse","Implement, review, gather information, recommend","Analyse, recommend, gather information, review"],"e":"You need full information before analysis, and recommendations before implementation. Review keeps advice suitable over time."},{"id":"u2t1-07","t":"u2t1","q":"When prioritising a client's needs, which would usually come first?","c":"An emergency fund and essential protection","w":["Investing for long-term growth in equities","Inheritance tax planning for the next generation","Saving towards buying a holiday home"],"e":"Typically: manage problem debt, build an emergency fund and protect the family before saving and investing for the longer term."},{"id":"u2t1-08","t":"u2t1","q":"‘Capacity for loss’ refers to:","c":"The client's ability to absorb falls in value without a material effect on their standard of living","w":["How willing the client is to accept falls in value in return for potentially higher returns","The maximum loss a product provider will accept before it closes a fund to new investors","The amount of compensation the FSCS would pay if the client's investment firm failed"],"e":"Capacity for loss is about financial ability. Attitude to risk is about willingness. Both must be assessed."},{"id":"u2t1-09","t":"u2t1","q":"A client's attitude to risk is:","c":"Their willingness to accept the possibility of losing money in pursuit of higher returns","w":["Their financial ability to absorb losses without affecting their lifestyle","The risk rating of the investments they currently hold","Their credit score and history of repaying debts"],"e":"ATR is usually assessed with a questionnaire, followed by a discussion to check the result makes sense."},{"id":"u2t1-10","t":"u2t1","q":"An insistent client is one who:","c":"Wants to go ahead with a transaction against the adviser's recommendation","w":["Phones the firm repeatedly to chase the progress of an application","Insists on meeting face to face rather than by phone or video","Refuses to give any personal information during the fact find"],"e":"The adviser can still act, but must take care to protect both the client and the firm."},{"id":"u2t1-11","t":"u2t1","q":"When dealing with an insistent client, the adviser should:","c":"Make clear it's against their advice, explain the risks and keep clear records","w":["Change the recommendation so it matches what the client wants to do","Refuse to deal with the client again and close their file","Treat it as execution-only and keep no record of the advice given"],"e":"The advice given must not change. Records should show the client understood it was against advice, ideally with their reasons in their own words."},{"id":"u2t1-12","t":"u2t1","q":"An execution-only sale is one where:","c":"The firm carries out the client's instructions without giving any advice","w":["The adviser gives advice, but the client signs the forms later","The client's advice is checked by a supervisor before it's given","The product is only available to the firm's existing clients"],"e":"The client takes responsibility for suitability. For mortgages, execution-only is restricted after the MMR."},{"id":"u2t1-13","t":"u2t1","q":"A suitability report should:","c":"Explain why the recommendation suits the client's needs and circumstances, including any disadvantages","w":["List every product on the market so the client can compare them and choose for themselves","Be given only if the client asks for one, as a verbal explanation is usually enough","Set out only the product's key features and charges, leaving out personal circumstances"],"e":"Suitability reports must be personal to the client, including the risks and drawbacks."},{"id":"u2t1-14","t":"u2t1","q":"Which is an example of good non-verbal communication by an adviser?","c":"An open posture and appropriate eye contact","w":["Folded arms and checking a phone","Sitting behind a large desk taking notes without looking up","Speaking quickly to get through the paperwork"],"e":"Body language strongly affects how well a client opens up."},{"id":"u2t1-15","t":"u2t1","q":"The main purpose of building rapport at the start of a meeting is to:","c":"Put the client at ease, so they share full and accurate information","w":["Shorten the meeting so more clients can be seen","Make a sale more likely, whatever the client's needs","Avoid having to complete a full fact find"],"e":"Trust leads to better information, which leads to better advice."},{"id":"u2t1-16","t":"u2t1","q":"When explaining a product to a client with little financial knowledge, the adviser should:","c":"Use plain language, avoid jargon and check the client has understood","w":["Use technical terms to sound credible","Give them the policy terms and conditions to read alone","Keep the explanation to the minimum required by law"],"e":"Checking understanding (for example, asking the client to explain it back) supports the Consumer Duty understanding outcome."},{"id":"u2t1-17","t":"u2t1","q":"Which event should most obviously trigger a review of a client's protection arrangements?","c":"The birth of a child","w":["A small change in Bank Rate","A new mobile phone contract","Switching car insurer"],"e":"Life events such as children, marriage, divorce, moving home or a new job change protection needs."},{"id":"u2t1-18","t":"u2t1","q":"The main purpose of a fact find is to:","c":"Gather enough information about the client to give suitable advice","w":["Identify as many products as possible to sell the client","Meet the FSCS's requirements for compensation claims","Replace the need to give the client a suitability report"],"e":"Without full information, the adviser can't demonstrate that advice is suitable."},{"id":"u2t1-19","t":"u2t1","q":"Before recommending a new product, the adviser should first consider whether:","c":"The need could be met without a new product, such as by paying off debt","w":["The product pays the highest commission or procuration fee","The client has a high enough income to justify advice","The provider is the largest and best known on the market"],"e":"Good advice may mean no new product at all."},{"id":"u2t1-20","t":"u2t1","q":"‘You mentioned retiring early. What age did you have in mind?’ is an example of a:","c":"Probing (follow-up) question","w":["Leading (suggestive) question","Closed (yes or no) question","Rhetorical (no answer) question"],"e":"Probing questions dig deeper into something the client has already said."},{"id":"u2t1-21","t":"u2t1","q":"A leading question:","c":"Suggests the answer the questioner wants to hear","w":["Is the first question asked in a meeting","Is an open question that begins with ‘how’","Asks the client to confirm a single fact"],"e":"For example: ‘You'd want the best cover for your family, wouldn't you?’ Leading questions can push clients towards an answer and should be avoided in fact finding."},{"id":"u2t1-22","t":"u2t1","q":"When advising a couple, the adviser should:","c":"Gather views from both partners and identify any differences in their priorities","w":["Take instructions mainly from the higher earner, who carries more risk","Assume both partners share the same attitude to risk","Advise each partner separately without telling the other"],"e":"Differences should be explored, discussed and recorded."},{"id":"u2t1-23","t":"u2t1","q":"A suitable recommendation should take into account:","c":"Whether the client can afford it now, and what happens if their circumstances change","w":["Only the client's current income, as future changes can't be predicted","Only the cheapest premium available, whatever the level of cover","Only what the client's friends and family have bought before"],"e":"Affordability and sustainability are part of suitability."},{"id":"u2t1-24","t":"u2t1","q":"Summarising at the end of the information-gathering stage helps to:","c":"Confirm the adviser's understanding and correct any errors","w":["Close the sale before the client changes their mind","Avoid having to write a suitability report later","Reduce the client's cancellation rights afterwards"],"e":"A summary lets the client confirm or correct what has been recorded before analysis begins."},{"id":"u2t2a-01","t":"u2t2a","q":"Principle 7 requires firms to communicate with clients in a way that is:","c":"Clear, fair and not misleading","w":["Brief and technical","Approved by the FCA in advance","Only in writing"],"e":"Principle 7 covers communications with clients. Where the Consumer Duty applies, Principle 12 takes over this ground."},{"id":"u2t2a-02","t":"u2t2a","q":"Principle 8 deals with:","c":"Managing conflicts of interest fairly","w":["Holding adequate financial resources","Protecting clients' money and assets","Dealing openly with the regulators"],"e":"Firms must manage conflicts fairly, both between the firm and its customers and between different customers."},{"id":"u2t2a-03","t":"u2t2a","q":"Principle 9 (customers: relationships of trust) requires firms to:","c":"Take reasonable care to ensure their advice and discretionary decisions are suitable","w":["Offer every customer full advice, whether or not they ask for it","Guarantee that investments will meet the customer's objectives","Keep records of every customer conversation for at least 10 years"],"e":"Principle 9 underpins the suitability rules."},{"id":"u2t2a-04","t":"u2t2a","q":"Where the Consumer Duty applies, which Principles for Businesses no longer apply?","c":"Principles 6 and 7","w":["Principles 1 and 2","Principles 10 and 11","Principle 3 only"],"e":"Principle 12 replaces Principle 6 (customers' interests) and Principle 7 (communications) for retail business within scope of the Duty."},{"id":"u2t2a-05","t":"u2t2a","q":"Which of these is one of the four Consumer Duty outcomes?","c":"Price and value","w":["Sales and profit","Speed of advice","Brand and reputation"],"e":"The four outcomes: products and services; price and value; consumer understanding; consumer support."},{"id":"u2t2a-06","t":"u2t2a","q":"Which of these is one of the Consumer Duty's three cross-cutting rules?","c":"Avoid causing foreseeable harm to retail customers","w":["Maximise shareholder returns","Offer the cheapest product on the market","Give advice to every customer"],"e":"The cross-cutting rules: act in good faith; avoid causing foreseeable harm; and enable and support retail customers to pursue their financial objectives."},{"id":"u2t2a-07","t":"u2t2a","q":"Under the Consumer Duty, a firm's board must review and approve a report on whether the firm is delivering good outcomes for customers at least:","c":"Once a year","w":["Every five years","Every month","Only when asked by the FCA"],"e":"The annual board report must set out the results of monitoring and any action needed."},{"id":"u2t2a-08","t":"u2t2a","q":"The Consumer Duty's ‘consumer understanding’ outcome requires firms to:","c":"Communicate in a way customers can understand, and test that communications work","w":["Give every customer the full policy wording and ask them to sign that they have read it","Communicate only in writing, so there is always a record of what was said","Use the same standard template for every customer, so everyone is treated equally"],"e":"Firms are expected to test whether communications actually work."},{"id":"u2t2a-09","t":"u2t2a","q":"Which of these would most clearly breach the Consumer Duty rule to avoid causing foreseeable harm?","c":"Making it unreasonably difficult for customers to cancel or switch a product","w":["Explaining all charges clearly and in writing before the sale is made","Offering a cooling-off period that is longer than the legal minimum","Signposting customers in difficulty to free debt advice"],"e":"Sludge practices (unnecessary barriers) cause foreseeable harm and fail the consumer support outcome."},{"id":"u2t2a-10","t":"u2t2a","q":"Under the Consumer Duty's price and value outcome, firms must make sure that:","c":"The price customers pay is reasonable compared with the overall benefits they get","w":["Their prices are the lowest available anywhere in the market at all times","All customers pay exactly the same price for the same product","Prices are never increased for existing customers"],"e":"Fair value is not about being cheapest. It compares price with the benefits, quality and service."},{"id":"u2t2a-11","t":"u2t2a","q":"Under the Consumer Rights Act 2015, a term in a consumer contract is unfair if:","c":"Contrary to good faith, it causes a significant imbalance to the consumer's detriment","w":["It is written in small print, even if it is otherwise fair and transparent","The consumer did not read it before signing the contract","It gives the business any advantage at all over the consumer"],"e":"Terms must also be transparent and prominent."},{"id":"u2t2a-12","t":"u2t2a","q":"An unfair term in a consumer contract:","c":"Is not binding on the consumer, though the rest of the contract can continue","w":["Makes the whole contract illegal and void from the start","Is still binding on the consumer if they signed the contract","Must be enforced by the FCA until a court rules otherwise"],"e":"The consumer can still rely on the term if they choose to."},{"id":"u2t2a-13","t":"u2t2a","q":"Under the Consumer Rights Act 2015, a service supplied to a consumer must be performed:","c":"With reasonable care and skill","w":["To a guaranteed perfect standard","Within 24 hours","Free of charge if delayed"],"e":"Services must also be performed within a reasonable time and for a reasonable price, if these weren't agreed."},{"id":"u2t2a-14","t":"u2t2a","q":"Under UK MAR (the Market Abuse Regulation), which of these is market abuse?","c":"Spreading false or misleading information to move a share price","w":["Buying shares after reading a company's published results","Selling shares to pay for a house","Investing through a stocks and shares ISA"],"e":"Market abuse covers insider dealing, unlawful disclosure of inside information and market manipulation."},{"id":"u2t2a-15","t":"u2t2a","q":"Passing inside information to a friend, outside the normal course of your job, is:","c":"Unlawful disclosure of inside information","w":["Acceptable if the friend doesn't trade","Only a breach of company policy","Market making"],"e":"It is market abuse even if the friend doesn't deal. If they do deal, that's insider dealing too."},{"id":"u2t2a-16","t":"u2t2a","q":"Which factor does the FCA see as a key driver of a firm's culture?","c":"Leadership, the ‘tone from the top’","w":["The firm's office location","The size of the firm's marketing budget","The number of products it offers"],"e":"The FCA's key drivers of culture include purpose, leadership, the approach to rewarding and managing people, and governance."},{"id":"u2t2a-17","t":"u2t2a","q":"Which incentive scheme carries the greatest risk of poor customer outcomes?","c":"Bonuses based only on sales volumes","w":["A salary with a bonus linked to quality and customer outcomes","A balanced scorecard","A fixed salary"],"e":"Volume-only targets create pressure to mis-sell. Firms must manage these conflicts."},{"id":"u2t2a-18","t":"u2t2a","q":"Under Treating Customers Fairly, consumers should face no unreasonable post-sale barriers to:","c":"Changing product, switching provider, making a claim or complaining","w":["Buying more products from the same firm at a discount","Receiving marketing about new products and offers","Getting a refund of all premiums paid if they change their mind"],"e":"This is TCF outcome 6, and it lives on in the Consumer Duty's consumer support outcome."},{"id":"u2t2a-19","t":"u2t2a","q":"The Consumer Duty's consumer support outcome means that:","c":"Customers get support that meets their needs, and it is as easy to switch or cancel as it was to buy","w":["Firms must offer 24-hour phone support, seven days a week, for every product they sell","Firms must give face-to-face advice to every customer before they can buy any product","Customers must be offered a loyalty discount or free gift each time a product renews"],"e":"Support includes dealing with queries and complaints promptly and not creating unreasonable barriers."},{"id":"u2t2a-20","t":"u2t2a","q":"Conduct risk is:","c":"The risk that a firm's conduct causes poor customer outcomes","w":["The risk that a fall in share prices reduces a firm's profits","The risk that a fire or flood damages a firm's premises","The risk that the FCA changes its rules at short notice"],"e":"Managing conduct risk is central to good culture and to the Consumer Duty."},{"id":"u2t2a-21","t":"u2t2a","q":"Acting in good faith under the Consumer Duty is characterised by:","c":"Honesty, and fair and open dealing with retail customers","w":["Always agreeing with what the customer says","Offering every customer a discount","Never refusing a sale"],"e":"Good faith means not exploiting customers' behavioural biases, lack of knowledge or vulnerability."},{"id":"u2t2a-22","t":"u2t2a","q":"Responsibility for a firm's culture ultimately rests with:","c":"Senior management and the board","w":["The newest member of staff","The FCA","The firm's customers"],"e":"SM&CR makes senior individuals accountable, and the Consumer Duty requires board oversight."},{"id":"u2t2b-01","t":"u2t2b","q":"The three stages of money laundering are:","c":"Placement, layering and integration","w":["Collection, transfer and spending","Deposit, withdrawal and investment","Placement, concealment and extraction"],"e":"Placement gets the cash into the system, layering hides the trail, and integration makes it look legitimate."},{"id":"u2t2b-02","t":"u2t2b","q":"Moving funds through a series of complex transactions to disguise where they came from is:","c":"Layering","w":["Placement","Integration","Structuring"],"e":"Layering might involve transfers between accounts, jurisdictions and investments."},{"id":"u2t2b-03","t":"u2t2b","q":"Paying criminal cash into bank accounts in small amounts is an example of:","c":"Placement","w":["Layering","Integration","Tipping off"],"e":"Placement is the riskiest stage for the criminal and the easiest to detect."},{"id":"u2t2b-04","t":"u2t2b","q":"The main UK legislation creating money laundering offences is:","c":"The Proceeds of Crime Act 2002","w":["The Financial Services Act 1986","The Data Protection Act 2018","The Consumer Rights Act 2015"],"e":"POCA creates the principal offences, failure to disclose and tipping off. The Money Laundering Regulations 2017 set firms' systems requirements."},{"id":"u2t2b-05","t":"u2t2b","q":"Telling a customer that a suspicious activity report has been made about them is:","c":"Tipping off, which is a criminal offence","w":["Good customer service","Required under the Consumer Duty","A breach of data protection only"],"e":"Tipping off could prejudice an investigation. Staff must not alert the customer."},{"id":"u2t2b-06","t":"u2t2b","q":"In the regulated sector, the maximum penalty for tipping off is:","c":"2 years' imprisonment and/or a fine","w":["14 years' imprisonment and/or a fine","5 years' imprisonment and/or a fine","A fine only, with no prison sentence"],"e":"Maximum penalties: 14 years for the principal money laundering offences, 5 years for failure to disclose, 2 years for tipping off."},{"id":"u2t2b-07","t":"u2t2b","q":"The maximum penalty for the principal money laundering offences under POCA (concealing, arranging, acquiring) is:","c

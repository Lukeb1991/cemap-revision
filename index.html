":"14 years' imprisonment and/or an unlimited fine","w":["2 years' imprisonment and/or an unlimited fine","5 years' imprisonment and/or an unlimited fine","7 years' imprisonment and/or an unlimited fine"],"e":"These are the most serious offences."},{"id":"u2t2b-08","t":"u2t2b","q":"In the regulated sector, failing to report knowledge or suspicion of money laundering carries a maximum penalty of:","c":"5 years' imprisonment and/or a fine","w":["2 years' imprisonment and/or a fine","14 years' imprisonment and/or a fine","A written warning from the FCA only"],"e":"Staff must report knowledge, suspicion or reasonable grounds for suspicion to their nominated officer."},{"id":"u2t2b-09","t":"u2t2b","q":"An employee who suspects money laundering should report it to:","c":"The firm's nominated officer (MLRO)","w":["The customer","The FCA's consumer helpline","The Financial Ombudsman Service"],"e":"An internal report to the MLRO discharges the employee's duty. The MLRO decides whether to report externally."},{"id":"u2t2b-10","t":"u2t2b","q":"Suspicious activity reports (SARs) are submitted by the MLRO to:","c":"The National Crime Agency","w":["The Financial Conduct Authority","HM Revenue & Customs","The Bank of England"],"e":"The NCA's UK Financial Intelligence Unit receives SARs."},{"id":"u2t2b-11","t":"u2t2b","q":"After a firm requests a defence against money laundering (DAML), it may proceed if the NCA has not refused consent within:","c":"7 working days","w":["31 calendar days","14 working days","24 hours"],"e":"This is the notice period. If consent is refused, a 31-day moratorium follows, which the court can extend."},{"id":"u2t2b-12","t":"u2t2b","q":"If the NCA refuses consent following a DAML request, the moratorium period is:","c":"31 calendar days","w":["7 working days","60 calendar days","6 months"],"e":"A court can extend the moratorium. The firm can't proceed during it unless consent is given."},{"id":"u2t2b-13","t":"u2t2b","q":"Customer due diligence (CDD) requires firms to:","c":"Identify and verify the customer and understand the purpose of the relationship","w":["Check the customer's credit score and affordability, and nothing else","Collect the customer's tax returns and bank statements for the last 10 years","Get FCA approval before carrying out each transaction"],"e":"This includes verifying any beneficial owner. CDD should be risk-based, with ongoing monitoring throughout the relationship."},{"id":"u2t2b-14","t":"u2t2b","q":"Enhanced due diligence is required for:","c":"Politically exposed persons (PEPs) and other higher-risk situations","w":["All customers under 25 and first-time borrowers","Customers who pay their premiums by direct debit","Existing customers buying a second product from the firm"],"e":"EDD also applies to high-risk third countries and complex or unusually large transactions."},{"id":"u2t2b-15","t":"u2t2b","q":"The Money Laundering Regulations 2017 require CDD records to be kept for:","c":"5 years after the end of the business relationship","w":["1 year","3 years from the start of the relationship","Indefinitely"],"e":"Records must be available to support any investigation."},{"id":"u2t2b-16","t":"u2t2b","q":"How does terrorist financing differ from money laundering?","c":"Terrorist financing can involve money from entirely legitimate sources","w":["Terrorist financing is not a criminal offence","Terrorist financing only involves cash","Terrorist financing is reported to the FCA rather than the NCA"],"e":"Money laundering cleans dirty money. Terrorist financing may use clean money for criminal ends. It is covered by the Terrorism Act 2000."},{"id":"u2t2b-17","t":"u2t2b","q":"Which of these is one of the UK GDPR data protection principles?","c":"Data minimisation","w":["Data maximisation","Indefinite retention","Free sharing between firms"],"e":"The principles: lawfulness, fairness and transparency; purpose limitation; data minimisation; accuracy; storage limitation; integrity and confidentiality; and accountability."},{"id":"u2t2b-18","t":"u2t2b","q":"A firm must normally respond to a data subject access request within:","c":"One month (can be extended by two months if complex)","w":["40 calendar days (can be extended by 20 days if complex)","8 weeks (can be extended by 4 weeks if complex)","7 days (no extension allowed)"],"e":"Subject access is usually free of charge."},{"id":"u2t2b-19","t":"u2t2b","q":"A personal data breach that must be reported should be notified to the ICO within:","c":"72 hours of becoming aware","w":["24 hours of becoming aware","30 days of becoming aware","8 weeks of becoming aware"],"e":"Breaches must be reported where they are likely to risk people's rights and freedoms. High-risk breaches must also be told to the individuals affected."},{"id":"u2t2b-20","t":"u2t2b","q":"The maximum fine for the most serious UK GDPR breaches is:","c":"£17.5 million or 4% of annual worldwide turnover, whichever is higher","w":["£500,000, the same as under the old Data Protection Act","£1 million or 1% of annual worldwide turnover, whichever is higher","£17.5 million or 4% of annual profit, whichever is lower"],"e":"A lower tier of £8.7 million or 2% applies to other infringements."},{"id":"u2t2b-21","t":"u2t2b","q":"A firm must send a final response to most complaints within:","c":"8 weeks of receiving the complaint","w":["4 weeks of receiving the complaint","6 months of receiving the complaint","15 business days of receiving the complaint"],"e":"Payment services complaints have a shorter limit of 15 business days (35 in exceptional cases)."},{"id":"u2t2b-22","t":"u2t2b","q":"A complaint resolved to the customer's satisfaction by the close of the third business day after it was received can be closed with:","c":"A summary resolution communication","w":["A final response letter sent within 8 weeks","A referral to the FOS","No written communication at all"],"e":"The SRC tells the customer the complaint is resolved and that they can still refer it to the FOS."},{"id":"u2t2b-23","t":"u2t2b","q":"After receiving a final response, a complainant normally has how long to refer the complaint to the Financial Ombudsman Service?","c":"6 months","w":["8 weeks","3 years","6 years"],"e":"The final response must tell the customer about this 6-month time limit."},{"id":"u2t2b-24","t":"u2t2b","q":"For complaints referred to the FOS from 1 April 2026 about acts or omissions on or after 1 April 2019, the maximum award is:","c":"£455,000","w":["£445,000","£375,000","£205,000"],"e":"£205,000 applies to acts before 1 April 2019. Limits rise with inflation each April."},{"id":"u2t2b-25","t":"u2t2b","q":"A final decision by the Financial Ombudsman Service:","c":"Binds the firm if the complainant accepts it; the complainant can reject it","w":["Binds both the firm and the complainant in every case, with no right to go to court","Is advisory only, so the firm can choose whether to follow it","Only takes effect once it has been reviewed and approved by the FCA"],"e":"If accepted, the firm must comply. If rejected, the complainant keeps their right to take legal action."},{"id":"u2t2b-26","t":"u2t2b","q":"Which of these could be an eligible complainant at the Financial Ombudsman Service?","c":"A micro-enterprise","w":["A large company with 500 employees","An authorised firm complaining about its regulator","A multinational bank"],"e":"Eligible complainants include consumers, micro-enterprises, small businesses, smaller charities and trusts, and guarantors."},{"id":"u2t2b-27","t":"u2t2b","q":"The FOS can usually consider a complaint if it was made to the firm within:","c":"6 years of the event, or 3 years from when the complainant knew (or should have known) they had cause to complain, if later","w":["6 months of the event, or 3 months from when the complainant knew they had cause to complain, if later","1 year of the event, or 6 months from when the complainant knew they had cause to complain, if later","12 years of the event in all cases, regardless of when the complainant became aware"],"e":"These time limits sit alongside the 6-month limit after a final response."},{"id":"u2t2b-28","t":"u2t2b","q":"The Financial Services Compensation Scheme:","c":"Pays compensation when an authorised firm fails and can't pay claims","w":["Resolves disputes between customers and firms that are still trading","Fines firms that break the rules","Approves financial promotions"],"e":"The FSCS is the compensation scheme of last resort. The FOS resolves disputes with firms that are still trading."},{"id":"u2t2b-29","t":"u2t2b","q":"FSCS protection for claims about investments and mortgage advice against a firm that failed after 1 April 2019 is up to:","c":"£85,000 per person, per firm","w":["£120,000 per person, per firm","£50,000 per person, per firm","100% with no limit"],"e":"The deposit limit rose to £120,000 in December 2025, but the investment and home finance limits stay at £85,000."},{"id":"u2t2b-30","t":"u2t2b","q":"Claims for compulsory insurance (such as third-party motor) against a failed insurer are protected by the FSCS at:","c":"100%, with no upper limit","w":["90%, with no upper limit","100% of the first £85,000 only","100% of the first £120,000 only"],"e":"Compulsory insurance, long-term insurance (such as life cover) and professional indemnity claims are protected at 100%."},{"id":"u2t2b-31","t":"u2t2b","q":"Most non-compulsory general insurance claims, such as home contents, against a failed insurer are protected at:","c":"90%, with no upper limit","w":["100%, with no upper limit","90% of the first £85,000 only","50%, up to a maximum of £50,000"],"e":"Non-compulsory general insurance is protected at 90%."},{"id":"u2t2b-32","t":"u2t2b","q":"The FSCS is funded by:","c":"Levies on authorised firms","w":["General taxation","Customers' insurance premiums","Fines collected by the FCA"],"e":"Firms pay levies according to the type of business they carry on."},{"id":"u2t2b-33","t":"u2t2b","q":"A couple hold a joint savings account at one UK bank. FSCS protection is up to:","c":"£240,000 in total (£120,000 each)","w":["£120,000 in total (£60,000 each)","£170,000 in total (£85,000 each)","£1.4 million in total (no individual limit)"],"e":"Each eligible account holder gets the £120,000 limit, and joint accounts are split equally."},{"id":"u2t2b-34","t":"u2t2b","q":"Temporary high balances, such as house sale proceeds or an insurance payout, are protected by the FSCS up to:","c":"£1.4 million for six months","w":["£1 million for 12 months","£500,000 for three months","Unlimited for one year"],"e":"The six months run from when the money was first deposited."},{"id":"u2t2b-35","t":"u2t2b","q":"The complaint rules (DISP) require firms to:","c":"Analyse complaints data to identify and fix the root causes of recurring problems","w":["Send every complaint straight to the FOS for an independent decision","Charge customers a small fee to discourage unfounded complaints","Deal only with complaints made in writing and signed by the customer"],"e":"Root cause analysis helps prevent the same harm happening to other customers."},{"id":"u2t2b-36","t":"u2t2b","q":"Under DISP, a complaint can be made:","c":"Orally or in writing","w":["Only in writing","Only by email","Only through the FOS"],"e":"A complaint is any expression of dissatisfaction, oral or written, about the firm's service, alleging financial loss, distress or inconvenience."},{"id":"u2t2b-37","t":"u2t2b","q":"Under the Bribery Act 2010, a commercial organisation commits an offence if it:","c":"Fails to prevent bribery by associated persons, without adequate procedures","w":["Provides reasonable hospitality, such as a staff Christmas party","Offers all customers the same published loyalty discount","Pays its suppliers later than the agreed payment terms"],"e":"The Act also creates offences of offering, paying, requesting or receiving a bribe, and of bribing a foreign public official."},{"id":"u2t3-01","t":"u2t3","q":"Under the RDR rules, a firm can describe its advice as ‘independent’ only if it:","c":"Bases advice on a comprehensive and fair analysis of the market, unbiased and unrestricted","w":["Is not owned by a bank or product provider, whatever range of products it considers","Charges clients a fee rather than taking commission, whatever products it considers","Uses a panel of at least ten providers chosen for their service and financial strength"],"e":"Anything that doesn't meet the independence standard is restricted advice."},{"id":"u2t3-02","t":"u2t3","q":"Advice limited to the products of a single provider is:","c":"Restricted advice","w":["Independent advice","Execution-only","Guidance"],"e":"Restricted advice is allowed, but it must be clearly disclosed to the client before advice is given."},{"id":"u2t3-03","t":"u2t3","q":"Since 31 December 2012, firms giving personal recommendations on retail investments must be paid by:","c":"Adviser charges agreed with the client, not commission from product providers","w":["Commission from product providers, as long as it is disclosed to the client","A fixed fee set by the FCA for each type of advice","A share of the FSCS levy paid by product providers"],"e":"Adviser charging was introduced by the RDR. Charges can be facilitated from the product, but must be agreed with the client."},{"id":"u2t3-04","t":"u2t3","q":"An ongoing adviser charge can only be taken if:","c":"The client actually receives an ongoing service","w":["The client has more than £100,000 invested with the firm","The adviser is independent rather than restricted","The FCA approves the charge for each client"],"e":"Or where the charge relates to a regular-payment product. Clients must be able to cancel ongoing services, and firms must deliver what they charge for."},{"id":"u2t3-05","t":"u2t3","q":"Mortgage advisers can be paid by:","c":"Lender procuration fees, client fees or both, as long as they are disclosed","w":["Commission from lenders only, which need not be disclosed","A fixed fee set by the FCA for each mortgage arranged","A percentage of the property price, paid by the seller"],"e":"The RDR commission ban does not apply to mortgages, but remuneration must be disclosed."},{"id":"u2t3-06","t":"u2t3","q":"Under COBS, which category of client receives the highest level of regulatory protection?","c":"Retail client","w":["Professional client","Eligible counterparty","Elective professional client"],"e":"Client categories, from most to least protected: retail client, professional client, eligible counterparty."},{"id":"u2t3-07","t":"u2t3","q":"A fiduciary relationship means the adviser must:","c":"Act in good faith and in the client's best interests, avoiding conflicts","w":["Guarantee the client's investment returns and capital","Follow every client instruction without question or comment","Act in the product provider's interests as their agent"],"e":"Fiduciaries hold a position of trust."},{"id":"u2t3-08","t":"u2t3","q":"The COBS client's best interests rule requires firms to:","c":"Act honestly, fairly and professionally in the client's best interests","w":["Achieve the highest possible return for the client in every case","Recommend the cheapest product available every time","Act in the best interests of their shareholders and staff"],"e":"This rule sits alongside the Principles and the Consumer Duty."},{"id":"u2t3-09","t":"u2t3","q":"The cancellation period for a life assurance or pure protection policy is normally:","c":"30 calendar days","w":["14 calendar days","7 days","60 days"],"e":"Life, pure protection and personal or stakeholder pensions carry 30 days. Most other investments, including ISAs, carry 14 days."},{"id":"u2t3-10","t":"u2t3","q":"The cancellation period for a stocks and shares ISA is normally:","c":"14 calendar days","w":["30 calendar days","7 days","There is no cancellation right"],"e":"On cancelling an investment, the client may get back less than they paid in if markets have fallen (the shortfall)."},{"id":"u2t3-11","t":"u2t3","q":"The cancellation period for a personal pension is normally:","c":"30 calendar days","w":["14 calendar days","7 days","60 days"],"e":"Pensions have the longer 30-day period because of their long-term nature."},{"id":"u2t3-12","t":"u2t3","q":"The FCA's guidance on vulnerable customers identifies four key drivers of vulnerability:","c":"Health, life events, resilience and capability","w":["Age, gender, income and education","Health, wealth, location and employment","Debt, savings, pension and property"],"e":"Vulnerability can be temporary or permanent, and anyone can become vulnerable."},{"id":"u2t3-13","t":"u2t3","q":"According to the FCA, a vulnerable customer is someone who:","c":"Is especially susceptible to harm because of their personal circumstances","w":["Is over 70, as age alone means a customer must be treated as vulnerable","Has an income below the national average and can't afford advice","Has a registered disability, the only factor the FCA recognises"],"e":"Vulnerability is about circumstances, not categories such as age."},{"id":"u2t3-14","t":"u2t3","q":"When an adviser identifies a client as vulnerable, they should:","c":"Adapt their approach, such as allowing more time or, with consent, involving a trusted third party","w":["Refuse to deal with them until a family member can attend every meeting with them","Ask them to come back when they feel better, with no follow-up","Treat them exactly the same as any other client, making no changes at all"],"e":"The aim is fair outcomes for vulnerable customers that are as good as for other customers. Record what support is needed, with consent."},{"id":"u2t3-15","t":"u2t3","q":"If a client needs advice outside the adviser's permissions or expertise, the adviser should:","c":"Explain this and refer the client to a suitably qualified specialist","w":["Give the advice anyway so the client doesn't go elsewhere","Ignore that need and only advise on the areas they cover","Suggest the client researches the topic online themselves"],"e":"Advisers must know the limits of their authority and competence."},{"id":"u2t3-16","t":"u2t3","q":"Before recommending a product provider, advisers should carry out due diligence, such as:","c":"Reviewing the provider's financial strength, charges, service and products","w":["Checking only the provider's advertising and brand reputation","Choosing whichever provider pays the highest procuration fee","Relying on whichever providers other local advisers use"],"e":"Due diligence supports suitability and the Consumer Duty's products and services outcome."},{"id":"u2t3-17","t":"u2t3","q":"Before giving advice, a firm must disclose to a retail investment client:","c":"Whether its advice is independent or restricted, and the charges for its services","w":["The adviser's personal earnings from the firm in the last year","The firm's total profit and turnover for the last financial year","The annual fees the firm pays to the FCA and the FSCS"],"e":"Clients must understand the scope of the service and its cost before they commit."},{"id":"u2t3-18","t":"u2t3","q":"From 6 April 2026, the new ‘targeted support’ regime allows authorised firms to:","c":"Give suggestions designed for groups of consumers with similar characteristics","w":["Give full personal recommendations without advisers holding any qualifications","Sell investments to consumers without needing FCA authorisation","Charge product commission on investment advice, reversing the RDR ban"],"e":"Targeted support for pensions and investments sits between generic guidance and full regulated advice."},{"id":"u2t3-19","t":"u2t3","q":"Which of these is regulated advice, rather than guidance?","c":"Recommending a specific pension to a client based on their circumstances","w":["Explaining in general terms how pension tax relief works","Giving a factsheet listing types of pension","Directing someone to MoneyHelper"],"e":"A personal recommendation about a specific product, based on the person's circumstances, is advice."},{"id":"u2t3-20","t":"u2t3","q":"Why should advisers keep good records of advice?","c":"To show compliance and the basis of the recommendation if it is challenged later","w":["Because the FOS charges firms a lower case fee when files are complete","Records are only needed for execution-only sales, not advice","To share them with other firms for marketing purposes"],"e":"Records protect both the client and the firm, and are needed for complaints and FCA reviews."},{"id":"u2t3-21","t":"u2t3","q":"Where a conflict of interest cannot be prevented or managed effectively, the firm should:","c":"Disclose it clearly to the client before acting (as a last resort) or decline to act","w":["Ignore it, unless the client specifically asks whether there are any conflicts","Disclose it in writing after the sale has completed","Proceed, but reduce the adviser's fee to compensate the client"],"e":"SYSC 10: identify conflicts, then prevent or manage them. Disclosure is a last resort and not a substitute for managing them."},{"id":"u2t3-22","t":"u2t3","q":"A gift from a product provider to an adviser is most likely to be a problem if it:","c":"Could impair the adviser's duty to act in the client's best interests","w":["Is recorded in the firm's gifts and hospitality register","Is a small branded item such as a pen or notebook","Is politely declined and the decision recorded"],"e":"Firms keep gifts and hospitality registers and set limits on what can be accepted."},{"id":"u2t3-23","t":"u2t3","q":"Under MCOB, for an interactive mortgage sale (such as face to face or by phone), the firm must normally:","c":"Give advice, unless a specific execution-only exception applies","w":["Sell on an execution-only basis unless the customer asks for advice","Refer the customer to MoneyHelper for free guidance first","Offer only fixed-rate mortgages to limit the risk of rate rises"],"e":"Since the MMR, advice is required for interactive sales, with exceptions such as high net worth or professional customers."},{"id":"u2t3-24","t":"u2t3","q":"An adviser should monitor a client's circumstances because:","c":"Advice that was suitable may stop being suitable as circumstances change","w":["The FCA requires every client to complete a new fact find each month","Regular contact gives the adviser more chances to sell new products","Most products automatically lapse unless they are reviewed each year"],"e":"Where ongoing service is agreed and paid for, regular reviews must actually happen."},{"id":"u2t4-01","t":"u2t4","q":"An approach to ethics based on duties and rules, regardless of the consequences, is:","c":"Deontology","w":["Utilitarianism","Virtue ethics","Relativism"],"e":"Deontology (from the Greek for ‘duty’) says some actions are right or wrong in themselves."},{"id":"u2t4-02","t":"u2t4","q":"Which ethical theory judges actions by their outcomes, aiming for the greatest good for the greatest number?","c":"Utilitarianism","w":["Deontology","Virtue ethics","Egoism"],"e":"Utilitarianism is a form of consequentialism, associated with Jeremy Bentham and John Stuart Mill."},{"id":"u2t4-03","t":"u2t4","q":"Virtue ethics focuses on:","c":"The character of the person, and what a good person would do","w":["Following rules and duties, whatever the outcome","Maximising total happiness for the most people","Doing whatever brings the most benefit to yourself"],"e":"Virtue ethics is associated with Aristotle. Virtues include honesty, courage, fairness and integrity."},{"id":"u2t4-04","t":"u2t4","q":"The philosopher most associated with deontology and the ‘categorical imperative’ is:","c":"Immanuel Kant","w":["Jeremy Bentham","Aristotle","Adam Smith"],"e":"Kant argued we should act only on principles we could will to become universal laws, and treat people as ends, not merely as means."},{"id":"u2t4-05","t":"u2t4","q":"Which philosopher is most associated with virtue ethics?","c":"Aristotle","w":["Immanuel Kant","John Stuart Mill","Jeremy Bentham"],"e":"Aristotle saw ethics as developing good character through habit."},{"id":"u2t4-06","t":"u2t4","q":"Which best describes the difference between ethical and compliance-driven behaviour?","c":"Compliance follows the rules; ethics means doing right even where no rule applies","w":["They are exactly the same thing, as the rules define what is ethical","Ethical behaviour means ignoring rules you personally disagree with","Compliance is optional, while ethical behaviour is a legal requirement"],"e":"Rules can't cover everything. Ethics fills the gaps and follows the spirit of the rules."},{"id":"u2t4-07","t":"u2t4","q":"An adviser asks: ‘Would I be comfortable if this decision were reported on the front page of a newspaper?’ This is:","c":"A transparency (newspaper) test for an ethical dilemma","w":["A legal requirement under FSMA for all advisers","A test used to identify possible market abuse","Part of the fact find that every client completes"],"e":"Other quick tests include asking how you'd explain it to family, or whether you'd want it done to you."},{"id":"u2t4-08","t":"u2t4","q":"Workers who make protected disclosures (whistleblowing) are protected from detriment by the:","c":"Public Interest Disclosure Act 1998","w":["Consumer Rights Act 2015","Proceeds of Crime Act 2002","Financial Services and Markets Act 2000"],"e":"Protection applies where the worker reasonably believes the disclosure is in the public interest."},{"id":"u2t4-09","t":"u2t4","q":"Under FCA whistleblowing rules, banks and insurers must appoint a:","c":"Whistleblowers' champion, who is a senior manager or non-executive director","w":["Whistleblowing ombudsman, who must be independent of the firm","Compliance consultant from outside the firm to receive reports","Customer panel to review all concerns raised by staff"],"e":"Other firms are encouraged to follow the rules as good practice."},{"id":"u2t4-10","t":"u2t4","q":"Settlement agreements and employment contracts must not:","c":"Prevent workers from making protected disclosures to the regulator","w":["Contain any confidentiality terms of any kind about the employment","Mention whistleblowing or the firm's policy on it","Be signed by anyone below senior manager level"],"e":"Gagging clauses that stop whistleblowing to the FCA or PRA are unenforceable and against FCA rules."},{"id":"u2t4-11","t":"u2t4","q":"Retail investment advisers must complete a minimum of how many hours of CPD each year?","c":"35 hours, of which 21 must be structured","w":["20 hours, of which 10 must be structured","35 hours, all structured","15 hours, of which 5 must be structured"],"e":"CPD keeps knowledge up to date and is confirmed each year through the Statement of Professional Standing."},{"id":"u2t4-12","t":"u2t4","q":"A Statement of Professional Standing (SPS) for a retail investment adviser:","c":"Is issued annually by an accredited body, confirming qualifications, CPD and adherence to a code of ethics","w":["Is issued once by the FCA when the adviser first qualifies, and lasts for their whole career","Is a type of professional indemnity insurance that each adviser must hold personally","Is issued annually by the firm's compliance officer to confirm the adviser met their sales targets"],"e":"Accredited bodies include LIBF and CII."},{"id":"u2t4-13","t":"u2t4","q":"A professional code of ethics is intended to:","c":"Set standards beyond the legal minimum, guiding decisions where rules are silent","w":["Replace FCA rules for members of the professional body","Protect the firm from complaints by setting out what clients can expect","Allow advisers to turn away clients whose needs are complicated"],"e":"Codes usually cover integrity, objectivity, competence, fairness, confidentiality and professionalism."},{"id":"u2t4-14","t":"u2t4","q":"An adviser is offered a luxury holiday by a provider whose products they often recommend. The most ethical response is to:","c":"Decline it, or declare it under the firm's gifts and hospitality policy","w":["Accept it, provided they don't mention it to clients or colleagues","Accept it and recommend the provider more often to show goodwill","Accept it, as long as their manager is also invited on the trip"],"e":"Significant gifts create conflicts of interest and may breach inducement rules."},{"id":"u2t4-15","t":"u2t4","q":"A manager pressures you to recommend a product that pays the firm more but is less suitable for the client. The ethical course is to:","c":"Recommend what is suitable and raise concerns internally, escalating if needed","w":["Follow the manager's instruction","Recommend both products and let the client choose without explanation","Resign immediately without saying anything"],"e":"Your duty to the client and the Conduct Rules come first. Escalate through compliance or whistleblowing routes if needed."},{"id":"u2t4-16","t":"u2t4","q":"Integrity in professional behaviour means:","c":"Being honest and consistent, and acting on strong moral principles even when no one is watching","w":["Always agreeing with your manager and following instructions without question","Meeting your sales targets while staying within the letter of the rules","Keeping your opinions to yourself to avoid conflict with colleagues"],"e":"Acting with integrity is Conduct Rule 1 and Principle 1."},{"id":"u2t4-17","t":"u2t4","q":"Objectivity means:","c":"Not letting bias or conflicts of interest override your judgement","w":["Avoiding all contact with product providers and their representatives","Always recommending the cheapest option available in the market","Following the client's wishes without question, whatever the risks"],"e":"Objectivity is a core principle in most professional codes of conduct."},{"id":"u2t4-18","t":"u2t4","q":"An adviser may disclose confidential client information without the client's consent when:","c":"Required by law, for example when making a suspicious activity report","w":["A friend of the client asks for it","A marketing company asks for it","The adviser wants a second opinion from a colleague at another firm"],"e":"Confidentiality is a professional duty, but legal obligations such as money laundering reporting override it."},{"id":"u2t4-19","t":"u2t4","q":"Which of these is a common feature of an ethical business?","c":"Openness and transparency with customers and regulators","w":["Maximising short-term profit for shareholders at any cost","Hiding mistakes to protect its reputation","Rewarding staff only on sales volume"],"e":"Ethical businesses also share a clear purpose, fair treatment of customers and staff, and accountability."},{"id":"u2t4-20","t":"u2t4","q":"Ethical relativism holds that:","c":"Right and wrong depend on culture or circumstances, rather than on universal rules","w":["Some actions are always wrong, whatever the culture or circumstances","Ethics is the same as the law, so legal actions are always ethical","Only the outcomes of an action matter, not the action itself"],"e":"The opposite view, ethical absolutism, holds that some moral rules apply universally."},{"id":"u2t4-21","t":"u2t4","q":"Professionalism in financial services is maintained through:","c":"Training, assessment of competence, and continuing professional development","w":["Passing one exam at the start and never studying again","Length of service in the industry, without further training","Strong sales performance and positive customer reviews"],"e":"T&C and CPD keep advisers' knowledge and skills current."},{"id":"u2t4-22","t":"u2t4","q":"Strong business ethics is most likely to lead to:","c":"Better customer outcomes, greater trust and long-term sustainability","w":["Lower standards of service and higher staff turnover","More complaints and higher redress costs","Higher regulatory fines and closer supervision"],"e":"Ethical culture reduces conduct risk and builds trust in the industry."},{"id":"u2t4-23","t":"u2t4","q":"Can a worker make a protected whistleblowing disclosure directly to the FCA?","c":"Yes, the FCA is a ‘prescribed person’, so disclosures to it can be protected","w":["No, disclosures must always be raised internally with the firm first","Only with the firm's written permission to contact the regulator","Only once the worker has left the firm and signed a settlement"],"e":"Workers can report internally or to prescribed bodies such as the FCA or PRA."},{"id":"u2t4-24","t":"u2t4","q":"Ethical egoism is the view that:","c":"People should act in their own self-interest","w":["People should always put others first","Duties matter more than outcomes","Character is all that matters"],"e":"Egoism is generally seen as incompatible with the duties of a professional adviser."}],"cases":[{"id":"c1-ahmed","unit":1,"title":"The Ahmed family","text":"Bilal (36) and Sana (34) Ahmed are married with two children aged 4 and 1. Bilal is an engineer earning £58,000 a year and has no other income. Sana works part-time, earning £14,000. They have a £240,000 capital repayment mortgage with 25 years left, and own their home as joint tenants. They have £8,000 in an instant-access savings account. They have no life cover, Bilal's employer pays three months' full sick pay, and neither of them has made a will.","qs":[{"id":"c1-ahmed-1","t":"u1t4a","q":"Which policy would be most suitable to make sure the mortgage is repaid if either of them dies?","c":"Joint life, first death, decreasing term assurance over 25 years","w":["Joint life, second death, whole of life assurance","Level term assurance for £100,000 over 5 years","Income protection on Bilal only"],"e":"A repayment mortgage reduces over time, so decreasing term fits. First death pays out when the first of them dies, which is when the money is needed."},{"id":"c1-ahmed-2","t":"u1t5","q":"If Bilal died, what would happen to his share of the family home?","c":"It would pass automatically to Sana as the surviving joint tenant","w":["It would pass under the intestacy rules, as he has no will","It would be split between Sana and the children equally","It would pass to the Crown, as there is no will"],"e":"Joint tenancy carries the right of survivorship, which applies with or without a will."},{"id":"c1-ahmed-3","t":"u1t4a","q":"Which cover would best protect the family if Bilal could not work for a long period because of illness?","c":"Income protection, with a deferred period of 13 weeks to match his employer's sick pay","w":["Decreasing term assurance over 25 years, matching the mortgage term","Whole of life assurance written in trust for the children","Private medical insurance to speed up any hospital treatment"],"e":"Income protection replaces lost earnings. A 13-week deferred period starts benefit when his three months of sick pay ends, which keeps the premium down."},{"id":"c1-ahmed-4","t":"u1t3","q":"The couple claim Child Benefit for both children. Will the High Income Child Benefit Charge apply?","c":"No, as Bilal's income is below £60,000","w":["Yes, 50% of the benefit will be clawed back","Yes, 100% of the benefit will be clawed back","Yes, Sana must pay the charge as the claimant"],"e":"The HICBC is based on the higher earner's adjusted net income and only starts above £60,000."},{"id":"c1-ahmed-5","t":"u1t2b","q":"What is Bilal's income tax liability for 2026/27?","c":"£10,632","w":["£9,086","£11,600","£10,086"],"e":"Taxable: £58,000 − £12,570 = £45,430. Basic rate: £37,700 × 20% = £7,540. Higher rate: £7,730 × 40% = £3,092. Total £10,632."}]},{"id":"c1-margaret","unit":1,"title":"Margaret's estate","text":"Margaret is a widow aged 79. Her husband Ken died in 2019 and left his entire estate to her. Margaret owns her home outright, worth £450,000, and has savings and investments of £150,000. She has two adult children and four grandchildren. Last tax year she gave her daughter £3,000, the only gift she has made. Her will leaves everything equally to her two children.","qs":[{"id":"c1-margaret-1","t":"u1t2b","q":"What is the total nil-rate band available to Margaret's estate?","c":"£650,000","w":["£325,000","£500,000","£175,000"],"e":"Ken left everything to Margaret, which was spouse-exempt, so none of his NRB was used. It transfers to her estate."},{"id":"c1-margaret-2","t":"u1t2b","q":"What residence nil-rate band could Margaret's estate claim?","c":"£350,000 (her own and Ken's)","w":["Nothing, because Ken died before 2020","£175,000 (her own only)","£450,000 (the full value of the home)"],"e":"The home goes to direct descendants and the estate is well under £2 million. The unused RNRB of a spouse who died earlier can be transferred, whenever they died."},{"id":"c1-margaret-3","t":"u1t2b","q":"If Margaret died today, how much inheritance tax would be payable on her £600,000 estate?","c":"£0","w":["£110,000","£40,000","£240,000"],"e":"Available bands: £650,000 NRB + £350,000 RNRB = £1,000,000, which is more than £600,000."},{"id":"c1-margaret-4","t":"u1t2b","q":"For IHT, how is the £3,000 gift to her daughter treated?","c":"It is exempt under the annual exemption","w":["It is a potentially exempt transfer that becomes exempt after 7 years","It is chargeable at 20%","It is covered by the small gifts exemption"],"e":"Each person can give £3,000 a year free of IHT. The small gifts exemption is only £250 per person."},{"id":"c1-margaret-5","t":"u1t6","q":"Margaret makes a new will, and her daughter's husband is one of the two witnesses. What is the effect?","c":"The gift to her daughter fails, but the rest of the will is valid","w":["The whole will is invalid","There is no effect, as the husband is not a beneficiary himself","The daughter's share passes to her husband"],"e":"A gift to a witness or to a witness's spouse fails. Beneficiaries and their spouses should never witness a will."}]},{"id":"c1-daniel","unit":1,"title":"Daniel's tax position","text":"Daniel is 45 and employed on a salary of £42,000. In 2026/27 he also receives £1,600 of interest from a savings account and £3,000 of dividends from shares held outside an ISA. He has no other income and makes no pension contributions. During the year he sells some of those shares, making a gain of £9,000. He has no capital losses.","qs":[{"id":"c1-daniel-1","t":"u1t2b","q":"What is Daniel's personal savings allowance for 2026/27?","c":"£1,000, as he is a basic-rate taxpayer","w":["£500, as his total income is over £40,000","£0, as his salary uses up his starting rate band","£5,000"],"e":"His total income is £46,600 and his taxable income £34,030, which is within the £37,700 basic rate band. So he gets the £1,000 basic-rate PSA."},{"id":"c1-daniel-2","t":"u1t2b","q":"How much tax does Daniel pay on his savings interest?","c":"£120","w":["£320","£0","£240"],"e":"His salary uses up the starting rate band. £1,600 − £1,000 PSA = £600 at 20% = £120."},{"id":"c1-daniel-3","t":"u1t2b","q":"How much tax does Daniel pay on his dividends?","c":"£268.75","w":["£218.75","£322.50","£893.75"],"e":"£3,000 − £500 dividend allowance = £2,500, all within the basic rate band, at 10.75% = £268.75."},{"id":"c1-daniel-4","t":"u1t2b","q":"What is Daniel's capital gains tax bill on the £9,000 gain?","c":"£1,219.80","w":["£1,080.00","£1,440.00","£1,620.00"],"e":"Taxable gain: £9,000 − £3,000 = £6,000. Unused basic rate band: £37,700 − £34,030 = £3,670 at 18% = £660.60. The remaining £2,330 is at 24% = £559.20. Total £1,219.80."},{"id":"c1-daniel-5","t":"u1t4b","q":"If Daniel had held the shares in a stocks and shares ISA instead, then:","c":"Both the dividends and the gain would have been tax-free","w":["Only the dividends would have been tax-free","Only the gain would have been tax-free","There would be no difference"],"e":"Income and gains inside an ISA are free of income tax and CGT."}]},{"id":"c1-northgate","unit":1,"title":"Northgate Mortgage Solutions","text":"Northgate Mortgage Solutions is a small, directly authorised mortgage and protection broker with eight advisers. Its managing director, Fiona, runs the business as chief executive and is also responsible for compliance oversight. Jake has just joined Northgate as a trainee adviser and has not yet passed his CeMAP exams. Northgate holds its own professional indemnity insurance.","qs":[{"id":"c1-northgate-1","t":"u1t8a","q":"Which body regulates Northgate?","c":"The FCA only, as Northgate is a solo-regulated firm","w":["The PRA only, as it regulates all mortgage business","Both the PRA and the FCA, as it arranges mortgages","The Financial Policy Committee of the Bank of England"],"e":"Brokers are not dual-regulated. The FCA handles both their conduct and prudential regulation."},{"id":"c1-northgate-2","t":"u1t8b","q":"Under SM&CR, what does Fiona need for her roles?","c":"FCA approval for each Senior Manager Function she performs","w":["Nothing, because she owns the firm","Annual certification by Northgate only","Approval from the Financial Ombudsman Service"],"e":"Senior managers (for example chief executive and compliance oversight) need prior FCA approval and a statement of responsibilities. Certified staff are assessed by the firm."},{"id":"c1-northgate-3","t":"u1t8b","q":"What does the Training and Competence sourcebook allow Jake to do?","c":"Advise only under supervision until he is qualified and assessed as competent","w":["Advise unsupervised immediately, as Northgate is directly authorised","Give no advice of any kind until he has 12 months' experience","Advise unsupervised on protection, but not on mortgages"],"e":"TC requires supervision until competence is assessed, and competence can't be confirmed until an appropriate qualification is attained."},{"id":"c1-northgate-4","t":"u1t8b","q":"Which rules will Jake have to follow from his first day?","c":"The individual Conduct Rules","w":["The senior manager conduct rules only","No rules until he is qualified","Only Northgate's internal sales targets"],"e":"The individual Conduct Rules apply to almost all staff of regulated firms, whatever their seniority."},{"id":"c1-northgate-5","t":"u1t8b","q":"Northgate's capital falls below its requirement and its PI insurance lapses. Which threshold condition is most directly at risk?","c":"Appropriate resources","w":["Location of offices","Legal status","Effective supervision"],"e":"Appropriate resources covers financial and non-financial resources, including capital and PI cover."}]},{"id":"c1-pauline","unit":1,"title":"Pauline's retirement plans","text":"Pauline is 58 and a higher-rate taxpayer earning £62,000. She has a defined contribution personal pension worth £240,000 and wants to reduce her hours at 60 and draw some of it. She also has a deferred defined benefit pension from a previous employer, based on 15 years' service in a 1/80th scheme with final pensionable salary (revalued) of £36,000. She has never accessed any pension.","qs":[{"id":"c1-pauline-1","t":"u1t4c","q":"Can Pauline access her personal pension now if she wishes?","c":"Yes, as she is over the normal minimum pension age of 55","w":["No, she must wait until her State Pension age of 67","No, she must wait until 60, when she reduces her hours","Only if she stops working completely and retires"],"e":"The NMPA is 55 until April 2028, when it rises to 57. Pauline is already 58, so the rise doesn't affect her."},{"id":"c1-pauline-2","t":"u1t4c","q":"What is the maximum tax-free cash she could take from her personal pension?","c":"£60,000","w":["£268,275","£80,000","£24,000"],"e":"25% of £240,000 = £60,000, which is well within the £268,275 lump sum allowance."},{"id":"c1-pauline-3","t":"u1t4c","q":"If Pauline takes taxable income through flexi-access drawdown, what is the effect on future contributions?","c":"The MPAA applies, limiting future DC contributions to £10,000 a year","w":["She can no longer make any pension contributions at all","Her annual allowance rises, as she can now use carry forward","There is no effect until she takes her tax-free cash"],"e":"Taking taxable flexible income triggers the MPAA. Taking only tax-free cash would not."},{"id":"c1-pauline-4","t":"u1t4c","q":"What annual pension will her defined benefit scheme provide, before any revaluation to retirement?","c":"£6,750","w":["£9,000","£5,400","£4,500"],"e":"15 ÷ 80 × £36,000 = £6,750. On a 1/60th basis it would be £9,000."},{"id":"c1-pauline-5","t":"u1t4c","q":"Where can Pauline get free, impartial guidance on her defined contribution options?","c":"Pension Wise, through MoneyHelper","w":["The Financial Ombudsman Service","The Pension Protection Fund","The Pensions Regulator"],"e":"Pension Wise offers free guidance to people aged 50 and over with DC pensions. It is guidance, not regulated advice."}]},{"id":"c1-okafor","unit":1,"title":"The Okafors' bakery","text":"Chidi and Grace Okafor run a bakery together as an ordinary partnership. They own their home as tenants in common, in shares of 60% (Chidi) and 40% (Grace). Chidi's mother, Ada, is 82. She has recently been diagnosed with early-stage dementia, but still has capacity, and she wants Chidi to be able to manage her finances in future.","qs":[{"id":"c1-okafor-1","t":"u1t5","q":"If the bakery runs up debts it cannot pay, Chidi and Grace are:","c":"Jointly and severally liable, so their personal assets are at risk","w":["Liable only up to the capital they invested","Not personally liable","Liable only for debts each of them personally agreed to"],"e":"Ordinary partners have unlimited, joint and several liability under the Partnership Act 1890."},{"id":"c1-okafor-2","t":"u1t5","q":"If Grace died, what would happen to her 40% share of the home?","c":"It would pass under her will, or under the intestacy rules if she has no will","w":["It would pass automatically to Chidi as the surviving co-owner","It would be split equally between Chidi and their children by law","It would pass to the mortgage lender until the loan is repaid"],"e":"Tenants in common have no right of survivorship. Each share passes with the owner's estate."},{"id":"c1-okafor-3","t":"u1t5","q":"What should Ada do now so that Chidi can manage her finances later?","c":"Make a Lasting Power of Attorney for property and financial affairs while she still has capacity","w":["Nothing, as Chidi can act automatically as her son","Make an ordinary power of attorney, which will continue if she loses capacity","Wait until she loses capacity and then make an LPA"],"e":"An LPA can only be made while the donor has capacity. An ordinary POA ends when capacity is lost."},{"id":"c1-okafor-4","t":"u1t5","q":"When can Chidi start to use the property and financial affairs LPA?","c":"Once it is registered, even while Ada has capacity if she agrees","w":["Only after Ada has died and the estate is being administered","Only once the Court of Protection has appointed him as deputy","As soon as Ada signs it, without needing to register it"],"e":"The LPA must be registered with the Office of the Public Guardian. A property and financial affairs LPA can be used while the donor has capacity, with their consent. A health and welfare LPA can't."},{"id":"c1-okafor-5","t":"u1t5","q":"If Chidi and Grace converted the bakery into a limited company, how would their position change?","c":"The company would be a separate legal person, and their liability limited","w":["Nothing would change, as they would still own the business","They would become jointly and severally liable for company debts","The company could not own property in its own name"],"e":"Incorporation separates the business from its owners. Lenders may still ask for personal guarantees."}]},{"id":"c2-harrison","unit":2,"title":"Meeting the Harrisons","text":"Tom (41) and Lucy (39) Harrison meet Priya, a mortgage and protection adviser, to review their finances. They have two children, a £180,000 repayment mortgage and no life cover. Tom earns £48,000 and Lucy £26,000. They have £2,000 in savings and £6,000 of credit card debt. Lucy says she ‘definitely doesn't want anything risky’. Tom says he's keen to ‘make our money work harder’ in shares.","qs":[{"id":"c2-harrison-1","t":"u2t1","q":"Tom and Lucy have different attitudes to risk. How should Priya handle this?","c":"Explore each partner's views and agree a joint approach, recording differences","w":["Go with Tom's view, as he is the higher earner and wants growth","Ignore the difference and choose a medium-risk approach for both","Refuse to advise until they have agreed a single attitude to risk"],"e":"Joint clients can have different attitudes. The adviser must understand both and document how the recommendation reflects them."},{"id":"c2-harrison-2","t":"u2t1","q":"What should Priya usually treat as the priority?","c":"Protection, an emergency fund and clearing the card debt before investing","w":["Investing in shares straight away, as Tom suggests, to grow their savings","Overpaying the mortgage with all their savings to cut interest costs","Setting up an inheritance tax plan for the benefit of the children"],"e":"With dependent children, no life cover, little savings and expensive debt, the foundations come before investing."},{"id":"c2-harrison-3","t":"u2t1","q":"Priya asks: ‘How would you feel if an investment fell by 20% in a year?’ This is:","c":"An open question to explore attitude to risk","w":["A closed question to confirm a fact","A leading question","A question about capacity for loss"],"e":"It invites the client to describe their feelings, which is an open question about willingness to take risk."},{"id":"c2-harrison-4","t":"u2t1","q":"Lucy's statement that she ‘definitely doesn't want anything risky’ is an example of:","c":"Soft (qualitative) information","w":["Hard (quantitative) information","A capacity for loss calculation","An execution-only instruction"],"e":"Attitudes, feelings and priorities are soft facts. They are just as important as the numbers."},{"id":"c2-harrison-5","t":"u2t3","q":"Despite Priya's advice, Tom wants to put £5,000 into a single technology share through Priya's firm. How should she handle this?","c":"Treat him as an insistent client, making clear it's against her advice and keeping records","w":["Change her recommendation so it matches what Tom wants to do instead","Process the purchase as he asks, without recording their conversation","Report Tom to the FCA for acting against her professional advice"],"e":"The advice stays the same. The records must show Tom understood he was acting against it."}]},{"id":"c2-patel","unit":2,"title":"Mr Patel's complaint","text":"Mr Patel phones his adviser's firm on Monday 2 March 2026. He says that when he remortgaged last year, his adviser sold him an expensive critical illness policy he didn't need. The firm acknowledges the complaint promptly and begins investigating.","qs":[{"id":"c2-patel-1","t":"u2t2b","q":"Can Mr Patel's phone call be treated as a complaint?","c":"Yes, complaints can be made orally or in writing","w":["No, complaints must be made in writing","Only if he follows up by email","Only if he goes to the FOS first"],"e":"Under DISP, any expression of dissatisfaction, oral or written, alleging loss, distress or inconvenience is a complaint."},{"id":"c2-patel-2","t":"u2t2b","q":"By when must the firm send a final response (or explain why it can't yet)?","c":"27 April 2026","w":["30 March 2026","2 May 2026","2 September 2026"],"e":"Eight weeks (56 days) from 2 March 2026 is 27 April 2026."},{"id":"c2-patel-3","t":"u2t2b","q":"If Mr Patel is unhappy with the final response, how long does he normally have to refer the complaint to the FOS?","c":"6 months","w":["8 weeks","3 years","14 days"],"e":"The final response must explain the 6-month time limit."},{"id":"c2-patel-4","t":"u2t2b","q":"What is the maximum award the FOS could make on this complaint?","c":"£455,000","w":["£205,000","£85,000","£120,000"],"e":"The sale happened after 1 April 2019. Assuming he refers the complaint to the FOS on or after 1 April 2026, the limit is £455,000."},{"id":"c2-patel-5","t":"u2t2b","q":"If the firm went out of business before paying any compensation owed, where could Mr Patel turn?","c":"The Financial Services Compensation Scheme","w":["The Financial Policy Committee","The Pensions Regulator","The Competition and Markets Authority"],"e":"The FSCS is the compensation scheme of last resort when an authorised firm can't pay."}]},{"id":"c2-lowe","unit":2,"title":"Mr Lowe's overpayment","text":"Kevin is a mortgage adviser arranging a remortgage for Mr Lowe. Mr Lowe also wants to make a £60,000 lump-sum overpayment. When Kevin asks where the money came from, Mr Lowe is vague and says it's from ‘a cash business’. He then asks whether he can pay it in several smaller amounts from different accounts.","qs":[{"id":"c2-lowe-1","t":"u2t2b","q":"What should Kevin do first?","c":"Report his suspicion promptly to his firm's MLRO (nominated officer)","w":["Ask Mr Lowe directly whether the money comes from crime","Ignore it, as overpayments reduce the lender's risk","Report it to the Financial Ombudsman Service"],"e":"An internal report to the nominated officer fulfils Kevin's legal duty."},{"id":"c2-lowe-2","t":"u2t2b","q":"If Kevin told Mr Lowe that he had reported his concerns, Kevin would commit the offence of:","c":"Tipping off","w":["Market abuse","Insider dealing","Breach of the Consumer Duty"],"e":"Tipping off carries up to 2 years' imprisonment in the regulated sector."},{"id":"c2-lowe-3","t":"u2t2b","q":"Using criminal money to pay down a mortgage, so it appears as legitimate equity in a home, is which stage of money laundering?","c":"Integration","w":["Placement","Layering","Structuring"],"e":"Integration is the final stage, where laundered funds appear legitimate. Paying in smaller amounts from different accounts would be part of placement and layering."},{"id":"c2-lowe-4","t":"u2t2b","q":"If the MLRO decides there are grounds for suspicion, who receives the suspicious activity report?","c":"The National Crime Agency","w":["The Financial Conduct Authority","HM Revenue & Customs","The Land Registry fraud team"],"e":"SARs go to the NCA's UK Financial Intelligence Unit."},{"id":"c2-lowe-5","t":"u2t2b","q":"If the firm wants to go ahead with the transaction, what must it do?","c":"Request a DAML from the NCA and wait for consent or the notice period to end","w":["Go ahead straight away, as long as a SAR has already been filed","Ask Mr Lowe to sign a declaration confirming the money is clean","Ask the FCA to approve the transaction before it goes ahead"],"e":"A defence against money laundering (DAML) must be requested. The notice period is 7 working days. Proceeding without one could itself be a money laundering offence."}]},{"id":"c2-evans","unit":2,"title":"Mrs Evans, recently bereaved","text":"Mrs Evans, 74, contacts the firm three weeks after her husband died. A life policy has just paid her £90,000 and she wants to ‘put it somewhere safe’. She seems confused about some details and mentions that her son usually helps with paperwork. She has no other savings with the same bank.","qs":[{"id":"c2-evans-1","t":"u2t3","q":"Which of the FCA's drivers of vulnerability most obviously applies to Mrs Evans?","c":"Life events","w":["Resilience only","Capability only","None, as she has money to invest"],"e":"Bereavement is a life event. Her confusion may also suggest reduced capability for now."},{"id":"c2-evans-2","t":"u2t3","q":"What is the most appropriate way to adapt the service for her?","c":"Allow extra time, keep things simple and, with her consent, involve her son","w":["Complete everything in one meeting so she doesn't have to come back","Decline to deal with her until she feels better, with no follow-up","Deal only with her son from now on, without involving her"],"e":"Vulnerable customers should get outcomes as good as other customers. Adapt the process and involve trusted third parties only with consent."},{"id":"c2-evans-3","t":"u2t2b","q":"If Mrs Evans deposits the £90,000 with a single UK bank, how much of it is protected by the FSCS?","c":"All of it, as it is below the £120,000 limit","w":["Only £85,000","Only £60,000","None of it, because it came from a life policy"],"e":"The deposit limit is £120,000 per person per institution. Insurance payouts can also count as a temporary high balance (up to £1.4 million for 6 months)."},{"id":"c2-evans-4","t":"u2t2a","q":"Sending Mrs Evans a dense 20-page brochure with no explanation would most likely fail which Consumer Duty outcome?","c":"Consumer understanding","w":["Price and value","Products and services","None, as long as the brochure is accurate"],"e":"Firms must communicate in a way customers can understand, tailored to their needs."},{"id":"c2-evans-5","t":"u2t3","q":"If Mrs Evans buys a stocks and shares ISA and then changes her mind, how long does she normally have to cancel?","c":"14 calendar days","w":["30 calendar days","7 days","There is no right to cancel"],"e":"ISAs carry a 14-day cancellation right. Life, protection and pension products carry 30 days."}]},{"id":"c2-brightwater","unit":2,"title":"Pressure at Brightwater","text":"Sam is an adviser at Brightwater Financial. His manager announces a bonus for whoever sells the most of the firm's new in-house fund, which has higher charges than comparable funds. Sam's next client, Ruth, has a low capacity for loss. Separately, Sam notices that a colleague has been backdating client documents.","qs":[{"id":"c2-brightwater-1","t":"u2t4","q":"What is the ethical way for Sam to respond to the bonus scheme?","c":"Recommend only what is suitable for Ruth, whatever the bonus","w":["Recommend the fund to Ruth, as the firm has approved it","Recommend the fund but mention the bonus","Refuse to see Ruth"],"e":"The client's interests come first. Conduct Rule 4 and the Consumer Duty apply."},{"id":"c2-brightwater-2","t":"u2t2a","q":"From a regulatory point of view, the bonus scheme creates:","c":"A conflict of interest that the firm must identify and manage","w":["No issue, as long as the fund is legal and authorised","A data protection issue about sharing client details","A money laundering risk that must be reported"],"e":"Volume-based incentives on in-house products create conflicts under Principle 8 and SYSC 10."},{"id":"c2-brightwater-3","t":"u2t4","q":"Sam reasons: ‘Selling the fund helps the firm, my colleagues and shareholders, so the greater good outweighs Ruth's interests.’ Which approach is he (wrongly) applying?","c":"Utilitarian (consequentialist) reasoning","w":["Deontological (duty-based) reasoning","Virtue ethics (character-based) reasoning","Ethical relativism (culture-based) reasoning"],"e":"He is weighing overall outcomes for the greatest number, but his professional duty is to the individual client."},{"id":"c2-brightwater-4","t":"u2t4","q":"What should Sam do about his colleague backdating documents?","c":"Raise it with compliance and, if it isn't dealt with, make a protected disclosure to the FCA","w":["Ignore it, as it isn't his responsibility and he could lose his job by reporting it","Confront the colleague in front of the team so everyone knows it isn't acceptable","Contact the affected clients himself straight away and tell them what has happened"],"e":"Whistleblowing routes are protected by PIDA 1998, and the FCA is a prescribed person."},{"id":"c2-brightwater-5","t":"u2t2a","q":"If the fund's charges are high compared with its benefits, which Consumer Duty outcome is most at risk?","c":"Price and value","w":["Consumer support","Consumer understanding","None, as charges are disclosed"],"e":"Disclosure alone doesn't make a product fair value. Price must be reasonable compared with the benefits."}]},{"id":"c2-meadow","unit":2,"title":"A data slip at Meadow Mortgages","text":"On Tuesday morning, an adviser at Meadow Mortgages realises that the day before he emailed a client's full fact find, including income and health details, to a different client by mistake. The client whose data was sent is Ms Rahman.","qs":[{"id":"c2-meadow-1","t":"u2t2b","q":"What should the adviser do first?","c":"Report it internally straight away so it can be contained and assessed","w":["Delete the sent email and say nothing","Wait to see if anyone complains","Tell the wrong recipient to keep it confidential and take no further action"],"e":"Report it, for example to the data protection officer. Speed matters: the firm must assess the risk, contain the breach and decide whether to notify."},{"id":"c2-meadow-2","t":"u2t2b","q":"If the breach is likely to put Ms Rahman's rights and freedoms at risk, the firm must notify the ICO within:","c":"72 hours of becoming aware","w":["24 hours of becoming aware","One month of becoming aware","8 weeks of becoming aware"],"e":"Because the risk to her is high (financial and health data), Ms Rahman should also be told without undue delay."},{"id":"c2-meadow-3","t":"u2t2b","q":"Which UK GDPR principle has been breached?","c":"Integrity and confidentiality (security)","w":["Purpose limitation (use for stated purposes)","Storage limitation (keep no longer than needed)","Accuracy (keep data correct and up to date)"],"e":"Personal data must be protected against unauthorised disclosure."},{"id":"c2-meadow-4","t":"u2t2b","q":"Ms Rahman asks for a copy of all the personal data Meadow holds about her. The firm must normally respond within:","c":"One month","w":["40 days","8 weeks","72 hours"],"e":"This is a subject access request. It is usually free, and the deadline can be extended by two months for complex requests."},{"id":"c2-meadow-5","t":"u2t2b","q":"Ms Rahman complains, and the firm resolves it to her satisfaction by the close of the third business day after receiving the complaint. The firm can close it with:","c":"A summary resolution communication","w":["A final response letter within 8 weeks","A referral to the FOS","Nothing in writing"],"e":"An SRC confirms the resolution and reminds her of her right to go to the FOS."}]}],"cards":[{"t":"u1t2b","f":"Personal allowance 2026/27","b":"£12,570\nReduced by £1 for every £2 of income over £100,000, so it's gone at £125,140."},{"t":"u1t2b","f":"Income tax bands 2026/27 (England, Wales, NI)","b":"Basic 20%: first £37,700 of taxable income\nHigher 40%: £37,701 to £125,140\nAdditional 45%: over £125,140"},{"t":"u1t2b","f":"Starting rate for savings","b":"£5,000 at 0%\nLost £1 for £1 once non-savings income is over £12,570, so it's gone at £17,570."},{"t":"u1t2b","f":"Personal savings allowance","b":"Basic-rate taxpayer: £1,000\nHigher-rate taxpayer: £500\nAdditional-rate taxpayer: £0"},{"t":"u1t2b","f":"Dividend allowance and rates 2026/27","b":"Allowance £500\nBasic 10.75% · Higher 35.75% · Additional 39.35%\n(the basic and higher rates went up 2 points in April 2026)"},{"t":"u1t2b","f":"Order income is taxed in","b":"1. Non-savings (earnings, pensions, rent)\n2. Savings interest\n3. Dividends (always on top)"},{"t":"u1t2b","f":"Employee Class 1 NI 2026/27","b":"8% on £12,570 to £50,270\n2% above £50,270"},{"t":"u1t2b","f":"Employer Class 1 NI 2026/27","b":"15% above £5,000 a year (£96 a week)"},{"t":"u1t2b","f":"Class 4 NI (self-employed)","b":"6% on profits £12,570 to £50,270\n2% above"},{"t":"u1t2b","f":"CGT 2026/27","b":"Annual exempt amount £3,000 (most trusts £1,500)\n18% within basic rate band, 24% above\nResidential property: report and pay within 60 days"},{"t":"u1t2b","f":"CGT-exempt assets","b":"Main home (private residence relief), gilts, qualifying corporate bonds, ISAs, NS&I, private cars, chattels up to £6,000, gifts to spouse or charity. There is no CGT on death."},{"t":"u1t2b","f":"IHT bands and rates","b":"NRB £325,000 · RNRB £175,000 (tapers above £2m)\nDeath rate 40% (36% if 10%+ to charity)\nLifetime rate 20%\nDue 6 months after the end of the month of death"},{"t":"u1t2b","f":"IHT taper relief on failed PETs","b":"0–3 yrs: 40% (no relief)\n3–4 yrs: 32%\n4–5 yrs: 24%\n5–6 yrs: 16%\n6–7 yrs: 8%\n7+ yrs: exempt"},{"t":"u1t2b","f":"IHT lifetime exemptions","b":"Annual £3,000 (+1 year carry forward)\nSmall gifts £250 per person\nWedding: £5,000 parent · £2,500 grandparent · £1,000 anyone else\nNormal expenditure out of income\nSpouse and charity: unlimited"},{"t":"u1t2b","f":"High Income Child Benefit Charge","b":"1% of Child Benefit for every £200 of income over £60,000\nFully clawed back at £80,000\nBased on the higher earner's adjusted net income"},{"t":"u1t2b","f":"SDLT bands (England & NI)","b":"0% to £125k · 2% to £250k · 5% to £925k · 10% to £1.5m · 12% above\nFirst-time buyers: 0% to £300k, 5% to £500k (price cap £500k)\n+5% surcharge on additional homes"},{"t":"u1t2b","f":"Other taxes to remember","b":"VAT 20% (5% reduced, 0% zero)\nCorporation tax 25% main, 19% small profits\nIPT 12% standard, 20% higher (life cover exempt)\nScotland: LBTT · Wales: LTT"},{"t":"u1t2b","f":"Self-assessment dates","b":"Paper return: 31 October\nOnline return: 31 January\nPayments on account: 31 January and 31 July"},{"t":"u1t3","f":"New State Pension 2026/27","b":"£241.30 a week\n35 qualifying years for the full amount, 10 minimum\nDeferral: +1% per 9 weeks (about 5.8% a year)"},{"t":"u1t3","f":"Basic (old) State Pension 2026/27","b":"£184.90 a week, for those who reached State Pension age before 6 April 2016."},{"t":"u1t3","f":"Triple lock","b":"Increase is the highest of:\n• average earnings growth\n• CPI (September)\n• 2.5%"},{"t":"u1t3","f":"State Pension age","b":"66, rising to 67 between 2026 and 2028.\nRising to 68 between 2044 and 2046 (subject to review)."},{"t":"u1t3","f":"Pension Credit guarantee 2026/27","b":"Single £238.00 · Couple £363.25 a week\nMeans-tested"},{"t":"u1t3","f":"Child Benefit 2026/27","b":"Eldest or only child £27.05 a week\nEach additional child £17.90 a week"},{"t":"u1t3","f":"Statutory Sick Pay (from April 2026)","b":"Lower of £123.25 a week or 80% of average weekly earnings\nPaid from day 1, with no lower earnings limit\nMaximum 28 weeks"},{"t":"u1t3","f":"Statutory Maternity Pay","b":"39 weeks:\n6 weeks at 90% of average weekly earnings\n33 weeks at £194.32 (or 90% if lower)"},{"t":"u1t3","f":"Universal Credit capital limits","b":"Under £6,000: ignored\n£6,000 to £16,000: £4.35 a month assumed income per £250\nOver £16,000: no UC"},{"t":"u1t3","f":"Benefits UC replaces","b":"Income-based JSA, income-related ESA, Income Support, Housing Benefit, Child Tax Credit, Working Tax Credit"},{"t":"u1t3","f":"Contributory (NI-based) benefits","b":"New Style JSA (up to 182 days), New Style ESA, State Pension, Maternity Allowance, Bereavement Support Payment"},{"t":"u1t3","f":"Bereavement Support Payment","b":"Higher (with children): £3,500 + 18 × £350\nStandard: £2,500 + 18 × £100"},{"t":"u1t4b","f":"ISA allowances 2026/27","b":"Adult ISA £20,000 (cash ISA from 18)\nJunior ISA £9,000\nLifetime ISA £4,000 within the £20,000\nFrom April 2027: cash ISA capped at £12,000 for under-65s"},{"t":"u1t4b","f":"Lifetime ISA rules","b":"Open at 18 to 39, pay in until 50\n25% bonus (max £1,000 a year)\nFirst home up to £450,000, or from age 60\nOtherwise 25% withdrawal charge"},{"t":"u1t4b","f":"Premium Bonds","b":"Minimum £25, maximum £50,000\nPrizes tax-free\nNS&I is 100% backed by HM Treasury"},{"t":"u1t4b","f":"Unit trust vs OEIC vs investment trust","b":"Unit trust: open-ended, trust, trustee + manager, units\nOEIC: open-ended, company, ACD + depositary, shares\nInvestment trust: closed-ended listed company, can gear, discount/premium to NAV"},{"t":"u1t4b","f":"Onshore investment bond tax","b":"Fund taxed, so a 20% credit is given\n5% a year tax-deferred withdrawals for 20 years\nChargeable event gains: higher-rate payers owe 20% more (top-slicing may help)"},{"t":"u1t1","f":"Gilt classifications (DMO)","b":"Shorts: up to 7 years\nMediums: 7 to 15 years\nLongs: over 15 years\nPrice and yield move in opposite directions"},{"t":"u1t1","f":"Functions of money","b":"Medium of exchange\nStore of value\nUnit of account\nStandard of deferred payment"},{"t":"u1t1","f":"Financial intermediation","b":"Aggregation: pooling small deposits\nMaturity transformation: short-term deposits funding long-term loans\nRisk transformation: spreading risk across many borrowers"},{"t":"u1t2a","f":"Inflation target","b":"2% CPI, set by the Chancellor\nThe MPC (9 members) sets Bank Rate\nOpen letter if inflation is more than 1 point either side of target"},{"t":"u1t4c","f":"Pension allowances 2026/27","b":"Annual allowance £60,000 (carry forward 3 years)\nTaper to £10,000 min (threshold £200k / adjusted £260k)\nMPAA £10,000\nLSA £268,275 · LSDBA £1,073,100"},{"t":"u1t4c","f":"Pension access","b":"Normal minimum pension age 55, rising to 57 from 6 April 2028\n25% tax-free (up to LSA)\nNon-earners: £3,600 gross / £2,880 net\nPension Wise guidance from age 50"},{"t":"u1t4c","f":"Auto-enrolment 2026/27","b":"Age 22 to State Pension age, earning over £10,000\nQualifying earnings £6,240 to £50,270\nMinimum 8% total, employer at least 3%"},{"t":"u1t4c","f":"Death benefits from DC pensions","b":"Death before 75: usually tax-free (lump sums tested against LSDBA)\nDeath after 75: taxed at the recipient's marginal rate"},{"t":"u1t4c","f":"Consumer credit key numbers","b":"Section 75: £100 to £30,000\nCredit withdrawal right: 14 days\nPayday cap: 0.8% a day, 100% total cost\nDRO: debts up to £50,000\nBreathing space: 60 days"},{"t":"u1t5","f":"Joint tenants vs tenants in common","b":"Joint tenants: equal, right of survivorship, passes automatically\nTenants in common: shares can be unequal, pass by will or intestacy\nSever a joint tenancy by notice"},{"t":"u1t5","f":"Powers of attorney","b":"Ordinary POA: ends on loss of capacity\nLPA (from 1 Oct 2007): property & financial, or health & welfare; must be registered with the OPG\nEPA: pre-2007, still valid\nNo LPA: Court of Protection appoints a deputy"},{"t":"u1t5","f":"Essentials of a valid contract","b":"Offer and acceptance\nConsideration\nIntention to create legal relations\nCapacity\nLegality (and certainty)"},{"t":"u1t5","f":"Bankruptcy and IVAs","b":"Creditor petition: £5,000+\nDischarge usually after 12 months\nIVA: 75% by value of voting creditors, typically 5 years"},{"t":"u1t6","f":"Valid will (England & Wales)","b":"In writing, signed by a testator aged 18+ of sound mind\nTwo witnesses present at the same time\nA gift to a witness (or their spouse) fails\nMarriage revokes a will; divorce treats the ex as having died"},{"t":"u1t6","f":"Intestacy (England & Wales)","b":"Spouse + children: chattels + £322,000 + half the rest; children get the other half at 18\nSpouse, no children: spouse takes everything\nCohabitee: nothing automatic (can claim under the 1975 Act)\nThen: parents, siblings, and so on, then the Crown"},{"t":"u1t6","f":"Types of trust","b":"Bare: beneficiary absolutely entitled; gift is a PET\nInterest in possession: life tenant gets income, remainderman gets capital\nDiscretionary: trustees decide; entry 20%, periodic up to 6% every 10 years"},{"t":"u1t7","f":"Key regulatory dates","b":"1986 FS Act (SIB, SROs) · Big Bang 27 Oct 1986\nN2: 1 Dec 2001 (FSMA, FSA)\nM-Day: 31 Oct 2004 · GI: 14 Jan 2005\nFCA/PRA: 1 Apr 2013\nRDR: 31 Dec 2012 · MMR: 26 Apr 2014\nConsumer credit to FCA: 1 Apr 2014 · MCD: 21 Mar 2016\nSM&CR solo firms: 9 Dec 2019 · Brexit: 31 Dec 2020\nConsumer Duty: 31 Jul 2023"},{"t":"u1t8a","f":"FCA objectives","b":"Strategic: ensure relevant markets function well\nOperational: consumer protection, market integrity, effective competition\nSecondary: international competitiveness and growth"},{"t":"u1t8a","f":"PRA objectives","b":"General: safety and soundness of firms\nInsurance: policyholder protection\nSecondary: effective competition; international competitiveness and growth"},{"t":"u1t8a","f":"FCA enforcement","b":"Warning notice, then decision notice, then final notice\nRegulatory Decisions Committee decides; appeal to the Upper Tribunal\nSettlement discount up to 30%\nCan fine, censure, prohibit, withdraw authorisation, seek restitution, prosecute (not imprison)"},{"t":"u1t8b","f":"The 12 Principles for Businesses","b":"1 Integrity · 2 Skill, care & diligence · 3 Management & control · 4 Financial prudence · 5 Market conduct · 6 Customers' interests · 7 Communications · 8 Conflicts of interest · 9 Relationships of trust · 10 Clients' assets · 11 Relations with regulators · 12 Consumer Duty"},{"t":"u1t8b","f":"Individual Conduct Rules (COCON)","b":"1 Act with integrity\n2 Due skill, care and diligence\n3 Open and cooperative with regulators\n4 Treat customers fairly\n5 Proper standards of market conduct\n6 Act to deliver good outcomes for retail customers"},{"t":"u1t8b","f":"Threshold conditions","b":"Legal status · Location of offices · Effective supervision · Appropriate resources · Suitability · Business model"},{"t":"u1t8b","f":"Fit and proper (FIT)","b":"Honesty, integrity and reputation\nCompetence and capability\nFinancial soundness\nCertified staff assessed at least annually"},{"t":"u2t2a","f":"Consumer Duty","b":"Principle 12: deliver good outcomes for retail customers\nCross-cutting rules: good faith · avoid foreseeable harm · enable and support\nOutcomes: products & services · price & value · consumer understanding · consumer support\nBoard report at least annually"},{"t":"u2t2a","f":"TCF six outcomes","b":"1 Fair treatment central to culture\n2 Products meet target market needs\n3 Clear information\n4 Suitable advice\n5 Products perform as expected\n6 No unreasonable post-sale barriers"},{"t":"u2t2b","f":"Money laundering stages","b":"Placement: cash into the system\nLayering: disguise the trail\nIntegration: appears legitimate"},{"t":"u2t2b","f":"POCA penalties (regulated sector)","b":"Principal offences: 14 years\nFailure to disclose: 5 years\nTipping off: 2 years"},{"t":"u2t2b","f":"AML reporting","b":"Staff report to MLRO, who sends SAR to the NCA\nDAML: 7 working days notice, then 31-day moratorium if refused\nRecords kept 5 years after the relationship ends"},{"t":"u2t2b","f":"Data protection key numbers","b":"Subject access request: 1 month (+2 if complex)\nBreach report to ICO: 72 hours\nMax fine: £17.5m or 4% of worldwide turnover"},{"t":"u2t2b","f":"Complaints (DISP)","b":"Oral or written\nSummary resolution: by close of the 3rd business day\nFinal response: 8 weeks\nRefer to FOS within 6 months\nFOS time limit: 6 years from event or 3 years from awareness"},{"t":"u2t2b","f":"FOS award limits (from 1 April 2026)","b":"£455,000 for acts on or after 1 April 2019\n£205,000 for acts before 1 April 2019\nBinding on the firm if the customer accepts"},{"t":"u2t2b","f":"FSCS limits","b":"Deposits £120,000 per person per bank (since 1 Dec 2025)\nTemporary high balances £1.4m for 6 months\nInvestments and mortgage advice £85,000\nCompulsory and long-term insurance 100%\nOther general insurance 90%"},{"t":"u2t3","f":"Cancellation periods","b":"30 days: life, pure protection, personal and stakeholder pensions\n14 days: other investments (ISAs), general insurance, consumer credit, distance contracts"},{"t":"u2t3","f":"Vulnerability drivers (FCA)","b":"Health\nLife events\nResilience\nCapability"},{"t":"u2t3","f":"Independent vs restricted advice","b":"Independent: comprehensive, fair analysis of the relevant market; unbiased, unrestricted\nRestricted: anything else (limited products or providers)\nRetail investment advice: adviser charges, no commission"},{"t":"u2t3","f":"Client categories (most to least protected)","b":"Retail client\nProfessional client (per se or elective)\nEligible counterparty"},{"t":"u2t4","f":"Ethical theories","b":"Deontology: duty and rules (Kant)\nUtilitarianism: greatest good for the greatest number (Bentham, Mill)\nVirtue ethics: character (Aristotle)\nRelativism: depends on culture\nEgoism: self-interest"},{"t":"u2t4","f":"Whistleblowing","b":"Public Interest Disclosure Act 1998\nFCA and PRA are prescribed persons\nBanks and insurers: whistleblowers' champion\nNo gagging clauses"},{"t":"u2t4","f":"CPD and SPS (retail investment advisers)","b":"35 hours CPD a year, 21 structured\nStatement of Professional Standing issued annually by an accredited body (such as LIBF or CII)"}]};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
function daysLeft(){const n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((new Date(2026,10,16)-t)/86400000);}
function rec(id){return S.q[id];}
function seen(id){return !!S.q[id];}
function lastOk(id){const r=S.q[id];return r?r.l===1:false;}

function topicStats(tid){
  const qs=ALL.filter(q=>q.t===tid);
  let s=0,ok=0;qs.forEach(q=>{if(seen(q.id)){s++;if(lastOk(q.id))ok++;}});
  return {total:qs.length, seen:s, ok, pct: s?Math.round(100*ok/s):null};
}
function unitStats(u){
  const qs=ALL.filter(q=>unitOf(q)===u);let s=0,ok=0;qs.forEach(q=>{if(seen(q.id)){s++;if(lastOk(q.id))ok++;}});
  return {total:qs.length,seen:s,ok,pct:s?Math.round(100*ok/s):null};
}
function weakIds(){return ALL.filter(q=>{const r=S.q[q.id];return r && (r.l===0 || (r.n>=2 && r.k/r.n<0.5));}).map(q=>q.id);}
function answeredToday(){return S.days[todayStr()]||0;}
function streakDays(){let n=0;const d=new Date();for(;;){if(S.days[ymd(d)]){n++;d.setDate(d.getDate()-1);}else break;}return n;}

/* priority: unseen first, then last-wrong, then the rest; random within */
function prioritise(ids){
  const g=[[],[],[]];
  shuffle(ids).forEach(id=>{const r=S.q[id]; g[!r?0:(r.l===0?1:2)].push(id);});
  return [...g[0],...g[1],...g[2]];
}

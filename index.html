  const html=TABS.map(([k,l])=>`<button type="button" data-tab="${k}" ${k===cur?'aria-current="page"':''}>${IC[k]}<span>${k==='mock'?'Mock':k==='cards'?'Cards':k==='figures'?'Figures':l}</span></button>`).join('');
  $('#tabsMob').innerHTML=html; $('#tabsDesk').innerHTML=html;
}
function renderCount(){
  const d=daysLeft(); const el=$('#count');
  el.textContent = d>1? d+' days to go' : d===1? 'Exam tomorrow' : d===0? 'Exam day' : 'Exam done';
}
function render(){
  renderCount();
  if(SESSION){ renderTabs(SESSION.mode==='mock'?'mock':'practise'); return SESSION.done? renderResults() : renderQuiz(); }
  const r=route(); renderTabs(r);
  ({today:renderToday, practise:renderPractise, mock:renderMock, cards:renderCards, figures:renderFigures})[r]();
}
window.addEventListener('hashchange',()=>{ if(SESSION && !SESSION.done){ SESSION.leaveAsk=true; renderQuiz(); return; } SESSION=null; render(); window.scrollTo(0,0); });

/* ---------- Today ---------- */
function planIndexToday(){
  const t=todayStr();
  for(let i=PLAN.length-1;i>=0;i--){ if(t>=PLAN[i].date) return i; }
  return 0;
}
function greeting(){const h=new Date().getHours();return h<12?'Morning':h<18?'Afternoon':'Evening';}
function renderToday(){
  const pi=planIndexToday(), p=PLAN[pi], d=daysLeft();
  const u1=unitStats(1), u2=unitStats(2), weak=weakIds().length;
  const intro = d>0 ? `${d} ${d===1?'day':'days'} until your exam on Monday 16 November. Here is today’s plan.` : d===0 ? 'It’s exam day. Keep it light this morning.' : 'The exam is done. You can keep using this to brush up.';
  let planBtns='';
  if(p.topics) planBtns+=`<button class="btn primary" data-act="plan" data-i="${pi}">Practise today’s topics</button>`;
  if(p.mock) planBtns+=`<button class="btn" data-act="mockstart" data-u="${p.mock}">Unit ${p.mock} mock exam</button>`;
  if(p.act==='baseline') planBtns+=`<button class="btn primary" data-act="mixed" data-n="20">Start 20 mixed questions</button>`;
  if(p.act==='final') planBtns+=`<button class="btn primary" data-act="weak" ${weak?'':'disabled'}>Weak spots (${weak})</button><button class="btn" data-act="mockstart" data-u="1">Unit 1 mock</button><button class="btn" data-act="mockstart" data-u="2">Unit 2 mock</button>`;
  if(p.act==='exam') planBtns+=`<button class="btn primary" data-go="cards">Key figures flashcards</button>`;
  const lastMock=u=>{const m=S.mocks.filter(x=>x.unit===u).slice(-1)[0];return m?`${m.score}/${m.total} (${Math.round(100*m.score/m.total)}%)`:'Not taken';};
  const week=PLAN.map((x,i)=>`<div class="day ${i===pi?'now':(i<pi?'past':'')}"><div class="d">${esc(x.label.split(' ')[0])}<b>${esc(x.label.split(' ')[1]||'')}</b></div><div><div class="t">${esc(x.title)}</div><p class="muted">${esc(x.text)}</p></div></div>`).join('');
  $('#view').innerHTML=`<div class="stack">
    <div class="hello"><h1>${greeting()}, Gill.</h1><p>${intro}</p></div>
    <div class="panel today-plan"><div class="label">${esc(p.label)} · Today</div><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p><div class="row wrapr">${planBtns}</div></div>
    <div class="tiles">
      <button class="tile" data-act="mixed" data-n="10"><b>Quick 10</b><span>Ten mixed questions from both units</span></button>
      <button class="tile" data-act="weak" ${weak?'':'disabled'}><span class="big">${weak}</span><b>Weak spots</b><span>${weak?'Questions you got wrong last time':'Nothing yet. Wrong answers land here.'}</span></button>
      <button class="tile" data-go="mock"><b>Mock exam</b><span>40 questions, 60 minutes, like the real thing</span></button>
      <button class="tile" data-go="cards"><b>Flashcards</b><span>${D.cards.length} cards of key figures and lists</span></button>
    </div>
    <div class="section"><div class="label">Progress</div>
      <div class="stats">
        <div class="stat"><div class="v tnum">${answeredToday()}</div><div class="k">answered today</div></div>
        <div class="stat"><div class="v tnum">${u1.pct===null?'–':u1.pct+'%'}</div><div class="k">Unit 1 right · ${u1.seen}/${u1.total} seen</div></div>
        <div class="stat"><div class="v tnum">${u2.pct===null?'–':u2.pct+'%'}</div><div class="k">Unit 2 right · ${u2.seen}/${u2.total} seen</div></div>
      </div>
      <p class="note">Last mock: Unit 1 <b>${lastMock(1)}</b> · Unit 2 <b>${lastMock(2)}</b>. The pass mark is 70% (28 of 40) for each unit.</p>
    </div>
    <div class="section"><div class="label">The week</div><div class="week">${week}</div></div>
    <p class="note">${ALL.length} practice questions and ${D.cards.length} flashcards, written for the 2026/27 syllabus and mapped to the pages of your Beacon book. They are practice questions, not real LIBF exam questions. Progress is saved in this browser only.</p>
  </div>`;
}

/* ---------- Practise ---------- */

/* ---------- Session engine ---------- */
function makeItem(id){
  const q=QBY[id]; const opts=shuffle([q.c,...q.w]);
  return {id, opts, ans:opts.indexOf(q.c), pick:null};
}
function startSession(o){
  SESSION={mode:o.mode||'practice', title:o.title, items:o.ids.map(makeItem), i:0, unit:o.unit||null, started:Date.now(), ends:o.minutes?Date.now()+o.minutes*60000:null, flags:{}, done:false};
  if(SESSION.ends) startTimer();
  render(); window.scrollTo(0,0); $('#view').focus({preventScroll:true});
}
function practiceIds(pool,n){return prioritise(pool).slice(0,n);}
function startTopic(tid,n){const pool=ALL.filter(q=>q.t===tid).map(q=>q.id);startSession({title:T[tid].name, ids:practiceIds(pool,n)});}
function startMixed(n,unit){const pool=ALL.filter(q=>!unit||unitOf(q)===unit).map(q=>q.id);startSession({title:unit?`Unit ${unit} mixed`:'Mixed questions', ids:practiceIds(pool,n)});}
function startWeak(){const ids=shuffle(weakIds()).slice(0,20); if(ids.length) startSession({title:'Weak spots', ids});}
function startPlan(i){const p=PLAN[i];const pool=ALL.filter(q=>p.topics.includes(q.t)).map(q=>q.id);startSession({title:p.title, ids:practiceIds(pool,20)});}
function startCase(cid){const c=CASE[cid];startSession({title:c.title, ids:c.qs.map(q=>q.id)});}
function buildMock(u){
  const ts=TOPICS.filter(t=>t.unit===u);
  const alloc={}; ts.forEach(t=>alloc[t.id]=Math.floor(25/ts.length));
  let rem=25-Object.values(alloc).reduce((a,b)=>a+b,0);
  const bySize=ts.slice().sort((a,b)=>D.qs.filter(q=>q.t===b.id).length-D.qs.filter(q=>q.t===a.id).length);
  for(let i=0;rem>0;i++,rem--) alloc[bySize[i%bySize.length].id]++;
  let ids=[]; ts.forEach(t=>{ ids.push(...prioritise(D.qs.filter(q=>q.t===t.id).map(q=>q.id)).slice(0,alloc[t.id])); });
  ids=shuffle(ids);
  const cs=D.cases.filter(c=>c.unit===u).map(c=>({c,n:c.qs.filter(q=>seen(q.id)).length,r:Math.random()})).sort((a,b)=>a.n-b.n||a.r-b.r).slice(0,3).map(x=>x.c);
  cs.forEach(c=>ids.push(...c.qs.map(q=>q.id)));
  return ids;
}
function startMock(u){startSession({mode:'mock', unit:u, title:`Unit ${u} mock · ${UNIT[u].code}`, ids:buildMock(u), minutes:60});}

function startTimer(){ clearInterval(timerId); timerId=setInterval(()=>{ if(!SESSION||!SESSION.ends||SESSION.done){clearInterval(timerId);return;} const left=SESSION.ends-Date.now(); const el=$('#timer'); if(el){el.textContent=fmt(left); el.classList.toggle('low',left<5*60000);} if(left<=0){ finishSession(); } },1000); }
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return pad(m)+':'+pad(s);}

function recordAnswer(id,ok){
  const r=S.q[id]||{n:0,k:0,l:0,t:0}; r.n++; if(ok)r.k++; r.l=ok?1:0; r.t=Date.now(); S.q[id]=r;
  const d=todayStr(); S.days[d]=(S.days[d]||0)+1; save();
}
function pick(i){
  const s=SESSION, it=s.items[s.i];
  if(s.mode==='practice'){ if(it.pick!==null) return; it.pick=i; recordAnswer(it.id, i===it.ans); }
  else { it.pick=i; }
  renderQuiz();
}
function finishSession(){
  const s=SESSION; if(!s||s.done) return;
  if(s.mode==='mock'){
    s.items.forEach(it=>{ if(it.pick!==null) recordAnswer(it.id, it.pick===it.ans); });
    const score=s.items.filter(it=>it.pick===it.ans).length;
    const byTopic={}; s.items.forEach(it=>{const t=QBY[it.id].t; byTopic[t]=byTopic[t]||[0,0]; byTopic[t][1]++; if(it.pick===it.ans) byTopic[t][0]++;});
    S.mocks.push({unit:s.unit, score, total:s.items.length, date:Date.now(), secs:Math.round((Date.now()-s.started)/1000), byTopic}); save();
  }
  s.done=true; s.review='wrong'; clearInterval(timerId); render(); window.scrollTo(0,0);
}

function renderQuiz(){
  const s=SESSION, it=s.items[s.i], q=QBY[it.id], t=T[q.t], n=s.items.length;
  const answered=it.pick!==null, mock=s.mode==='mock', reveal=!mock&&answered;
  const segs=s.items.length<=60? `<div class="segs" aria-hidden="true">${s.items.map((x,j)=>{let c=''; if(j===s.i)c='cur'; else if(x.pick!==null) c=mock?'ans':(x.pick===x.ans?'ok':'no'); return `<i class="${c}"></i>`;}).join('')}</div>`:'';
  const cs=q.cs?CASE[q.cs]:null;
  const caseBox=cs?`<details class="case" ${s.caseOpen!==false?'open':''} data-act="caseToggle"><summary><span class="label">Case study</span><span>${esc(cs.title)}</span></summary><p class="ct">${esc(cs.text)}</p></details>`:'';
  const opts=it.opts.map((o,j)=>{
    let cls='opt', mk='';
    if(reveal){ if(j===it.ans){cls+=' right';mk='✓';} else if(j===it.pick){cls+=' wrong';mk='✗';} }
    else if(it.pick===j) cls+=' sel';
    return `<button class="${cls}" data-act="pick" data-j="${j}" ${reveal?'disabled':''} aria-label="${'ABCD'[j]}: ${esc(o)}"><span class="bub">${'ABCD'[j]}</span><span>${esc(o)}</span><span class="mk">${mk}</span></button>`;
  }).join('');
  const why=reveal?`<div class="why ${it.pick===it.ans?'ok':'no'}" role="status"><div class="verdict">${it.pick===it.ans?'Correct':'Not quite'}</div><p>${it.pick===it.ans?'':'The answer is <b>'+esc(q.c)+'</b>. '}${esc(q.e)}</p><div class="rev mono">Revise: Unit ${t.unit}, Topic ${t.code} ${esc(t.name)} · book p.${t.pages}</div></div>`:'';
  const last=s.i===n-1;
  let nav='';
  if(mock){
    nav=`<div class="qnav"><button class="btn" data-act="prev" ${s.i===0?'disabled':''}>← Back</button><button class="btn ghost small" data-act="flag">${s.flags[s.i]?'Unflag':'Flag for review'}</button><span class="grow"></span>${last?`<button class="btn primary" data-act="submitAsk">Finish</button>`:`<button class="btn primary" data-act="next">Next →</button>`}</div>`;
  } else {
    nav=`<div class="qnav"><span class="grow mono muted" style="font-size:13px">${s.items.filter(x=>x.pick===x.ans).length} right so far</span>${answered?(last?`<button class="btn primary" data-act="finish">See results</button>`:`<button class="btn primary" data-act="next">Next →</button>`):''}</div>`;
  }
  const unanswered=s.items.filter(x=>x.pick===null).length;
  const confirm = s.submitAsk? `<div class="confirm" role="alertdialog"><p><b>Finish the mock now?</b> ${unanswered?`${unanswered} question${unanswered>1?'s are':' is'} unanswered and will be marked wrong.`:'All questions are answered.'}</p><div class="row wrapr"><button class="btn primary" data-act="submit">Finish and mark</button><button class="btn" data-act="submitCancel">Keep going</button></div></div>`:'';
  const leave = s.leaveAsk? `<div class="confirm" role="alertdialog"><p><b>Leave this ${mock?'mock':'session'}?</b> ${mock?'This mock won’t be marked.':'Answers so far are saved.'}</p><div class="row wrapr"><button class="btn primary" data-act="leave">Leave</button><button class="btn" data-act="stay">Stay</button></div></div>`:'';
  const grid = mock? `<div class="panel" style="padding:14px"><div class="row" style="margin-bottom:10px"><div class="label grow">Answer sheet</div><span class="mono muted" style="font-size:12px">${n-unanswered}/${n} answered</span></div><div class="grid40">${s.items.map((x,j)=>`<button class="gcell ${x.pick!==null?'ans':''} ${j===s.i?'cur':''} ${s.flags[j]?'flag':''}" data-act="goto" data-j="${j}" aria-label="Question ${j+1}">${j+1}</button>`).join('')}</div><p class="note" style="margin:10px 0 0">Questions 26–40 are the three case studies.</p></div>`:'';
  $('#view').innerHTML=`<div class="stack">
    <div><div class="qhead"><button class="btn ghost small" data-act="leaveAsk" aria-label="Leave">✕</button><div class="grow"><div class="label">${esc(s.title)}</div><div class="mono" style="font-size:14px;font-weight:600">Question ${s.i+1} of ${n}</div></div>${mock?`<div class="timer tnum" id="timer">${fmt(s.ends-Date.now())}</div>`:''}</div>${segs}</div>
    ${leave}${confirm}
    ${caseBox}
    <div class="qcard"><div class="qmeta"><span class="label">U${t.unit} · T${t.code} · ${esc(t.name)}</span></div><p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div>${why}${nav}</div>
    ${grid}
    ${mock?'':`<p class="note kbd">Keys: 1–4 or A–D to answer, Enter for next.</p>`}
  </div>`;
}

function renderResults(){
  const s=SESSION, n=s.items.length, score=s.items.filter(it=>it.pick===it.ans).length, pct=Math.round(100*score/n), mock=s.mode==='mock';
  const band=pct>=90?'Distinction':pct>=80?'Merit':pct>=70?'Pass':'Below pass mark';
  const by={}; s.items.forEach(it=>{const t=QBY[it.id].t; by[t]=by[t]||[0,0]; by[t][1]++; if(it.pick===it.ans) by[t][0]++;});
  const rows=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([tid,[ok,tot]])=>`<tr><td>T${T[tid].code} ${esc(T[tid].name)}</td><td class="r">${ok}/${tot}</td><td class="r">p.${T[tid].pages}</td></tr>`).join('');
  const list=s.items.filter(it=>s.review==='all'||it.pick!==it.ans);
  const rv=list.map(it=>{const q=QBY[it.id];const j=s.items.indexOf(it);return `<div class="rv"><div class="label">Q${j+1} · T${T[q.t].code} ${esc(T[q.t].name)}${q.cs?' · '+esc(CASE[q.cs].title):''}</div><div class="q">${esc(q.q)}</div>${it.pick===it.ans?`<div class="a c">✓ ${esc(q.c)}</div>`:`<div class="a y">✗ ${it.pick===null?'Not answered':esc(it.opts[it.pick])}</div><div class="a c">✓ ${esc(q.c)}</div>`}<div class="e">${esc(q.e)}</div></div>`;}).join('') || '<p class="note">Nothing to show. Every answer was right.</p>';
  const wrongIds=s.items.filter(it=>it.pick!==it.ans).map(it=>it.id);
  const mins=Math.round((Date.now()-s.started)/60000);
  $('#view').innerHTML=`<div class="stack">
    <div><div class="label">${esc(s.title)} · results</div>
      <div class="score" style="margin-top:8px"><span class="n tnum">${score}/${n}</span><span class="mono" style="font-size:20px;font-weight:600">${pct}%</span>${mock?`<span class="band ${pct>=70?'pass':'fail'}">${band}</span>`:''}</div>
      <p class="muted" style="margin:8px 0 0">${mock?(pct>=70?`That’s a pass: the real exam needs 28 out of 40. Finished in ${mins} minute${mins===1?'':'s'}.`:`The pass mark is 28 out of 40 (70%). You needed ${Math.max(0,Math.ceil(0.7*n)-score)} more. The weakest topics are listed first below.`):(pct>=70?'Nice work. Anything you got wrong is now in your weak spots.':'Anything you got wrong is now in your weak spots, ready for another go.')}</p>
    </div>
    <div class="row wrapr">
      ${wrongIds.length?`<button class="btn primary" data-act="retry">Try the ${wrongIds.length} wrong again</button>`:''}
      ${mock?`<button class="btn" data-act="mockstart" data-u="${s.unit}">New Unit ${s.unit} mock</button>`:''}
      <button class="btn" data-act="home">Done</button>
    </div>
    <div class="panel" style="padding:8px 8px 4px"><div class="scroll"><table class="tbl"><thead><tr><th>Topic</th><th class="r">Score</th><th class="r">Book</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="section"><div class="row wrapr"><div class="label grow">Review</div><div class="chips"><button class="chip" data-act="rv" data-v="wrong" aria-pressed="${s.review==='wrong'}">Wrong only</button><button class="chip" data-act="rv" data-v="all" aria-pressed="${s.review==='all'}">All</button></div></div><div class="review">${rv}</div></div>
  </div>`;
  SESSION.wrongIds=wrongIds;
}

/* ---------- Mock landing ---------- */

    <div class="tiles">
      <button class="tile" data-act="mockstart" data-u="1"><span class="label">FRE1</span><b>Unit 1 mock</b><span>Regulation, legislation and key parties · 40 questions · 60 min</span></button>

  </div>`;
}

/* ---------- Flashcards ---------- */
let FC={filter:'all', onlyNew:false, order:null, i:0, flip:false};
function deck(){
  let idx=D.cards.map((c,i)=>i).filter(i=>FC.filter==='all'||T[D.cards[i].t].unit===+FC.filter);
  if(FC.onlyNew) idx=idx.filter(i=>!S.cards[i]);
  return idx;
}
function renderCards(){
  if(!FC.order){FC.order=shuffle(D.cards.map((c,i)=>i));}
  const dk=deck(); const ord=FC.order.filter(i=>dk.includes(i));
  if(FC.i>=ord.length) FC.i=0;
  const known=D.cards.filter((c,i)=>S.cards[i]).length;
  const ci=ord[FC.i]; const c=ci!==undefined?D.cards[ci]:null;
  $('#view').innerHTML=`<div class="stack">
    <div><h1>Flashcards</h1><p class="muted" style="margin:6px 0 0">Tap the card to flip it. ${known} of ${D.cards.length} marked as known.</p></div>
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-act="fcf" data-v="all" aria-pressed="${FC.filter==='all'}">All</button>
      <button class="chip" data-act="fcf" data-v="1" aria-pressed="${FC.filter==='1'}">Unit 1</button>
      <button class="chip" data-act="fcf" data-v="2" aria-pressed="${FC.filter==='2'}">Unit 2</button>
      <button class="chip" data-act="fcnew" aria-pressed="${FC.onlyNew}">Not known yet</button>
    </div>
    ${c?`<div class="fc ${FC.flip?'flip':''}" id="fc"><div class="fc-in" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      <div class="face front"><span class="label">U${T[c.t].unit} · T${T[c.t].code} ${esc(T[c.t].name)}</span><div class="ft">${esc(c.f)}</div><span class="hint">Tap to reveal · ${FC.i+1} of ${ord.length}</span></div>
      <div class="face back"><span class="label">${esc(c.f)}</span><p class="bt">${esc(c.b)}</p><span class="hint">Book p.${T[c.t].pages}</span></div>
    </div></div>
    <div class="row wrapr"><button class="btn grow" data-act="fcagain">Again</button><button class="btn primary grow" data-act="fcknow">Got it</button></div>
    <div class="row"><button class="btn ghost small" data-act="fcprev">← Previous</button><span class="grow"></span><button class="btn ghost small" data-act="fcshuffle">Shuffle</button><button class="btn ghost small" data-act="fcreset" ${FC.resetAsk?'style="color:var(--bad)"':''}>${FC.resetAsk?'Tap again to reset':'Reset known'}</button></div>`
    :`<div class="panel"><h3>All done</h3><p class="muted" style="margin:6px 0 12px">You’ve marked every card in this set as known.</p><button class="btn" data-act="fcreset">Start again</button></div>`}
  </div>`;
  fitCard();
}
function fitCard(){const fc=$('#fc'); if(!fc) return; const inn=fc.querySelector('.fc-in'); const f=fc.querySelectorAll('.face'); let h=280; f.forEach(x=>{x.style.position='relative'; h=Math.max(h,x.scrollHeight); x.style.position='';}); inn.style.minHeight=h+'px';}
function fcNext(known){ const dk=deck(); const ord=FC.order.filter(i=>dk.includes(i)); const ci=ord[FC.i]; if(ci===undefined) return; if(known!==undefined){ if(known) S.cards[ci]=1; else delete S.cards[ci]; save(); } FC.flip=false; if(FC.onlyNew && known){ /* card leaves the deck */ } else FC.i++; renderCards(); }

/* ---------- Figures ---------- */
function renderFigures(){
  $('#view').innerHTML=`<div class="stack">
    <div><h1>Key figures</h1><p class="note" style="margin-top:6px">These are the <b>2026/27</b> figures, the tax year you're sitting the exam in. If your course book shows different numbers, it may have been printed for an earlier tax year.</p></div>
    ${FIGURES.map(f=>`<div class="panel fig" style="padding:14px 14px 6px"><h3>${esc(f.title)}</h3><div class="scroll"><table class="tbl"><tbody>${f.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ const k=tab.dataset.tab; if(SESSION && !SESSION.done){ SESSION.leaveAsk=true; SESSION.leaveTo=k; renderQuiz(); window.scrollTo(0,0); return;} SESSION=null; if(location.hash==='#'+k) render(); else location.hash=k; window.scrollTo(0,0); return; }
  const go=e.target.closest('[data-go]'); if(go){ SESSION=null; const k=go.dataset.go; if(location.hash==='#'+k) render(); else location.hash=k; window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return; const act=a.dataset.act;
  switch(act){
    case 'pu': PU=+a.dataset.u; renderPractise(); break;
    case 'topic': renderTopicPick(a.dataset.t); window.scrollTo(0,0); break;
    case 'go-topic': startTopic(a.dataset.t,+a.dataset.n); break;
    case 'mixed': startMixed(+a.dataset.n); break;
    case 'unitmix': startMixed(20,+a.dataset.u); break;
    case 'weak': startWeak(); break;
    case 'plan': startPlan(+a.dataset.i); break;
    case 'case': startCase(a.dataset.c); break;
    case 'mockstart': startMock(+a.dataset.u); break;
    case 'pick': pick(+a.dataset.j); break;
    case 'next': if(SESSION.i<SESSION.items.length-1){SESSION.i++; renderQuiz(); scrollQ();} break;
    case 'prev': if(SESSION.i>0){SESSION.i--; renderQuiz(); scrollQ();} break;
    case 'goto': SESSION.i=+a.dataset.j; renderQuiz(); scrollQ(); break;
    case 'flag': SESSION.flags[SESSION.i]=!SESSION.flags[SESSION.i]; renderQuiz(); break;
    case 'finish': finishSession(); break;
    case 'submitAsk': SESSION.submitAsk=true; renderQuiz(); window.scrollTo(0,0); break;
    case 'submitCancel': SESSION.submitAsk=false; renderQuiz(); break;
    case 'submit': finishSession(); break;
    case 'leaveAsk': SESSION.leaveAsk=true; renderQuiz(); window.scrollTo(0,0); break;
    case 'stay': SESSION.leaveAsk=false; SESSION.leaveTo=null; if(location.hash.slice(1)!==route()){} renderQuiz(); break;
    case 'leave': { const to=SESSION.leaveTo; SESSION=null; clearInterval(timerId); if(to && location.hash!=='#'+to) location.hash=to; else render(); window.scrollTo(0,0); break; }
    case 'home': SESSION=null; if(location.hash==='#today'||!location.hash) render(); else location.hash='today'; window.scrollTo(0,0); break;
    case 'retry': { const ids=shuffle(SESSION.wrongIds); startSession({title:'Wrong answers', ids}); break; }
    case 'rv': SESSION.review=a.dataset.v; renderResults(); break;
    case 'fcf': FC.filter=a.dataset.v; FC.i=0; FC.flip=false; renderCards(); break;
    case 'fcnew': FC.onlyNew=!FC.onlyNew; FC.i=0; FC.flip=false; renderCards(); break;
    case 'flip': FC.flip=!FC.flip; $('#fc').classList.toggle('flip',FC.flip); break;
    case 'fcknow': fcNext(true); break;
    case 'fcagain': fcNext(false); break;
    case 'fcprev': FC.i=Math.max(0,FC.i-1); FC.flip=false; renderCards(); break;
    case 'fcshuffle': FC.order=shuffle(D.cards.map((c,i)=>i)); FC.i=0; FC.flip=false; renderCards(); break;
    case 'fcreset': if(!FC.resetAsk && Object.keys(S.cards).length){ FC.resetAsk=true; renderCards(); setTimeout(()=>{FC.resetAsk=false;},4000); break; } FC.resetAsk=false; S.cards={}; save(); FC.i=0; FC.flip=false; renderCards(); break;
  }
});
document.addEventListener('toggle',e=>{ if(e.target.matches && e.target.matches('details.case') && SESSION){ SESSION.caseOpen=e.target.open; } },true);
function scrollQ(){ const c=document.querySelector('.case')||document.querySelector('.qcard'); if(c){ const y=c.getBoundingClientRect().top+window.scrollY-90; if(y<window.scrollY) window.scrollTo({top:Math.max(0,y)}); } }
document.addEventListener('keydown',e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(SESSION && !SESSION.done){
    const k=e.key.toLowerCase(); const idx='1234'.indexOf(k)>-1?'1234'.indexOf(k):'abcd'.indexOf(k);
    if(idx>-1 && !e.metaKey && !e.ctrlKey){ const it=SESSION.items[SESSION.i]; if(SESSION.mode==='mock'||it.pick===null){ pick(idx); e.preventDefault(); } return; }
    if(k==='enter' || k==='arrowright'){ const it=SESSION.items[SESSION.i]; if(SESSION.mode==='mock'||it.pick!==null){ if(SESSION.i<SESSION.items.length-1){SESSION.i++;renderQuiz();scrollQ();} else if(SESSION.mode==='practice') finishSession(); e.preventDefault(); } return; }
    if(k==='arrowleft' && SESSION.mode==='mock' && SESSION.i>0){ SESSION.i--; renderQuiz(); return; }
    if(k==='f' && SESSION.mode==='mock'){ SESSION.flags[SESSION.i]=!SESSION.flags[SESSION.i]; renderQuiz(); }
  } else if(route()==='cards' && !SESSION){
    if(e.key===' '||e.key==='Enter'){ if(document.activeElement && document.activeElement.closest('.fc-in')||document.activeElement===document.body||document.activeElement===$('#view')){ e.preventDefault(); FC.flip=!FC.flip; const f=$('#fc'); if(f) f.classList.toggle('flip',FC.flip);} }
    if(e.key==='ArrowRight') fcNext(true); if(e.key==='ArrowLeft'){FC.i=Math.max(0,FC.i-1);FC.flip=false;renderCards();}
  }
});
window.addEventListener('resize',()=>{ if(route()==='cards'&&!SESSION) fitCard(); });
render();
</script>

</body>
</html>
